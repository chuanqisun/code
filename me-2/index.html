<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>me-2</title>
  </head>
  <body>
    <header>
      <label>Groq key: <input id="groqKey" name="groqKey" type="password" placeholder="gsk_..." /></label>
      <label>ElevenLabs key: <input id="elevenKey" name="elevenKey" type="password" placeholder="xi-api-key" /></label>
      <label>Voice ID: <input id="voiceId" name="elevenVoice" value="LRBMsOzRzI614MxPFGIY" /></label>
      <label
        >Input:
        <select id="audioInput" aria-label="Audio input device"></select
      ></label>
      <label
        >Output:
        <select id="audioOutput" aria-label="Audio output device"></select
      ></label>
      <label
        >iOS Keypad: <input id="keyCaptureInput" type="text" inputmode="numeric" autocomplete="off" placeholder="Tap here for iOS virtual keypad capture"
      /></label>
    </header>

    <section class="controls">
      <button id="talk">Press to talk</button>
      <button id="cancel">Cancel</button>
      <button id="clearThread">Clear Thread</button>
      <span id="rec">● REC</span>
      <span id="status">Ready</span>
    </section>

    <section class="keypad-section" id="keypadContainer">
      <div class="keypad-grid">
        <button type="button" class="keypad-btn" data-slot="0"><span class="num">0</span></button>
        <button type="button" class="keypad-btn" data-slot="1"><span class="num">1</span></button>
        <button type="button" class="keypad-btn" data-slot="2"><span class="num">2</span></button>
        <button type="button" class="keypad-btn" data-slot="3"><span class="num">3</span></button>
        <button type="button" class="keypad-btn" data-slot="4"><span class="num">4</span></button>
        <button type="button" class="keypad-btn" data-slot="5"><span class="num">5</span></button>
        <button type="button" class="keypad-btn" data-slot="6"><span class="num">6</span></button>
        <button type="button" class="keypad-btn" data-slot="7"><span class="num">7</span></button>
        <button type="button" class="keypad-btn" data-slot="8"><span class="num">8</span></button>
        <button type="button" class="keypad-btn" data-slot="9"><span class="num">9</span></button>
      </div>
    </section>

    <section class="context-slots-section">
      <details open>
        <summary>Context Slots (0–9)</summary>
        <div class="slots-grid" id="slotsGrid"></div>
      </details>
    </section>

    <div id="results" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
