<link
  rel="icon"
  href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2210 0 100 100%22><text y=%22.90em%22 font-size=%2290%22>💾</text></svg>"
/>
<script>
  /**
   * After app load, replace all <origin>/prompts/<restOfPath> with https://github.com/chuanqisun/code/blob/master/prompts/<restOfPath>
   */
  document.addEventListener("DOMContentLoaded", () => {
    const prefix = `${window.location.origin}/prompts/`;
    const suffix = `.html`;
    const githubPrefix = `https://github.com/chuanqisun/code/blob/master/prompts/`;
    const githubSuffix = `.md`;

    document.querySelectorAll("a").forEach((link) => {
      if (link.href && link.href.startsWith(prefix) && link.href.endsWith(suffix)) {
        link.href = githubPrefix + link.href.slice(prefix.length, -suffix.length) + githubSuffix;
      }
    });
  });
</script>
