<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Recursive Arms (WebGL compositing)</title>
</head>
<body>
  <select id="cameras"></select>
  <button id="rotate">rotate 90°</button> <span id="rotation"></span>
  <label><input type="checkbox" id="hideJoints"> hide joints</label>
  <label><input type="checkbox" id="draw"> draw</label>
  <fieldset id="euro" style="display: inline-block; vertical-align: top;">
    <legend><label><input type="checkbox" id="euroOn" checked> One Euro filter</label> (arm joints)</legend>
    <label>min cutoff (Hz, lower = smoother at rest) <input type="range" id="minCutoff" min="0.01" max="5" step="0.01" value="1"> <span></span></label><br>
    <label>beta (higher = less lag when moving) <input type="range" id="beta" min="0" max="0.1" step="0.001" value="0.01"> <span></span></label><br>
    <label>d cutoff (Hz, speed smoothing) <input type="range" id="dCutoff" min="0.1" max="5" step="0.1" value="1"> <span></span></label>
  </fieldset>
  <p id="status">loading model...</p>
  <div style="position: relative; width: fit-content; margin: 0 auto;">
    <!-- video stays in the DOM (so frames keep decoding) but is hidden; the canvas shows it (rotated) plus the
         recursive arms, and sets the layout size since its shape changes with the rotation -->
    <video id="video" autoplay playsinline muted style="position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0;"></video>
    <canvas id="canvas" style="display: block; background: #111;"></canvas>
  </div>
  <pre id="output"></pre>

  <script type="module">
    import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3/vision_bundle.mjs";

    // Full camera frame as the base, recursive arm cut-outs on top. Nothing leaves the GPU except the pose landmarks:
    // the pose model shares the display canvas's WebGL2 context, so its person mask is a texture there,
    // and one fragment shader draws every recursion level (arm region ∩ person mask, filled with video).
    // There are no per-arm offscreen canvases: each level maps the output pixel back into source-video
    // space through the inverse of its transform, then evaluates the arm cut-out there.

    // Arm chains: shoulder -> elbow -> wrist -> hand (hand = average of pinky/index/thumb)
    const ARMS = {
      left: { shoulder: 11, elbow: 13, wrist: 15, hand: [17, 19, 21] },
      right: { shoulder: 12, elbow: 14, wrist: 16, hand: [18, 20, 22] },
    };
    const SIDES = ["right", "left"]; // index used in the shader: 0 = right, 1 = left
    const ARM_WIDTHS = [0.5, 0.4, 0.45]; // upper arm, forearm, hand (relative to shoulder width)
    const JOINT_NAMES = ["shoulder", "elbow", "wrist", "hand"];
    const SEGS_PER_ARM = 3;
    const MIN_VIS = 0.5;

    const DEPTH = 8; // arms per recursion chain
    const CHAINS = 2; // one chain starting from each real arm
    // Level 0 of each chain is the real arm in place, which the full-frame video base already shows,
    // so only levels 1..DEPTH-1 are composited.
    const MAX_LEVELS = (DEPTH - 1) * CHAINS;
    const SHRINK = 0.8; // scale factor per level
    const REST = Math.PI / 2; // shoulder->hand angle that adds no rotation (arm hanging straight down)
    const DOT_RADIUS = 2;
    const MAX_DOTS = DEPTH * CHAINS * 4;
    const TRAIL_LIFE = 3; // seconds: a trail point fades linearly from fully opaque to gone over this time
    const TRAIL_RADIUS = 0.75; // px; thinner than the dots
    // Only the tip of each recursion chain draws: the last 3 dots of each chain (its deepest arm's
    // elbow, wrist and hand). Dots are laid out chain by chain, DEPTH * 4 per chain.
    const TRAIL_DOTS = Array.from({ length: CHAINS }, (_, c) => [1, 2, 3].map((k) => (c + 1) * DEPTH * 4 - k)).flat();

    const video = document.getElementById("video");

    // ---------- Camera rotation (quarter turns clockwise), remembered across reloads ----------
    // Everything downstream (model, mask, compositing, trails) works on the rotated frame, so landscape and
    // portrait cameras both look upright. At 0° the video is used directly; otherwise each frame is drawn
    // rotated into rotCanvas first.
    const ROTATION_KEY = "dpp.rotation";
    let rotation = Number(localStorage.getItem(ROTATION_KEY)) % 4 || 0;
    const rotCanvas = document.createElement("canvas");
    const rotCtx = rotCanvas.getContext("2d");
    let frame = video; // this frame's source: the video, or rotCanvas when rotated
    let rotationChanged = false; // the loop drops the trails after a rotation (they were in the old orientation)
    const rotationLabel = document.getElementById("rotation");
    const showRotation = () => (rotationLabel.textContent = `${rotation * 90}°`);
    showRotation();
    document.getElementById("rotate").onclick = () => {
      rotation = (rotation + 1) % 4;
      localStorage.setItem(ROTATION_KEY, rotation);
      showRotation();
      rotationChanged = true;
    };

    // Draws the current video frame with the rotation applied; returns the source to use this frame
    function rotatedFrame() {
      if (rotation === 0) return video;
      const w = video.videoWidth, h = video.videoHeight;
      const sideways = rotation % 2 === 1;
      const W = sideways ? h : w, H = sideways ? w : h;
      if (rotCanvas.width !== W || rotCanvas.height !== H) {
        rotCanvas.width = W;
        rotCanvas.height = H;
      }
      rotCtx.setTransform(1, 0, 0, 1, W / 2, H / 2);
      rotCtx.rotate((rotation * Math.PI) / 2);
      rotCtx.drawImage(video, -w / 2, -h / 2);
      return rotCanvas;
    }
    const canvas = document.getElementById("canvas");
    const select = document.getElementById("cameras");
    const hideJoints = document.getElementById("hideJoints");
    const drawToggle = document.getElementById("draw");
    const status = document.getElementById("status");
    const output = document.getElementById("output");

    // ---------- One Euro filter (Casiez et al. 2012) on every arm joint, tunable from the page ----------
    // The recursion accumulates each arm's shoulder->hand angle, so base jitter grows with depth;
    // filtering the joints before the recursion steadies every level.
    const euro = { on: true, minCutoff: 1, beta: 0.01, dCutoff: 1 };
    document.getElementById("euroOn").onchange = (e) => (euro.on = e.target.checked);
    for (const key of ["minCutoff", "beta", "dCutoff"]) {
      const input = document.getElementById(key), label = input.nextElementSibling;
      const sync = () => (label.textContent = (euro[key] = Number(input.value)));
      input.oninput = sync;
      sync();
    }

    const smoothingFactor = (cutoff, dt) => 1 / (1 + 1 / (2 * Math.PI * cutoff * dt));

    class OneEuro {
      x = null; dx = 0; t = 0;
      filter(x, t) { // t in seconds
        if (this.x === null || !euro.on || t <= this.t) {
          if (this.x === null || !euro.on) this.dx = 0;
          this.x = x;
          this.t = t;
          return x;
        }
        const dt = t - this.t;
        this.dx += smoothingFactor(euro.dCutoff, dt) * ((x - this.x) / dt - this.dx);
        const cutoff = euro.minCutoff + euro.beta * Math.abs(this.dx);
        this.x += smoothingFactor(cutoff, dt) * (x - this.x);
        this.t = t;
        return this.x;
      }
    }

    // Filters a 2D point (px), keeping its other fields (e.g. visibility)
    class PointFilter {
      fx = new OneEuro(); fy = new OneEuro();
      filter(p, t) { return { ...p, x: this.fx.filter(p.x, t), y: this.fy.filter(p.y, t) }; }
    }
    // One filter per joint (shoulder, elbow, wrist, hand) per arm
    const filters = {
      left: Array.from({ length: 4 }, () => new PointFilter()),
      right: Array.from({ length: 4 }, () => new PointFilter()),
    };

    // ---------- WebGL compositor (shares its context with MediaPipe) ----------
    const gl = canvas.getContext("webgl2");

    const VS = `#version 300 es
      void main() { // one triangle covering the viewport
        vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
        gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
      }`;
    const FS = `#version 300 es
      precision highp float;
      uniform sampler2D uVideo, uPerson, uTrail;
      uniform bool uTrailOn;
      uniform vec2 uSize;                          // canvas size in px (= video size)
      uniform vec4 uSeg[${2 * SEGS_PER_ARM}];      // per side: capsule endpoints a.xy, b.xy in source px
      uniform float uHalfW[${2 * SEGS_PER_ARM}];
      uniform int uSegCount[2];
      uniform int uLevels;
      uniform int uSide[${MAX_LEVELS}];                 // which arm each level draws
      uniform vec3 uInvX[${MAX_LEVELS}], uInvY[${MAX_LEVELS}]; // inverse affine: canvas px -> source px
      uniform float uScale[${MAX_LEVELS}];
      uniform vec2 uDots[${MAX_DOTS}];
      uniform int uDotCount;
      uniform float uDotR;
      out vec4 outColor;

      // Antialiased coverage from a signed distance in px, like canvas 2D's edge antialiasing
      float cover(float d) { return clamp(0.5 - d, 0.0, 1.0); }

      void main() {
        vec2 p = vec2(gl_FragCoord.x, uSize.y - gl_FragCoord.y); // canvas 2D pixel coordinates
        vec3 ph = vec3(p, 1.0);
        vec3 col = texture(uVideo, p / uSize).rgb; // full camera frame as the base layer

        // Levels back to front, each composited source-over onto the previous ones
        for (int l = 0; l < ${MAX_LEVELS}; l++) {
          if (l >= uLevels) break;
          vec2 q = vec2(dot(uInvX[l], ph), dot(uInvY[l], ph)); // this pixel in source-video space
          // the per-arm canvas was video-sized, so nothing exists outside it
          if (any(lessThan(q, vec2(0.0))) || any(greaterThanEqual(q, uSize))) continue;

          int side = uSide[l];
          float arm = 0.0;
          for (int j = 0; j < ${SEGS_PER_ARM}; j++) {
            if (j >= uSegCount[side]) break;
            int k = side * ${SEGS_PER_ARM} + j;
            vec2 a = uSeg[k].xy, ba = uSeg[k].zw - a, pa = q - a;
            float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
            // distance is in source px; times scale gives output px, so edges stay 1px soft at any level
            arm += cover((length(pa - ba * h) - uHalfW[k]) * uScale[l]) * (1.0 - arm);
          }
          if (arm <= 0.0) continue; // skip both texture fetches outside the arm region

          vec2 uv = q / uSize; // MediaPipe textures and the video upload both have row 0 at the top
          float alpha = arm * texture(uPerson, uv).r;
          col = mix(col, texture(uVideo, uv).rgb, alpha);
        }

        // Joint trails over the arms, under the dots
        if (uTrailOn) col = mix(col, vec3(1.0), texture(uTrail, p / uSize).r);

        // Landmark dots on top
        float d = 0.0;
        for (int i = 0; i < ${MAX_DOTS}; i++) {
          if (i >= uDotCount) break;
          d = max(d, cover(length(p - uDots[i]) - uDotR));
        }
        col = mix(col, vec3(1.0), d); // white joint dots

        outColor = vec4(col, 1.0);
      }`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    const U = {};
    for (const name of ["uVideo", "uPerson", "uTrail", "uTrailOn", "uSize", "uSeg", "uHalfW", "uSegCount", "uLevels",
                        "uSide", "uInvX", "uInvY", "uScale", "uDots", "uDotCount", "uDotR"]) {
      U[name] = gl.getUniformLocation(program, name);
    }
    gl.useProgram(program);
    gl.uniform1i(U.uVideo, 0);
    gl.uniform1i(U.uPerson, 1);
    gl.uniform1i(U.uTrail, 2);
    gl.uniform1f(U.uDotR, DOT_RADIUS);
    gl.useProgram(null);

    // ---------- Trail pass: one instanced capsule per pair of consecutive trail points ----------
    // Drawn into a single-channel coverage texture with MAX blending, so where neighbouring capsules
    // overlap (every joint of the polyline) coverage doesn't double up. The main shader then lays it
    // over the scene as white. Rows are written top-down so it samples with the same uv as the masks.
    const TRAIL_VS = `#version 300 es
      layout(location = 0) in vec4 aSeg; // endpoints a.xy, b.xy in canvas px
      layout(location = 1) in vec2 aAge; // seconds since each endpoint was recorded
      uniform vec2 uSize;
      uniform float uR, uLife;
      out vec2 vP;
      flat out vec4 vSeg;
      flat out vec2 vAlpha;
      const vec2 CORNERS[6] = vec2[6](vec2(0, 0), vec2(1, 0), vec2(0, 1), vec2(1, 0), vec2(1, 1), vec2(0, 1));
      void main() {
        vec2 a = aSeg.xy, b = aSeg.zw, ab = b - a;
        float len = length(ab);
        vec2 t = len > 1e-4 ? ab / len : vec2(1.0, 0.0), n = vec2(-t.y, t.x);
        float e = uR + 1.0; // radius plus room for the antialiased edge
        vec2 c = CORNERS[gl_VertexID];
        vP = mix(a - t * e, b + t * e, c.x) + n * e * (c.y * 2.0 - 1.0);
        vSeg = aSeg;
        vAlpha = clamp(1.0 - aAge / uLife, 0.0, 1.0);
        gl_Position = vec4(vP / uSize * 2.0 - 1.0, 0.0, 1.0);
      }`;
    const TRAIL_FS = `#version 300 es
      precision highp float;
      uniform float uR;
      in vec2 vP;
      flat in vec4 vSeg;
      flat in vec2 vAlpha;
      out vec4 outColor;
      void main() {
        vec2 a = vSeg.xy, ba = vSeg.zw - a, pa = vP - a;
        float den = dot(ba, ba);
        float h = den > 0.0 ? clamp(dot(pa, ba) / den, 0.0, 1.0) : 0.0;
        float cov = clamp(0.5 - (length(pa - ba * h) - uR), 0.0, 1.0);
        outColor = vec4(cov * mix(vAlpha.x, vAlpha.y, h)); // opacity fades along the segment with age
      }`;
    const trailProgram = gl.createProgram();
    gl.attachShader(trailProgram, compile(gl.VERTEX_SHADER, TRAIL_VS));
    gl.attachShader(trailProgram, compile(gl.FRAGMENT_SHADER, TRAIL_FS));
    gl.linkProgram(trailProgram);
    if (!gl.getProgramParameter(trailProgram, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(trailProgram));
    const TU = {};
    for (const name of ["uSize", "uR", "uLife"]) TU[name] = gl.getUniformLocation(trailProgram, name);
    gl.useProgram(trailProgram);
    gl.uniform1f(TU.uR, TRAIL_RADIUS);
    gl.uniform1f(TU.uLife, TRAIL_LIFE);
    gl.useProgram(null);

    const TRAIL_FLOATS = 6; // per instance: a.xy, b.xy, ageA, ageB
    const trailVao = gl.createVertexArray();
    const trailBuf = gl.createBuffer();
    {
      const prevBuf = gl.getParameter(gl.ARRAY_BUFFER_BINDING), prevVao = gl.getParameter(gl.VERTEX_ARRAY_BINDING);
      gl.bindVertexArray(trailVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, trailBuf);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 4, gl.FLOAT, false, TRAIL_FLOATS * 4, 0);
      gl.vertexAttribDivisor(0, 1);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 2, gl.FLOAT, false, TRAIL_FLOATS * 4, 16);
      gl.vertexAttribDivisor(1, 1);
      gl.bindVertexArray(prevVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, prevBuf);
    }
    const trailFbo = gl.createFramebuffer();
    let trailTex = null, trailTexW = 0, trailTexH = 0;

    const vao = gl.createVertexArray(); // empty: the vertex shader uses gl_VertexID only
    let videoTex = gl.createTexture();
    // Arms are drawn scaled and rotated, so sample bilinearly like canvas 2D's drawImage smoothing.
    // Sampler objects override MediaPipe's texture filtering without modifying their textures.
    function makeSampler(filter) {
      const s = gl.createSampler();
      gl.samplerParameteri(s, gl.TEXTURE_MIN_FILTER, filter);
      gl.samplerParameteri(s, gl.TEXTURE_MAG_FILTER, filter);
      gl.samplerParameteri(s, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.samplerParameteri(s, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return s;
    }
    const videoSampler = makeSampler(gl.LINEAR);
    const nearestSampler = makeSampler(gl.NEAREST); // trail texture is sampled 1:1
    // The mask may be a 32-bit float texture, which is only filterable with this extension.
    const maskSampler = makeSampler(gl.getExtension("OES_texture_float_linear") ? gl.LINEAR : gl.NEAREST);
    gl.bindTexture(gl.TEXTURE_2D, videoTex);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, 1, 1); // resized on first frame
    gl.bindTexture(gl.TEXTURE_2D, null);
    let videoTexW = 1, videoTexH = 1;

    const segData = new Float32Array(2 * SEGS_PER_ARM * 4);
    const halfW = new Float32Array(2 * SEGS_PER_ARM);
    const segCount = new Int32Array(2);
    const sideData = new Int32Array(MAX_LEVELS);
    const invX = new Float32Array(MAX_LEVELS * 3);
    const invY = new Float32Array(MAX_LEVELS * 3);
    const scaleData = new Float32Array(MAX_LEVELS);
    const dotData = new Float32Array(MAX_DOTS * 2);
    const UNITS = 3; // texture units we use

    // MediaPipe drives this context too, so leave every bit of state we touch the way we found it.
    function withOwnGLState(fn) {
      const saved = {
        fb: gl.getParameter(gl.FRAMEBUFFER_BINDING),
        program: gl.getParameter(gl.CURRENT_PROGRAM),
        vao: gl.getParameter(gl.VERTEX_ARRAY_BINDING),
        viewport: gl.getParameter(gl.VIEWPORT),
        active: gl.getParameter(gl.ACTIVE_TEXTURE),
        unpackBuf: gl.getParameter(gl.PIXEL_UNPACK_BUFFER_BINDING),
        arrayBuf: gl.getParameter(gl.ARRAY_BUFFER_BINDING),
        blendEq: [gl.getParameter(gl.BLEND_EQUATION_RGB), gl.getParameter(gl.BLEND_EQUATION_ALPHA)],
        clear: gl.getParameter(gl.COLOR_CLEAR_VALUE),
        flipY: gl.getParameter(gl.UNPACK_FLIP_Y_WEBGL),
        premul: gl.getParameter(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL),
        caps: [gl.BLEND, gl.SCISSOR_TEST, gl.DEPTH_TEST, gl.STENCIL_TEST, gl.CULL_FACE, gl.RASTERIZER_DISCARD].map((c) => [c, gl.isEnabled(c)]),
        units: [],
      };
      for (let i = 0; i < UNITS; i++) {
        gl.activeTexture(gl.TEXTURE0 + i);
        saved.units.push([gl.getParameter(gl.TEXTURE_BINDING_2D), gl.getParameter(gl.SAMPLER_BINDING)]);
      }
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, null);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      for (const [c] of saved.caps) gl.disable(c);
      gl.viewport(0, 0, canvas.width, canvas.height);
      try {
        fn();
      } finally {
        for (let i = 0; i < UNITS; i++) {
          gl.activeTexture(gl.TEXTURE0 + i);
          gl.bindTexture(gl.TEXTURE_2D, saved.units[i][0]);
          gl.bindSampler(i, saved.units[i][1]);
        }
        gl.activeTexture(saved.active);
        for (const [c, on] of saved.caps) if (on) gl.enable(c);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, saved.flipY);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, saved.premul);
        gl.bindBuffer(gl.PIXEL_UNPACK_BUFFER, saved.unpackBuf);
        gl.bindBuffer(gl.ARRAY_BUFFER, saved.arrayBuf);
        gl.blendEquationSeparate(...saved.blendEq);
        gl.clearColor(...saved.clear);
        gl.viewport(...saved.viewport);
        gl.bindVertexArray(saved.vao);
        gl.useProgram(saved.program);
        gl.bindFramebuffer(gl.FRAMEBUFFER, saved.fb);
      }
    }

    // segs: {right: [{a, b, halfWidth}], left: [...]}; levels: [{side, anchor, rot, scale, shoulder}];
    // dots: [{x, y}]; personMask: MPMask in this context, or null when there is no pose;
    // trailCount: number of capsule instances in trailData
    function render(segs, levels, dots, personMask, trailCount) {
      withOwnGLState(() => {
        const w = canvas.width, h = canvas.height;

        if (trailCount > 0) {
          if (trailTexW !== w || trailTexH !== h) {
            if (trailTex) gl.deleteTexture(trailTex);
            trailTex = gl.createTexture();
            gl.activeTexture(gl.TEXTURE2);
            gl.bindTexture(gl.TEXTURE_2D, trailTex);
            gl.texStorage2D(gl.TEXTURE_2D, 1, gl.R8, w, h);
            gl.bindFramebuffer(gl.FRAMEBUFFER, trailFbo);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, trailTex, 0);
            trailTexW = w;
            trailTexH = h;
          }
          gl.bindFramebuffer(gl.FRAMEBUFFER, trailFbo);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.bindBuffer(gl.ARRAY_BUFFER, trailBuf);
          gl.bufferData(gl.ARRAY_BUFFER, trailData.subarray(0, trailCount * TRAIL_FLOATS), gl.DYNAMIC_DRAW);
          gl.enable(gl.BLEND);
          gl.blendEquation(gl.MAX);
          gl.useProgram(trailProgram);
          gl.uniform2f(TU.uSize, w, h);
          gl.bindVertexArray(trailVao);
          gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, trailCount);
          gl.disable(gl.BLEND);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        }

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, videoTex);
        if (videoTexW !== w || videoTexH !== h) {
          // texStorage2D textures are immutable, so make a new one at the new size
          gl.deleteTexture(videoTex);
          videoTex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, videoTex);
          gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, w, h);
          videoTexW = w;
          videoTexH = h;
        }
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, frame);
        gl.bindSampler(0, videoSampler);

        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, personMask ? personMask.getAsWebGLTexture() : null);
        gl.bindSampler(1, maskSampler);

        gl.activeTexture(gl.TEXTURE2);
        gl.bindTexture(gl.TEXTURE_2D, trailCount > 0 ? trailTex : null);
        gl.bindSampler(2, nearestSampler);

        segData.fill(0);
        halfW.fill(0);
        SIDES.forEach((side, si) => {
          segCount[si] = segs[side].length;
          segs[side].forEach((s, j) => {
            const k = si * SEGS_PER_ARM + j;
            segData.set([s.a.x, s.a.y, s.b.x, s.b.y], k * 4);
            halfW[k] = s.halfWidth;
          });
        });

        // Forward: P = anchor + R(rot) * (q - shoulder) * scale
        // Inverse: q = shoulder + R(-rot) * (P - anchor) / scale
        levels.forEach((L, i) => {
          const c = Math.cos(L.rot) / L.scale, s = Math.sin(L.rot) / L.scale;
          const ax = L.anchor.x, ay = L.anchor.y;
          invX.set([c, s, L.shoulder.x - (c * ax + s * ay)], i * 3);
          invY.set([-s, c, L.shoulder.y - (-s * ax + c * ay)], i * 3);
          scaleData[i] = L.scale;
          sideData[i] = SIDES.indexOf(L.side);
        });

        dots.forEach((d, i) => dotData.set([d.x, d.y], i * 2));

        gl.useProgram(program);
        gl.uniform2f(U.uSize, w, h);
        gl.uniform4fv(U.uSeg, segData);
        gl.uniform1fv(U.uHalfW, halfW);
        gl.uniform1iv(U.uSegCount, segCount);
        gl.uniform1i(U.uLevels, levels.length);
        gl.uniform1i(U.uTrailOn, trailCount > 0 ? 1 : 0);
        gl.uniform1iv(U.uSide, sideData);
        gl.uniform3fv(U.uInvX, invX);
        gl.uniform3fv(U.uInvY, invY);
        gl.uniform1fv(U.uScale, scaleData);
        gl.uniform2fv(U.uDots, dotData);
        gl.uniform1i(U.uDotCount, hideJoints.checked ? 0 : Math.min(dots.length, MAX_DOTS));
        gl.bindVertexArray(vao);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      });
    }

    // ---------- Model: gets the display canvas, so it shares its WebGL context ----------
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3/wasm"
    );
    const poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",
        delegate: "GPU",
      },
      canvas,
      runningMode: "VIDEO",
      numPoses: 1,
      outputSegmentationMasks: true,
    });
    status.textContent = "model loaded";

    async function startCamera(deviceId) {
      if (video.srcObject) video.srcObject.getTracks().forEach((t) => t.stop());
      const stream = await navigator.mediaDevices.getUserMedia({
        video: deviceId ? { deviceId: { exact: deviceId } } : true,
      });
      video.srcObject = stream;
      return stream;
    }

    // Request permission first so device labels are available.
    const stream = await startCamera();
    const currentId = stream.getVideoTracks()[0].getSettings().deviceId;
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
    for (const d of devices) {
      const opt = document.createElement("option");
      opt.value = d.deviceId;
      opt.textContent = d.label || d.deviceId;
      opt.selected = d.deviceId === currentId;
      select.appendChild(opt);
    }
    select.onchange = () => startCamera(select.value);

    // Pixel position of a landmark, plus visibility
    function pt(pose, i) {
      const p = pose[i];
      return { x: p.x * canvas.width, y: p.y * canvas.height, v: p.visibility };
    }

    function handPoint(pose, ids) {
      const ps = ids.map((i) => pt(pose, i));
      return {
        x: ps.reduce((a, p) => a + p.x, 0) / ps.length,
        y: ps.reduce((a, p) => a + p.y, 0) / ps.length,
        v: Math.min(...ps.map((p) => p.v)),
      };
    }

    // "Where can the arm be" prior: thick round-capped segments, stopping once a joint is unreliable.
    function armSegments(chain, scale) {
      const out = [];
      for (let i = 0; i < chain.length - 1; i++) {
        const a = chain[i], b = chain[i + 1];
        if (a.v < MIN_VIS || b.v < MIN_VIS) break;
        // canvas 2D prunes zero-length segments before stroking, so they draw nothing
        if (a.x === b.x && a.y === b.y) continue;
        out.push({ a, b, halfWidth: (ARM_WIDTHS[i] * scale) / 2 });
      }
      return out;
    }

    // Recursion: the start arm in place, then each next arm's shoulder sits on the previous arm's hand,
    // alternating sides and shrinking by SHRINK each level.
    // Rotation is relative: each arm's shoulder->hand angle (minus REST) is added to the rotation
    // of every arm after it, like bones in a skeleton.
    function recurse(chains, side, levels, dots) {
      let scale = 1;
      let rot = 0;
      let anchor = chains[side][0]; // where this level's shoulder is placed
      for (let level = 0; level < DEPTH; level++) {
        const chain = chains[side];
        const shoulder = chain[0];
        const cos = Math.cos(rot), sin = Math.sin(rot);
        // Map a point of this arm into canvas space: around the shoulder, scale + rotate, move to anchor
        const map = (p) => {
          const dx = (p.x - shoulder.x) * scale, dy = (p.y - shoulder.y) * scale;
          return { x: anchor.x + dx * cos - dy * sin, y: anchor.y + dx * sin + dy * cos };
        };
        if (level > 0) levels.push({ side, anchor, rot, scale, shoulder }); // level 0 is the base video
        dots.push(...chain.map(map));

        // Next arm: shoulder at this arm's hand, rotated by this arm's shoulder->hand direction
        const hand = chain[3];
        anchor = map(hand);
        rot += Math.atan2(hand.y - shoulder.y, hand.x - shoulder.x) - REST;
        side = side === "right" ? "left" : "right";
        scale *= SHRINK;
      }
    }

    // ---------- Trails: per-dot history of {x, y, t}; null marks a break (pose lost / draw turned off) ----------
    // Each tracked dot is always the same joint of the same recursion level, so its history is one continuous stroke.
    const trails = TRAIL_DOTS.map(() => []);
    let trailData = new Float32Array(1024 * TRAIL_FLOATS);

    // Record this frame's dots (or a break), drop expired points, and pack capsules into trailData.
    // Returns the number of capsules.
    function updateTrails(dots, tSec) {
      const record = drawToggle.checked && dots;
      let count = 0;
      for (let i = 0; i < TRAIL_DOTS.length; i++) {
        const h = trails[i], d = record && dots[TRAIL_DOTS[i]];
        if (d) h.push({ x: d.x, y: d.y, t: tSec });
        else if (h.length && h[h.length - 1] !== null) h.push(null);
        // Keep one expired point while its successor is still alive, so the segment can fade out fully
        const dead = (p) => p === null || tSec - p.t >= TRAIL_LIFE;
        while (h.length && dead(h[0]) && (h.length === 1 || dead(h[1]))) h.shift();

        for (let j = 1; j < h.length; j++) {
          const a = h[j - 1], b = h[j];
          if (!a || !b) continue;
          if ((count + 1) * TRAIL_FLOATS > trailData.length) {
            const bigger = new Float32Array(trailData.length * 2);
            bigger.set(trailData);
            trailData = bigger;
          }
          trailData.set([a.x, a.y, b.x, b.y, tSec - a.t, tSec - b.t], count * TRAIL_FLOATS);
          count++;
        }
      }
      return count;
    }

    let lastTime = -1;
    // FPS of processed frames and average main-thread ms per frame, recomputed about once per second
    let fps = 0, frameMs = 0, fpsFrames = 0, msSum = 0, fpsStart = performance.now();
    function loop() {
      if (video.readyState >= 2 && video.currentTime !== lastTime) {
        lastTime = video.currentTime;
        fpsFrames++;
        const fpsNow = performance.now();
        if (fpsNow - fpsStart >= 1000) {
          fps = (fpsFrames * 1000) / (fpsNow - fpsStart);
          frameMs = msSum / fpsFrames;
          fpsFrames = 0;
          msSum = 0;
          fpsStart = fpsNow;
        }
        const fpsLine = `fps: ${fps.toFixed(1)}  frame: ${frameMs.toFixed(1)} ms\n`;
        frame = rotatedFrame();
        const frameW = frame === video ? video.videoWidth : frame.width;
        const frameH = frame === video ? video.videoHeight : frame.height;
        if (canvas.width !== frameW || canvas.height !== frameH) {
          canvas.width = frameW;
          canvas.height = frameH;
        }
        if (rotationChanged) {
          for (const h of trails) h.length = 0;
          rotationChanged = false;
        }

        // The no-callback form copies the mask on the GPU, so it stays valid until result.close().
        // The landmark readback inside is the one CPU wait per frame; compositing runs on the GPU after it.
        const now = performance.now();
        const result = poseLandmarker.detectForVideo(frame, now);
        const pose = result.landmarks[0];
        const mask = result.segmentationMasks?.[0];
        if (pose && mask) {
          const chains = {};
          const segs = {};
          for (const [side, arm] of Object.entries(ARMS)) {
            const raw = [pt(pose, arm.shoulder), pt(pose, arm.elbow), pt(pose, arm.wrist), handPoint(pose, arm.hand)];
            chains[side] = raw.map((p, i) => filters[side][i].filter(p, now / 1000));
          }
          // From the filtered shoulders, so the arm widths are smoothed too
          const shoulderW = Math.hypot(chains.left[0].x - chains.right[0].x, chains.left[0].y - chains.right[0].y);
          for (const side of SIDES) segs[side] = armSegments(chains[side], shoulderW);

          // Two recursion chains, one rooted at each real arm, each alternating sides from there.
          const levels = [];
          const dots = [];
          recurse(chains, "right", levels, dots);
          recurse(chains, "left", levels, dots);

          render(segs, levels, dots, mask, updateTrails(dots, now / 1000));

          let text = fpsLine;
          for (const [side, chain] of Object.entries(chains)) {
            chain.forEach((p, i) => {
              text += `${side} ${JOINT_NAMES[i]}: x=${p.x.toFixed(0)} y=${p.y.toFixed(0)} vis=${p.v.toFixed(2)}\n`;
            });
          }
          output.textContent = text;
        } else {
          // just the camera frame, plus any trails still fading out
          render({ right: [], left: [] }, [], [], null, updateTrails(null, now / 1000));
          output.textContent = fpsLine + "no pose detected";
        }
        result.close?.();
        msSum += performance.now() - fpsNow;
      }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
