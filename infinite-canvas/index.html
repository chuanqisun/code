<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Infinite Canvas POC</title>
    <style>
      :root {
        --bg: #f4f4f4;
        --dot: #bbb;
        --panel: #fff;
        --border: #ccc;
        --accent: blue;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        user-select: none;
        background-color: var(--bg);
        background-image: radial-gradient(var(--dot) 1px, transparent 1px);
        background-size: 20px 20px;
      }

      #app,
      .viewport {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }

      .action-box {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: var(--panel);
        padding: 6px;
        border: 1px solid var(--border);
        display: flex;
        gap: 6px;
      }

      .item {
        position: absolute;
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 6px;
        min-width: 40px;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: move;
      }

      .item.selected {
        border-color: var(--accent);
      }

      .marquee {
        position: absolute;
        border: 1px dashed var(--accent);
        background: rgba(0, 0, 255, 0.05);
        pointer-events: none;
        z-index: 5;
      }

      #click-anchor {
        position: fixed;
        width: 0;
        height: 0;
        pointer-events: none;
        anchor-name: --click-anchor;
      }

      #context-menu {
        margin: 4px;
        padding: 4px;
        border: 1px solid var(--border);
        background: var(--panel);
        position-anchor: --click-anchor;
        position-area: bottom right;
        position-try-fallbacks:
          flip-inline,
          flip-block,
          flip-inline flip-block;
      }

      #context-menu button {
        display: block;
        width: 100%;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      import { html, render } from "https://esm.sh/lit-html@3";
      import { get, set } from "https://esm.sh/idb-keyval@6";

      const state = {
        pan: { x: 0, y: 0 },
        items: [],
        selectedIds: new Set(),
        editingItem: null,
        contextTargetId: null,
        contextType: null,
        isSpaceDown: false,
        dragMode: null,
        dragStart: { x: 0, y: 0 },
        marqueeBox: null,
        itemOrigins: new Map(),
        selectionOrigin: new Set(),
      };

      const update = () => {
        document.body.style.backgroundPosition = `${state.pan.x}px ${state.pan.y}px`;

        const view = html`
          <div id="click-anchor"></div>

          <div id="context-menu" popover="manual">
            ${state.contextType === "item"
              ? html`
                  <button autofocus @click=${() => editContextItem()}>Open</button>
                  <button @click=${() => deleteContextItem()}>Delete</button>
                `
              : html` <button autofocus @click=${() => clearCanvas()}>Clear</button> `}
          </div>

          <dialog id="edit-dialog" @close=${onDialogClose}>
            <form method="dialog">
              <textarea rows="6" cols="30" autofocus>${state.editingItem?.text ?? ""}</textarea>
              <div>
                <button value="cancel">Cancel</button>
                <button value="save">Save</button>
              </div>
            </form>
          </dialog>

          <form class="action-box" @submit=${onActionSubmit}>
            <input id="action-input" type="text" placeholder="Ctrl + K" autocomplete="off" />
            <button type="submit">Submit</button>
          </form>

          <div
            style="width: 100%; height: 100%;"
            @mousedown=${onPointerDown}
            @mousemove=${onPointerMove}
            @mouseup=${onPointerUp}
            @dblclick=${onDoubleClick}
            @contextmenu=${onContextMenu}
          >
            <div class="viewport" style="transform: translate(${state.pan.x}px, ${state.pan.y}px);">
              ${state.items.map(
                (item) => html`
                  <div
                    class="item ${state.selectedIds.has(item.id) ? "selected" : ""}"
                    data-id=${item.id}
                    style="transform: translate(${item.x}px, ${item.y}px);"
                  >
                    ${item.text}
                  </div>
                `,
              )}
            </div>

            ${state.marqueeBox
              ? html`
                  <div
                    class="marquee"
                    style="
                left: ${Math.min(state.marqueeBox.x1, state.marqueeBox.x2)}px;
                top: ${Math.min(state.marqueeBox.y1, state.marqueeBox.y2)}px;
                width: ${Math.abs(state.marqueeBox.x2 - state.marqueeBox.x1)}px;
                height: ${Math.abs(state.marqueeBox.y2 - state.marqueeBox.y1)}px;
              "
                  ></div>
                `
              : ""}
          </div>
        `;

        render(view, document.getElementById("app"));
      };

      const persist = () => set("canvas-items", state.items);

      const addItem = (text) => {
        const center = screenToWorld(window.innerWidth / 2, window.innerHeight / 2, state.pan);
        const item = { id: Date.now().toString(), x: center.x, y: center.y, text };
        state.items.push(item);
        state.selectedIds = new Set([item.id]);
        persist();
        update();
      };

      const deleteItems = (ids) => {
        state.items = state.items.filter((it) => !ids.has(it.id));
        ids.forEach((id) => state.selectedIds.delete(id));
        persist();
        update();
      };

      const clearCanvas = () => {
        closePopover();
        state.items = [];
        state.selectedIds.clear();
        persist();
        update();
      };

      const openEditDialog = (item) => {
        if (!item) return;
        state.editingItem = item;
        update();
        document.getElementById("edit-dialog")?.showModal();
      };

      const editContextItem = () => {
        closePopover();
        openEditDialog(state.items.find((i) => i.id === state.contextTargetId));
      };

      const deleteContextItem = () => {
        closePopover();
        const targets = state.selectedIds.has(state.contextTargetId) ? new Set(state.selectedIds) : new Set([state.contextTargetId]);
        deleteItems(targets);
      };

      const onPointerDown = (e) => {
        if (!e.target.closest("#context-menu")) {
          closePopover();
        }

        if (e.button === 2) return;
        const isMulti = e.shiftKey || e.ctrlKey || e.metaKey;
        const itemEl = e.target.closest(".item");
        state.dragStart = { x: e.clientX, y: e.clientY };

        if (state.isSpaceDown || e.button === 1) {
          state.dragMode = "pan";
          document.body.style.cursor = "grabbing";
        } else if (itemEl) {
          const id = itemEl.dataset.id;
          if (!state.selectedIds.has(id)) {
            if (!isMulti) state.selectedIds.clear();
            state.selectedIds.add(id);
          } else if (isMulti) {
            state.selectedIds.delete(id);
          }

          state.dragMode = "move";
          state.itemOrigins.clear();
          state.items.filter((it) => state.selectedIds.has(it.id)).forEach((it) => state.itemOrigins.set(it.id, { x: it.x, y: it.y }));
        } else {
          state.dragMode = "marquee";
          state.selectionOrigin = isMulti ? new Set(state.selectedIds) : new Set();
          if (!isMulti) state.selectedIds.clear();
          state.marqueeBox = { x1: e.clientX, y1: e.clientY, x2: e.clientX, y2: e.clientY };
        }
        update();
      };

      const onPointerMove = (e) => {
        if (!state.dragMode) return;
        const dx = e.clientX - state.dragStart.x;
        const dy = e.clientY - state.dragStart.y;

        if (state.dragMode === "pan") {
          state.pan.x += dx;
          state.pan.y += dy;
          state.dragStart = { x: e.clientX, y: e.clientY };
        } else if (state.dragMode === "move") {
          state.items.forEach((it) => {
            const origin = state.itemOrigins.get(it.id);
            if (origin) {
              it.x = origin.x + dx;
              it.y = origin.y + dy;
            }
          });
        } else if (state.dragMode === "marquee") {
          state.marqueeBox.x2 = e.clientX;
          state.marqueeBox.y2 = e.clientY;
          state.selectedIds = getOverlappingItemIds(state.marqueeBox, state.selectionOrigin);
        }
        update();
      };

      const onPointerUp = () => {
        if (state.dragMode === "move") persist();
        state.dragMode = null;
        state.marqueeBox = null;
        document.body.style.cursor = state.isSpaceDown ? "grab" : "default";
        update();
      };

      const onContextMenu = (e) => {
        e.preventDefault();
        const itemEl = e.target.closest(".item");
        state.contextType = itemEl ? "item" : "canvas";
        state.contextTargetId = itemEl?.dataset.id ?? null;

        if (itemEl && !state.selectedIds.has(state.contextTargetId)) {
          state.selectedIds = new Set([state.contextTargetId]);
        }

        const anchor = document.getElementById("click-anchor");
        anchor.style.left = `${e.clientX}px`;
        anchor.style.top = `${e.clientY}px`;

        update();
        document.getElementById("context-menu").showPopover();
      };

      const onDoubleClick = (e) => {
        const itemEl = e.target.closest(".item");
        if (itemEl) openEditDialog(state.items.find((i) => i.id === itemEl.dataset.id));
      };

      const onDialogClose = (e) => {
        const dialog = e.target;
        if (dialog.returnValue === "save" && state.editingItem) {
          state.editingItem.text = dialog.querySelector("textarea")?.value ?? "";
          persist();
        }
        state.editingItem = null;
        update();
      };

      const onActionSubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById("action-input");
        const val = input?.value.trim();
        if (val) {
          addItem(val);
          input.value = "";
          input.blur();
        }
      };

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closePopover();
        if (document.getElementById("edit-dialog")?.open) return;

        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          const input = document.getElementById("action-input");
          input?.focus();
          input?.select();
          return;
        }

        if (["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;

        if ((e.key === "Backspace" || e.key === "Delete") && state.selectedIds.size > 0) {
          e.preventDefault();
          deleteItems(state.selectedIds);
        } else if (e.code === "Space" && !state.isSpaceDown) {
          state.isSpaceDown = true;
          document.body.style.cursor = "grab";
        }
      });

      window.addEventListener("keyup", (e) => {
        if (e.code === "Space") {
          state.isSpaceDown = false;
          document.body.style.cursor = "default";
        }
      });

      const closePopover = () => {
        const menu = document.getElementById("context-menu");
        if (menu?.matches(":popover-open")) menu.hidePopover();
      };

      const screenToWorld = (sx, sy, pan) => ({ x: sx - pan.x, y: sy - pan.y });

      const getOverlappingItemIds = (box, initialSelection) => {
        const left = Math.min(box.x1, box.x2);
        const right = Math.max(box.x1, box.x2);
        const top = Math.min(box.y1, box.y2);
        const bottom = Math.max(box.y1, box.y2);
        const selected = new Set(initialSelection);

        document.querySelectorAll(".item").forEach((el) => {
          const rect = el.getBoundingClientRect();
          const overlaps = !(rect.right < left || rect.left > right || rect.bottom < top || rect.top > bottom);
          if (overlaps) selected.add(el.dataset.id);
        });

        return selected;
      };

      get("canvas-items").then((stored) => {
        if (stored) {
          state.items = stored;
          update();
        }
      });

      update();
    </script>
  </body>
</html>
