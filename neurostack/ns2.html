<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NeuroStack NS2</title>
    <style>
      :root {
        --ink: #000;
        --paper: #fff;
        --mute: #bbb;
        --hover: #e0e0e0;
        --hair: #ccc;
        --panel-w: 282px;
        --font-s: 11px;
        --font-xs: 10px;
        --line: 1px solid var(--ink);
        --dash: 1px dashed var(--ink);
        --bar-w: 60px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: monospace;
      }

      body {
        padding: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;

        & > * {
          width: var(--panel-w);
        }

        & > h1 {
          width: auto;
          font-size: 14px;
          text-transform: uppercase;
          letter-spacing: 1px;
        }
      }

      button {
        border: var(--line);
        padding: 4px 6px;
        cursor: pointer;
        font-size: var(--font-s);
        text-transform: uppercase;
        font-weight: bold;

        &:hover {
          background: var(--hover);
        }
      }

      .btn-row {
        display: flex;
        gap: 6px;

        & button {
          flex: 1;
        }
      }

      .panel {
        border: var(--line);
        padding: 6px 8px;
        font-size: var(--font-s);

        & .panel-title {
          font-weight: bold;
          text-transform: uppercase;
          border-bottom: var(--line);
          padding-bottom: 2px;
          margin-bottom: 3px;
        }
      }

      #grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        border: var(--line);

        & .cell {
          aspect-ratio: 1;
          border-right: var(--line);
          border-bottom: var(--line);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 19px;
          line-height: 1;
          cursor: pointer;
          user-select: none;

          &:nth-child(8n) {
            border-right: 0;
          }
          &:nth-last-child(-n + 8) {
            border-bottom: 0;
          }
          &:hover,
          &.agent {
            box-shadow: inset 0 0 0 1px var(--ink);
          }
        }

        & .mouse {
          display: inline-block;
          transition: transform 0.12s linear;

          &.bump {
            animation: nudge 0.12s linear;
          }
        }
      }

      @keyframes nudge {
        0%,
        100% {
          translate: 0 0;
        }
        50% {
          translate: 0 -3px;
        }
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      .stats-table td {
        padding: 1px 0;
        vertical-align: middle;

        &:first-child {
          font-weight: bold;
          width: 52%;
        }
        &:last-child {
          text-align: right;
        }
      }

      .meter-val {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;

        & .bar {
          display: inline-block;
          height: 6px;
          background: var(--ink);
        }
      }

      .num-table {
        table-layout: fixed;
        text-align: right;
        font-size: var(--font-xs);

        & th {
          border-bottom: var(--dash);
          font-weight: bold;
        }

        & th,
        & td {
          padding: 1px;

          &:first-child {
            text-align: left;
          }
        }

        & tr.pick td {
          font-weight: bold;
        }
        & .w-pos {
          font-weight: bold;
        }
        & .w-zero {
          color: var(--mute);
        }
        & .neg {
          text-decoration: underline;
        }
      }

      #ekg-panel {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: var(--font-xs);

        & .ekg-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 6px;
        }

        & .ekg-label {
          width: 52px;
          font-weight: bold;
        }
        & .sep {
          border-top: var(--dash);
          margin: 2px 0;
        }
        & canvas {
          border: 1px solid var(--hair);
          display: block;
        }
      }

      .slider-container {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: var(--font-s);
        border: var(--line);
        padding: 4px 8px;

        & .slider-header {
          display: flex;
          justify-content: space-between;
        }
      }

      input[type="range"] {
        appearance: none;
        width: 100%;
        height: 16px;
        background: transparent;
        cursor: pointer;

        &::-webkit-slider-runnable-track {
          height: 6px;
          background: var(--paper);
          border: var(--line);
        }
        &::-moz-range-track {
          height: 6px;
          background: var(--paper);
          border: var(--line);
        }

        &::-webkit-slider-thumb {
          appearance: none;
          width: 12px;
          height: 16px;
          margin-top: -6px;
          background: var(--ink);
          border: var(--line);
          border-radius: 0;
        }

        &::-moz-range-thumb {
          width: 12px;
          height: 16px;
          background: var(--ink);
          border: var(--line);
          border-radius: 0;
        }

        &:focus {
          outline: 1px dashed var(--ink);
          outline-offset: 2px;
        }
      }
    </style>
  </head>
  <body>
    <h1>NeuroStack NS3</h1>

    <div class="slider-container">
      <div class="slider-header"><span>TIMESTEP</span><span id="val-speed">100 ms</span></div>
      <input type="range" id="speed-slider" min="1" max="400" value="100" />
    </div>

    <div class="slider-container">
      <div class="slider-header"><span>PLASTICITY</span><span id="val-eta">1.00 ×</span></div>
      <input type="range" id="eta-slider" min="0" max="300" value="100" />
    </div>

    <div id="grid"></div>

    <div class="panel">
      <table class="stats-table">
        <tr>
          <td>STEP</td>
          <td id="val-step">0</td>
        </tr>
        <tr>
          <td>CONSUMED</td>
          <td id="val-hits">0</td>
        </tr>
        <tr>
          <td>STEPS / CHEESE</td>
          <td id="val-eff">—</td>
        </tr>
        <tr>
          <td>WALL BUMPS</td>
          <td id="val-bumps">0</td>
        </tr>
        <tr>
          <td>ACTION</td>
          <td id="val-action">NONE</td>
        </tr>
        <tr>
          <td>STATE</td>
          <td id="val-feedback">INITIALIZING</td>
        </tr>
        <tr>
          <td>HUNGER</td>
          <td>
            <div class="meter-val"><span id="bar-hunger" class="bar"></span><span id="val-hunger">0.00</span></div>
          </td>
        </tr>
        <tr>
          <td>SURPRISE &lang;|&epsilon;|&rang;</td>
          <td>
            <div class="meter-val"><span id="bar-err" class="bar"></span><span id="val-err">0.00</span></div>
          </td>
        </tr>
        <tr>
          <td>POLICY PRECISION</td>
          <td id="val-prec">0.00</td>
        </tr>
        <tr>
          <td>MOTOR TEMP</td>
          <td>
            <div class="meter-val"><span id="bar-temp" class="bar"></span><span id="val-temp">0.00</span></div>
          </td>
        </tr>
      </table>
    </div>

    <div class="panel">
      <div class="panel-title">Behavior</div>
      <table class="num-table">
        <thead>
          <tr>
            <th>ACT</th>
            <th>RISK</th>
            <th>AMB</th>
            <th>NOV</th>
            <th>HAB</th>
            <th>G</th>
          </tr>
        </thead>
        <tbody id="efe-body"></tbody>
      </table>
    </div>

    <div id="ekg-panel" class="panel">
      <div class="panel-title">EEG Monitor</div>
    </div>

    <div class="panel">
      <div class="panel-title">Connectivity</div>
      <table class="num-table">
        <thead>
          <tr>
            <th>SENSOR</th>
            <th>z0</th>
            <th>z1</th>
            <th>z2</th>
            <th>z3</th>
          </tr>
        </thead>
        <tbody id="weights-body"></tbody>
      </table>
    </div>

    <div class="btn-row">
      <button id="btn-reset">Reset Brain</button>
      <button id="btn-toggle">Pause</button>
    </div>

    <script>
      (() => {
        /* ============================ CONFIG ============================ */
        const CFG = {
          grid: 8,
          spawn: 4,
          substeps: 12,
          ekg: 60,
          placeDecay: 0.985,
          bumpErr: 0.35,
          lif: { tau: 3.5, refrac: 2, rateTau: 9, thrMin: 0.55, thrMax: 1.8 },
          eta: { z: 0.4, leak: 0.18, A: 0.06, B: 0.14, thr: 0.008, target: 0.18 },
          efe: {
            beta: 2.4,
            noise: 0.22,
            flat: 12,
            trust: 1.7,
            arouse: 0.9,
            tempMax: 2.2,
            amb: 0.6,
            nov: 0.9,
            hab: 0.22,
          },
          meta: { rise: 0.03, moveCost: 0.006, bumpCost: 0.014, bite: 0.32, tasteDecay: 0.45 },
          habit: { decay: 0.6, gain: 1, bump: -0.5 },
        };

        const SENSORS = ["smell·X", "smell·Y", "smell·0", "whisk·X", "whisk·Y"];
        const LATENTS = ["z0", "z1", "z2", "z3"];
        const ACTIONS = ["NORTH", "EAST", "SOUTH", "WEST"];
        const LABELS = [...SENSORS, ...LATENTS, ...ACTIONS.map((a) => `mot:${a[0]}`)];
        const [NS, NZ, NA] = [SENSORS.length, LATENTS.length, ACTIONS.length];
        const N = NS + NZ + NA;

        const DIRS = [
          { dx: 0, dy: -1, rot: 0 },
          { dx: 1, dy: 0, rot: 90 },
          { dx: 0, dy: 1, rot: 180 },
          { dx: -1, dy: 0, rot: 270 },
        ];

        const DMAX = (CFG.grid - 1) * Math.SQRT2;
        const GAIN = DMAX / 2;
        const PREF = { C: [0, 0, 1, 0, 0], W: [0.3, 0.3, 1.6, 0.7, 0.7] };
        const PREF_DRIVEN_CH = 2;

        const { abs, exp, min, max, hypot, random: rnd, sqrt } = Math;
        const $ = (id) => document.getElementById(id);

        /* ============================= STATE ============================ */
        const world = {};
        const brain = {};

        let cells = [];
        let traces = [];
        let etaScale = 1;
        let timestep = 100;
        let timer;
        let paused = false;
        let lastAction = "NONE";
        let state = "INITIALIZING";

        /* =========================== MAIN LOOP ========================== */
        const tick = () => {
          if (paused) return;
          if (!world.targets.length) {
            state = "AWAITING TARGET";
            return render();
          }

          const s = sense();
          if (brain.prev) brain.z = clampAll(matVec(brain.B[brain.prev.a], brain.prev.z), 0, 1);

          let action;
          for (let k = 0; k < CFG.substeps; k++) {
            inferStep(s);
            evaluate();
            const fired = lifStep();
            if (action === undefined && fired !== undefined) action = fired - NS - NZ;
            pushEKG();
          }
          action ??= argmin(brain.G);

          learnA();
          learnB();
          brain.prev = { a: action, z: [...brain.z] };

          const { dx, dy } = DIRS[action];
          const [nx, ny] = [world.x + dx, world.y + dy];
          const blocked = outside(nx, ny);
          const moved = !blocked;
          world.dir = action;
          world.bumped = blocked;

          if (blocked) {
            world.bumps++;
            brain.transErr[action] += CFG.bumpErr * (1 - brain.transErr[action]);
          } else {
            [world.x, world.y] = [nx, ny];
          }

          brain.habit = brain.habit.map((h) => h * CFG.habit.decay);
          brain.habit[action] += blocked ? CFG.habit.bump : CFG.habit.gain;

          metabolise(moved, blocked);

          const mealIdx = moved ? world.targets.findIndex((t) => t.x === world.x && t.y === world.y) : -1;
          const ate = mealIdx >= 0;
          if (ate) eat(mealIdx);

          lastAction = ACTIONS[action];
          state = ate
            ? "CHEESE CONSUMED"
            : blocked
              ? "WHISKER BLOCK"
              : world.hunger > 0.85
                ? "STARVING"
                : brain.temp > 0.9
                  ? "TUMBLING"
                  : meanAbs(brain.err) > 0.2
                    ? "SURPRISED"
                    : "MODEL STABLE";

          render();
        };

        /* ============================= WORLD ============================ */
        function resetWorld() {
          Object.assign(world, {
            x: (CFG.grid / 2) | 0,
            y: (CFG.grid / 2) | 0,
            dir: 1,
            targets: [],
            hunger: 0.55,
            taste: 0,
            steps: 0,
            consumed: 0,
            bumps: 0,
            sinceMeal: 0,
            history: [],
            place: new Float32Array(CFG.grid ** 2),
            bumped: false,
          });
          refill();
        }

        function refill() {
          while (world.targets.length < CFG.spawn) {
            const busy = new Set([{ x: world.x, y: world.y }, ...world.targets].map(key));
            const free = [];
            for (let y = 0; y < CFG.grid; y++) for (let x = 0; x < CFG.grid; x++) if (!busy.has(key({ x, y }))) free.push({ x, y });
            if (!free.length) return;
            world.targets.push(free[(rnd() * free.length) | 0]);
          }
        }

        function sense() {
          const { x, y } = world;
          return [
            clamp((odorEdge(x + 1, y) - odorEdge(x - 1, y)) * GAIN, -1, 1),
            clamp((odorEdge(x, y + 1) - odorEdge(x, y - 1)) * GAIN, -1, 1),
            odorAt(x, y),
            (outside(x + 1, y) ? 1 : 0) - (outside(x - 1, y) ? 1 : 0),
            (outside(x, y + 1) ? 1 : 0) - (outside(x, y - 1) ? 1 : 0),
          ];
        }

        function metabolise(moved, blocked) {
          const { rise, moveCost, bumpCost, tasteDecay } = CFG.meta;
          world.hunger = clamp(world.hunger + rise + (moved ? moveCost : 0) + (blocked ? bumpCost : 0), 0, 1);
          world.taste *= tasteDecay;
          world.steps++;
          world.sinceMeal++;
          for (let i = 0; i < world.place.length; i++) world.place[i] *= CFG.placeDecay;
          world.place[idxOf(world.x, world.y)] += 1;
        }

        function eat(idx) {
          world.targets.splice(idx, 1);
          world.consumed++;
          world.hunger = clamp(world.hunger - CFG.meta.bite, 0, 1);
          world.taste = 1;
          world.history = [...world.history, world.sinceMeal].slice(-8);
          world.sinceMeal = 0;
          refill();
        }

        /* ============================= BRAIN ============================ */
        function resetBrain() {
          Object.assign(brain, {
            A: matrix(NS, NZ, () => rnd() - 0.5),
            B: Array.from({ length: NA }, () => matrix(NZ, NZ, () => rnd() * 0.4)),
            z: Array(NZ).fill(0.2),
            err: Array(NS).fill(0),
            pred: Array(NS).fill(0),
            transErr: Array(NA).fill(0.4),
            habit: Array(NA).fill(0),
            G: Array(NA).fill(0),
            risk: Array(NA).fill(0),
            amb: Array(NA).fill(0),
            nov: Array(NA).fill(0),
            prec: 0,
            temp: CFG.efe.noise,
            v: new Float32Array(N),
            thr: new Float32Array(N).fill(1),
            rate: new Float32Array(N),
            ref: new Float32Array(N),
            prev: null,
          });
          normaliseA();
        }

        function normaliseA() {
          for (let j = 0; j < NZ; j++) {
            let n = 0;
            for (let i = 0; i < NS; i++) n += brain.A[i][j] ** 2;
            n = sqrt(n) || 1;
            for (let i = 0; i < NS; i++) brain.A[i][j] /= n;
          }
        }

        function inferStep(s) {
          brain.pred = clampAll(matVec(brain.A, brain.z), -1, 1);
          brain.err = s.map((x, i) => x - brain.pred[i]);
          const grad = matTVec(brain.A, brain.err, NZ);
          brain.z = brain.z.map((zj, j) => clamp(zj + CFG.eta.z * (grad[j] - CFG.eta.leak * zj), 0, 1));
        }

        function evaluate() {
          const prec = 0.4 + 2.2 * driveOf();
          brain.B.forEach((Ba, a) => {
            const oNext = clampAll(matVec(brain.A, clampAll(matVec(Ba, brain.z), 0, 1)), -1, 1);
            brain.risk[a] = oNext.reduce((sum, o, i) => sum + PREF.W[i] * (i === PREF_DRIVEN_CH ? prec : 1) * (o - PREF.C[i]) ** 2, 0);
            brain.amb[a] = brain.transErr[a];

            const { dx, dy } = DIRS[a];
            const [nx, ny] = [world.x + dx, world.y + dy];
            brain.nov[a] = outside(nx, ny) ? 0 : 1 / (1 + world.place[idxOf(nx, ny)]);

            brain.G[a] = brain.risk[a] + CFG.efe.amb * brain.amb[a] - CFG.efe.nov * brain.nov[a] - CFG.efe.hab * brain.habit[a];
          });
          brain.prec = max(...brain.G) - min(...brain.G);
        }

        function motorTemp() {
          const flat = 1 + 3 / (1 + CFG.efe.flat * brain.prec);
          const distrust = 1 + CFG.efe.trust * meanAbs(brain.err);
          const arousal = 1 + CFG.efe.arouse * driveOf();
          return min(CFG.efe.tempMax, CFG.efe.noise * flat * distrust * arousal);
        }

        function lifStep() {
          const gMin = min(...brain.G);
          const noise = (brain.temp = motorTemp());
          const I = new Float32Array(N);

          for (let i = 0; i < NS; i++) I[i] = 0.55 + 2.6 * clamp(abs(brain.pred[i] + brain.err[i]), 0, 1) + rnd() * 0.12;
          for (let j = 0; j < NZ; j++) I[NS + j] = 0.9 + 3.0 * brain.z[j] + rnd() * 0.12;
          for (let a = 0; a < NA; a++) I[NS + NZ + a] = 1.75 - CFG.efe.beta * (brain.G[a] - gMin) + rnd() * noise;

          let motor;
          for (let i = 0; i < N; i++) {
            let spiked = false;
            if (brain.ref[i] > 0) {
              brain.ref[i]--;
              brain.v[i] = 0;
            } else {
              brain.v[i] += (I[i] - brain.v[i]) / CFG.lif.tau;
              if (brain.v[i] > brain.thr[i]) {
                spiked = true;
                brain.v[i] = 0;
                brain.ref[i] = CFG.lif.refrac;
                if (i >= NS + NZ) {
                  motor ??= i;
                  for (let k = NS + NZ; k < N; k++) if (k !== i) brain.v[k] *= 0.12;
                }
              }
            }
            brain.rate[i] += ((spiked ? 1 : 0) - brain.rate[i]) / CFG.lif.rateTau;
            brain.thr[i] = clamp(brain.thr[i] + CFG.eta.thr * (brain.rate[i] - CFG.eta.target), CFG.lif.thrMin, CFG.lif.thrMax);
          }
          return motor;
        }

        function learnA() {
          const rate = CFG.eta.A * etaScale;
          for (let i = 0; i < NS; i++) for (let j = 0; j < NZ; j++) brain.A[i][j] = clamp(brain.A[i][j] + rate * brain.err[i] * brain.z[j], -2, 2);
          normaliseA();
        }

        function learnB() {
          if (!brain.prev) return;
          const { a, z: zPrev } = brain.prev;
          const zHat = clampAll(matVec(brain.B[a], zPrev), 0, 1);
          const d = brain.z.map((x, j) => x - zHat[j]);
          const rate = CFG.eta.B * etaScale;
          for (let j = 0; j < NZ; j++) for (let k = 0; k < NZ; k++) brain.B[a][j][k] = clamp(brain.B[a][j][k] + rate * d[j] * zPrev[k], -1.5, 1.5);
          brain.transErr[a] += 0.15 * (meanAbs(d) - brain.transErr[a]);
        }

        /* ============================ RENDER ============================ */
        function render() {
          drawGrid();
          drawTables();
          drawEKG();

          const err = meanAbs(brain.err);
          const set = (id, text) => ($(id).textContent = text);
          const bar = (id, px) => ($(id).style.width = `${min(60, px).toFixed(0)}px`);

          set("val-step", world.steps);
          set("val-hits", world.consumed);
          set("val-eff", world.consumed ? (world.steps / world.consumed).toFixed(1) : "—");
          set("val-bumps", world.bumps);
          set("val-action", lastAction);
          set("val-feedback", state);
          set("val-hunger", world.hunger.toFixed(2));
          set("val-err", err.toFixed(3));
          set("val-prec", brain.prec.toFixed(3));
          set("val-temp", brain.temp.toFixed(2));
          bar("bar-hunger", world.hunger * 60);
          bar("bar-err", err * 200);
          bar("bar-temp", (brain.temp / CFG.efe.tempMax) * 60);
        }

        function drawGrid() {
          const targets = new Set(world.targets.map(key));
          const { rot } = DIRS[world.dir];
          cells.forEach((cell, i) => {
            const [x, y] = [i % CFG.grid, (i / CFG.grid) | 0];
            const here = world.x === x && world.y === y;
            cell.className = `cell${here ? " agent" : ""}`;
            cell.innerHTML = here
              ? `<span class="mouse${world.bumped ? " bump" : ""}" style="transform:rotate(${rot}deg)">🐭</span>`
              : targets.has(key({ x, y }))
                ? "🧀"
                : "";
          });
        }

        function drawTables() {
          const best = argmin(brain.G);
          $("efe-body").innerHTML = ACTIONS.map(
            (a, i) =>
              `<tr class="${i === best ? "pick" : ""}"><td>${a}</td>` +
              [brain.risk[i], brain.amb[i], brain.nov[i], brain.habit[i], brain.G[i]]
                .map((v) => `<td class="${v < 0 ? "neg" : ""}">${v.toFixed(2)}</td>`)
                .join("") +
              `</tr>`,
          ).join("");

          $("weights-body").innerHTML = SENSORS.map(
            (s, i) =>
              `<tr><td>${s}</td>` +
              brain.A[i].map((w) => `<td class="${abs(w) > 0.35 ? "w-pos" : abs(w) < 0.08 ? "w-zero" : ""}">${w.toFixed(2)}</td>`).join("") +
              `</tr>`,
          ).join("");
        }

        function pushEKG() {
          traces.forEach((t, i) => {
            t.data.shift();
            t.data.push(brain.ref[i] > 0 ? 1.7 : brain.v[i]);
          });
        }

        function drawEKG() {
          traces.forEach(({ ctx, data }) => {
            const { width, height } = ctx.canvas;
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = "#000";
            ctx.beginPath();
            data.forEach((v, i) => {
              const px = i * (width / (CFG.ekg - 1));
              const py = clamp(height - 2 - (v * (height - 4)) / 1.7, 1, height - 1);
              i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
            });
            ctx.stroke();
          });
        }

        /* ============================ HELPERS =========================== */
        function clamp(x, lo, hi) {
          return min(hi, max(lo, x));
        }
        function clampAll(a, lo, hi) {
          return Array.from(a, (x) => clamp(x, lo, hi));
        }
        function matrix(rows, cols, fn) {
          return Array.from({ length: rows }, () => Array.from({ length: cols }, fn));
        }
        function matVec(M, x) {
          return M.map((row) => row.reduce((s, w, k) => s + w * x[k], 0));
        }
        function matTVec(M, e, cols) {
          return Array.from({ length: cols }, (_, j) => M.reduce((s, row, i) => s + row[j] * e[i], 0));
        }
        function meanAbs(a) {
          return Array.from(a, abs).reduce((s, x) => s + x, 0) / a.length;
        }
        function argmin(a) {
          return a.indexOf(min(...a));
        }
        function key({ x, y }) {
          return `${x},${y}`;
        }
        function idxOf(x, y) {
          return y * CFG.grid + x;
        }
        function outside(x, y) {
          return x < 0 || x >= CFG.grid || y < 0 || y >= CFG.grid;
        }
        function driveOf() {
          return clamp(world.hunger - world.taste, 0, 1);
        }
        function odorAt(x, y) {
          return world.targets.reduce((m, t) => max(m, 1 - hypot(x - t.x, y - t.y) / DMAX), 0);
        }
        function odorEdge(x, y) {
          return odorAt(clamp(x, 0, CFG.grid - 1), clamp(y, 0, CFG.grid - 1));
        }

        /* ============================== INIT ============================ */
        cells = Array.from({ length: CFG.grid ** 2 }, (_, i) => {
          const [x, y] = [i % CFG.grid, (i / CFG.grid) | 0];
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.addEventListener("click", () => {
            const idx = world.targets.findIndex((t) => t.x === x && t.y === y);
            if (idx >= 0) world.targets.splice(idx, 1);
            else if (world.x !== x || world.y !== y) world.targets.push({ x, y });
            render();
          });
          $("grid").append(cell);
          return cell;
        });

        traces = LABELS.map((label, i) => {
          if (i === NS || i === NS + NZ) $("ekg-panel").insertAdjacentHTML("beforeend", `<div class="sep"></div>`);
          const row = document.createElement("div");
          row.className = "ekg-row";
          row.innerHTML = `<span class="ekg-label">${label}</span><canvas width="196" height="14"></canvas>`;
          $("ekg-panel").append(row);
          return { ctx: row.querySelector("canvas").getContext("2d"), data: Array(CFG.ekg).fill(0) };
        });

        const restartTimer = () => {
          clearInterval(timer);
          timer = setInterval(tick, timestep);
        };

        $("speed-slider").addEventListener("input", ({ target }) => {
          timestep = +target.value;
          $("val-speed").textContent = `${timestep} ms`;
          restartTimer();
        });

        $("eta-slider").addEventListener("input", ({ target }) => {
          etaScale = +target.value / 100;
          $("val-eta").textContent = `${etaScale.toFixed(2)} ×`;
        });

        $("btn-reset").addEventListener("click", () => {
          resetBrain();
          resetWorld();
          lastAction = "RESET";
          state = "INITIALIZING";
          render();
        });

        $("btn-toggle").addEventListener("click", ({ target }) => {
          paused = !paused;
          target.textContent = paused ? "Resume" : "Pause";
        });

        resetBrain();
        resetWorld();
        render();
        restartTimer();
      })();
    </script>
  </body>
</html>
