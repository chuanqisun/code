<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hand puppet prototype</title>
    <style>
      :root {
        --fg: #000;
        --bg: #fff;
        --border: 1px solid var(--fg);
        --font: 12px monospace;
        --gap: 12px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 16px;
        color: var(--fg);
        background: var(--bg);
        font: var(--font);
      }

      header {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;

        h1 {
          margin: 0 12px 0 0;
          font-size: 14px;
        }
      }

      button,
      select,
      input {
        font: inherit;
        accent-color: var(--fg);
      }

      button,
      select {
        color: var(--fg);
        background: var(--bg);
        border: var(--border);
        padding: 5px;
      }

      button {
        cursor: pointer;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 16px;

        @media (max-width: 760px) {
          grid-template-columns: 1fr;

          aside {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
          }
        }
      }

      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        border: var(--border);
        touch-action: none;
      }

      video {
        display: none;
      }

      fieldset {
        margin: 0 0 var(--gap);
        border: var(--border);
        padding: 10px;

        p {
          margin: 8px 0;
        }
      }

      .setting {
        display: block;
        margin-bottom: var(--gap);

        span {
          display: flex;
          justify-content: space-between;
          gap: 8px;
        }

        input[type="range"] {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>HAND PUPPET</h1>
      <button id="cameraButton">Enable camera</button>
      <select id="cameraSelect" aria-label="Camera" disabled>
        <option>Camera source</option>
      </select>
      <button id="resetButton">Reset puppet</button>
      <button id="calibrateButton" disabled>Recalibrate neutral</button>
    </header>

    <main>
      <section>
        <canvas id="canvas"></canvas>
        <video id="video" autoplay playsinline muted></video>
      </section>

      <aside>
        <fieldset>
          <legend>Tracking</legend>
          <label class="setting">
            <span>Hand sensitivity <output id="sensitivityValue"></output></span>
            <input id="sensitivity" type="range" min="0.4" max="2.5" step="0.1" value="1.0" />
          </label>
          <label class="setting">
            <span>1€ filter beta <output id="filterBetaValue"></output></span>
            <input id="filterBeta" type="range" min="0.1" max="25" step="0.5" value="10.0" />
          </label>
          <label class="setting">
            <span>1€ min cutoff <output id="filterCutoffValue"></output></span>
            <input id="filterCutoff" type="range" min="0.1" max="5" step="0.1" value="1.0" />
          </label>
          <label><input id="showHand" type="checkbox" checked /> Hand landmarks</label>
          <p>
            <label><input id="showStrings" type="checkbox" checked /> Strings</label>
          </p>
          <p>
            <label><input id="showLabels" type="checkbox" checked /> Control labels</label>
          </p>
        </fieldset>

        <fieldset>
          <legend>Physics</legend>
          <label class="setting">
            <span>Gravity scale <output id="gravityValue"></output></span>
            <input id="gravity" type="range" min="0.2" max="2.5" step="0.1" value="2" />
          </label>
          <label class="setting">
            <span>Velocity retention <output id="dampingValue"></output></span>
            <input id="damping" type="range" min="0.88" max="0.995" step="0.005" value="0.98" />
          </label>
          <label class="setting">
            <span>Anchor follow speed <output id="anchorFollowValue"></output></span>
            <input id="anchorFollow" type="range" min="4" max="60" step="1" value="45" />
          </label>
          <label class="setting">
            <span>Rope pull stiffness <output id="pullStiffValue"></output></span>
            <input id="pullStiff" type="range" min="0.2" max="1.0" step="0.05" value="1.0" />
          </label>
          <label class="setting">
            <span>Solver iterations <output id="iterationsValue"></output></span>
            <input id="iterations" type="range" min="4" max="24" step="1" value="16" />
          </label>
          <label class="setting">
            <span>Torso lightness <output id="torsoMassValue"></output></span>
            <input id="torsoMass" type="range" min="0.4" max="1.2" step="0.05" value="1.0" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Debug</legend>
          <div id="stats">Manual input</div>
        </fieldset>
      </aside>
    </main>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const canvas = $("canvas");
      const ctx = canvas.getContext("2d");
      const video = $("video");

      const WIDTH = 1000;
      const HEIGHT = 760;
      const FLOOR = 682;
      const TIME_STEP = 1 / 120;

      const FINGER_TIPS = [4, 8, 12, 16, 20];
      const FINGER_NAMES = ["thumb", "index", "middle", "ring", "pinky"];
      const ROPE_ATTACHMENTS = [7, 11, 0, 12, 8];

      const INITIAL_POSE = [
        [500, 365],
        [500, 405],
        [500, 505],
        [472, 415],
        [528, 415],
        [442, 455],
        [558, 455],
        [420, 497],
        [580, 497],
        [475, 555],
        [525, 555],
        [458, 610],
        [542, 610],
      ];

      const LIMB_ROPE_LENGTH = Math.hypot(INITIAL_POSE[7][0] - 270, INITIAL_POSE[7][1] - 195);
      const INDEX_RING_Y = Math.round(INITIAL_POSE[11][1] - Math.sqrt(LIMB_ROPE_LENGTH ** 2 - (INITIAL_POSE[11][0] - 385) ** 2));

      const BASE_ANCHORS = [
        { x: 270, y: 195 },
        { x: 385, y: INDEX_RING_Y },
        { x: 500, y: 130 },
        { x: 615, y: INDEX_RING_Y },
        { x: 730, y: 195 },
      ];

      const BONE_PAIRS = [
        [0, 1],
        [1, 3],
        [1, 4],
        [3, 4],
        [1, 2],
        [3, 2],
        [4, 2],
        [3, 5],
        [5, 7],
        [4, 6],
        [6, 8],
        [2, 9],
        [9, 11],
        [2, 10],
        [10, 12],
      ];

      const VISIBLE_BONES = [
        [1, 2],
        [3, 4],
        [3, 5],
        [5, 7],
        [4, 6],
        [6, 8],
        [2, 9],
        [9, 11],
        [2, 10],
        [10, 12],
      ];

      const HAND_CONNECTIONS = [
        [0, 1],
        [1, 2],
        [2, 3],
        [3, 4],
        [0, 5],
        [5, 6],
        [6, 7],
        [7, 8],
        [5, 9],
        [9, 10],
        [10, 11],
        [11, 12],
        [9, 13],
        [13, 14],
        [14, 15],
        [15, 16],
        [13, 17],
        [0, 17],
        [17, 18],
        [18, 19],
        [19, 20],
      ];

      const PARAM_CONFIG = {
        sensitivity: { val: 1.0, fmt: (v) => `${v.toFixed(1)}×` },
        filterBeta: { val: 10.0, fmt: (v) => `${v.toFixed(1)}` },
        filterCutoff: { val: 1.0, fmt: (v) => `${v.toFixed(1)} Hz` },
        gravity: { val: 2.0, fmt: (v) => `${v.toFixed(1)}×` },
        damping: { val: 0.98, fmt: (v) => `${v.toFixed(3)}` },
        anchorFollow: { val: 45, fmt: (v) => `${v} /s` },
        pullStiff: { val: 1.0, fmt: (v) => `${v.toFixed(2)}` },
        iterations: { val: 16, fmt: (v) => `${v}` },
        torsoMass: { val: 1.0, fmt: (v) => `${v.toFixed(2)}` },
      };

      const params = Object.fromEntries(Object.entries(PARAM_CONFIG).map(([k, v]) => [k, v.val]));

      let particles = [];
      let bones = [];
      let ropes = [];
      const anchors = BASE_ANCHORS.map((p) => ({ ...p, tx: p.x, ty: p.y }));

      let model = null;
      let modelPromise = null;
      let stream = null;
      let isCameraActive = false;
      let isBusy = false;
      let isTracked = false;
      let landmarks = null;
      let neutralPose = null;
      let lastSeenTime = -Infinity;
      let lastVideoTime = -1;
      let inferenceMs = 0;
      let inferenceCount = 0;

      let draggedAnchor = -1;
      let activePointerId = null;

      let previousTime = performance.now();
      let accumulator = 0;
      let lastStatsTime = previousTime;

      function mainLoop(now) {
        const elapsed = Math.min((now - previousTime) / 1000, 0.05);
        previousTime = now;

        processCameraFrame(now);
        updateAnchorTargets();

        accumulator += elapsed;
        let steps = 0;
        while (accumulator >= TIME_STEP && steps < 6) {
          stepPhysics(TIME_STEP);
          accumulator -= TIME_STEP;
          steps++;
        }
        if (steps === 6) accumulator = 0;

        render();
        updateStats(now);
        requestAnimationFrame(mainLoop);
      }

      function updateStats(now) {
        if (now - lastStatsTime < 1000) return;
        const rate = (inferenceCount * 1000) / (now - lastStatsTime);
        inferenceCount = 0;
        lastStatsTime = now;

        const camFps = stream?.getVideoTracks()[0]?.getSettings().frameRate;
        $("stats").textContent = isCameraActive
          ? `Tracking: ${rate.toFixed(0)} fps | inference: ${inferenceMs.toFixed(1)} ms | cam: ${camFps ? camFps.toFixed(0) : "?"} fps`
          : "Manual input | physics: 120 Hz";
      }

      function resetPuppet() {
        particles = INITIAL_POSE.map(([x, y]) => ({ x, y, px: x, py: y, invMass: 1.0 }));
        updateParticleMasses();

        bones = BONE_PAIRS.map(([a, b]) => ({
          a,
          b,
          length: dist(particles[a], particles[b]),
        }));

        ropes = ROPE_ATTACHMENTS.map((part, i) => ({
          part,
          length: i === 2 ? Math.hypot(INITIAL_POSE[part][0] - BASE_ANCHORS[i].x, INITIAL_POSE[part][1] - BASE_ANCHORS[i].y) : LIMB_ROPE_LENGTH,
          tension: 0,
        }));

        anchors.forEach((a, i) => Object.assign(a, BASE_ANCHORS[i], { tx: BASE_ANCHORS[i].x, ty: BASE_ANCHORS[i].y }));
        if (isCameraActive && isTracked) calibrateNeutral();
      }

      function updateParticleMasses() {
        particles.forEach((p, i) => {
          p.invMass = i === 2 ? params.torsoMass : i <= 4 ? Math.min(1.0, params.torsoMass + 0.15) : 1.0;
        });
      }

      function updateAnchorTargets() {
        if (isCameraActive && isTracked && neutralPose) {
          FINGER_TIPS.forEach((tipIdx, i) => {
            const pt = landmarks[tipIdx];
            const dx = -(pt.x - neutralPose[i].x);
            const dy = pt.y - neutralPose[i].y;
            anchors[i].tx = clamp(BASE_ANCHORS[i].x + dx * 800 * params.sensitivity, 65, 935);
            anchors[i].ty = clamp(BASE_ANCHORS[i].y + dy * 640 * params.sensitivity, 75, 480);
          });
        } else if (isCameraActive) {
          anchors.forEach((a, i) => Object.assign(a, { tx: BASE_ANCHORS[i].x, ty: BASE_ANCHORS[i].y }));
        }
      }

      function stepPhysics(dt) {
        const blend = 1 - Math.exp(-params.anchorFollow * dt);
        anchors.forEach((a, i) => {
          a.x = draggedAnchor === i ? a.tx : a.x + (a.tx - a.x) * blend;
          a.y = draggedAnchor === i ? a.ty : a.y + (a.ty - a.y) * blend;
        });

        for (const p of particles) {
          const vx = (p.x - p.px) * params.damping;
          const vy = (p.y - p.py) * params.damping;
          p.px = p.x;
          p.py = p.y;
          p.x += vx;
          p.y += vy + 1050 * params.gravity * dt * dt;
        }

        for (const r of ropes) r.tension = 0;

        for (let iter = 0; iter < params.iterations; iter++) {
          for (const b of bones) {
            const a = particles[b.a];
            const c = particles[b.b];
            const dx = c.x - a.x;
            const dy = c.y - a.y;
            const d = Math.hypot(dx, dy) || 0.0001;
            const k = (d - b.length) / d / (a.invMass + c.invMass);
            a.x += dx * k * a.invMass;
            a.y += dy * k * a.invMass;
            c.x -= dx * k * c.invMass;
            c.y -= dy * k * c.invMass;
          }

          ropes.forEach((r, i) => {
            const p = particles[r.part];
            const a = anchors[i];
            const dx = p.x - a.x;
            const dy = p.y - a.y;
            const d = Math.hypot(dx, dy);
            if (d > r.length) {
              const excess = d - r.length;
              const corr = (excess / d) * params.pullStiff;
              p.x -= dx * corr;
              p.y -= dy * corr;
              r.tension = Math.max(r.tension, excess);
            }
          });

          particles.forEach((p, i) => {
            const radius = i === 0 ? 24 : 5;
            p.x = clamp(p.x, radius + 40, WIDTH - 40 - radius);
            if (p.y > FLOOR - radius) {
              p.y = FLOOR - radius;
              p.px = p.x + (p.px - p.x) * 0.7;
              if (p.py < p.y) p.py = p.y;
            }
          });
        }
      }

      function render() {
        ctx.setTransform(canvas.width / WIDTH, 0, 0, canvas.height / HEIGHT, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        if (isCameraActive && video.readyState >= 2) {
          const t = getCameraTransform();
          ctx.save();
          ctx.globalAlpha = 0.5;
          ctx.translate(WIDTH, 0);
          ctx.scale(-1, 1);
          ctx.drawImage(video, t.x, t.y, t.width, t.height);
          ctx.restore();
        }

        ctx.strokeStyle = "#000";
        ctx.fillStyle = "#fff";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        drawLine({ x: 0, y: FLOOR }, { x: WIDTH, y: FLOOR }, 1);

        if ($("showHand").checked && landmarks && isTracked) {
          const t = getCameraTransform();
          const mapPt = (p) => ({ x: t.x + (1 - p.x) * t.width, y: t.y + p.y * t.height });

          ctx.save();
          ctx.globalAlpha = 0.55;
          for (const [a, b] of HAND_CONNECTIONS) drawLine(mapPt(landmarks[a]), mapPt(landmarks[b]), 1.3);
          for (const p of landmarks) {
            const pt = mapPt(p);
            drawCircle(pt.x, pt.y, 2.5);
          }
          ctx.restore();
        }

        if ($("showStrings").checked) {
          ropes.forEach((r, i) => {
            const a = anchors[i];
            const p = particles[r.part];
            const slack = clamp((r.length - dist(a, p)) * 0.55, 0, 55);

            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.quadraticCurveTo((a.x + p.x) / 2 + slack, (a.y + p.y) / 2 + slack, p.x, p.y);
            ctx.stroke();
          });
        }

        for (const [a, b] of VISIBLE_BONES) drawLine(particles[a], particles[b], 6);
        drawLine(particles[0], particles[1], 6);

        const [head, neck] = particles;
        ctx.save();
        ctx.translate(head.x, head.y);
        ctx.rotate(Math.atan2(neck.y - head.y, neck.x - head.x) - Math.PI / 2);
        drawCircle(0, 0, 24, true, 4);
        ctx.fillStyle = "#000";
        drawCircle(-7, -2, 1.5);
        drawCircle(7, -2, 1.5);
        drawLine({ x: -6, y: 9 }, { x: 6, y: 9 }, 1.5);
        ctx.restore();

        for (let i = 1; i < particles.length; i++) {
          drawCircle(particles[i].x, particles[i].y, i <= 4 ? 3.2 : 4.2, true, 1.8);
        }

        ctx.font = "12px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        anchors.forEach((a, i) => {
          ctx.fillStyle = "#fff";
          drawCircle(a.x, a.y, draggedAnchor === i ? 15 : 12, true, 1.8);
          ctx.fillStyle = "#000";
          ctx.fillText(String(i + 1), a.x, a.y);

          if ($("showLabels").checked) {
            ctx.textBaseline = "bottom";
            ctx.fillText(FINGER_NAMES[i], a.x, a.y - 19);
            ctx.textBaseline = "middle";
          }
        });
      }

      function processCameraFrame(now) {
        if (!isCameraActive || !model || video.readyState < 2 || video.currentTime === lastVideoTime) return;
        lastVideoTime = video.currentTime;
        const nowSec = now / 1000;

        try {
          const t0 = performance.now();
          const hand = model.detectForVideo(video, now).landmarks?.[0];
          inferenceMs = performance.now() - t0;
          inferenceCount++;

          if (hand) {
            const reacquired = !isTracked || now - lastSeenTime > 650;
            if (reacquired) resetFilters();

            landmarks = hand.map((p, i) => ({
              x: filters[i].x.filter(p.x, nowSec),
              y: filters[i].y.filter(p.y, nowSec),
            }));

            isTracked = true;
            lastSeenTime = now;
            $("calibrateButton").disabled = false;

            if (!neutralPose || reacquired) calibrateNeutral();
          } else if (now - lastSeenTime > 500 && isTracked) {
            clearTrackingState();
          }
        } catch {
          disableCamera();
        }
      }

      function clearTrackingState() {
        resetFilters();
        isTracked = false;
        landmarks = null;
        neutralPose = null;
        lastSeenTime = -Infinity;
        lastVideoTime = -1;
        $("calibrateButton").disabled = true;
      }

      function calibrateNeutral() {
        if (!landmarks || !isTracked) return;
        neutralPose = FINGER_TIPS.map((i) => ({ x: landmarks[i].x, y: landmarks[i].y }));
        $("calibrateButton").disabled = false;
      }

      async function loadModel() {
        if (model) return model;
        if (!modelPromise) {
          modelPromise = (async () => {
            const ver = "0.10.32";
            const { FilesetResolver, HandLandmarker } = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${ver}/vision_bundle.mjs`);
            const fileset = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${ver}/wasm`);
            const opts = {
              baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                delegate: "GPU",
              },
              runningMode: "VIDEO",
              numHands: 1,
              minHandDetectionConfidence: 0.5,
              minHandPresenceConfidence: 0.5,
              minTrackingConfidence: 0.5,
            };
            try {
              return (model = await HandLandmarker.createFromOptions(fileset, opts));
            } catch {
              opts.baseOptions.delegate = "CPU";
              return (model = await HandLandmarker.createFromOptions(fileset, opts));
            }
          })().catch((err) => {
            modelPromise = null;
            throw err;
          });
        }
        return modelPromise;
      }

      async function startStream(deviceId) {
        stopStream();
        clearTrackingState();

        const baseVideo = { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60, max: 60 } };
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: deviceId ? { ...baseVideo, deviceId: { exact: deviceId } } : { ...baseVideo, facingMode: "user" },
          });
        } catch (err) {
          if (deviceId && ["NotFoundError", "OverconstrainedError"].includes(err.name)) {
            stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: baseVideo });
          } else throw err;
        }

        const currentStream = stream;
        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => cleanup() || reject(new Error("Timeout")), 15000);
          const cleanup = () => {
            clearTimeout(timer);
            video.onloadedmetadata = video.onerror = null;
          };
          video.onloadedmetadata = () => (cleanup(), resolve());
          video.onerror = () => (cleanup(), reject(new Error("Camera error")));
          video.srcObject = currentStream;
        });

        await video.play();
        const track = currentStream.getVideoTracks()[0];
        const id = track.getSettings().deviceId;
        if (id)
          try {
            localStorage.setItem("puppet_camera", id);
          } catch {}

        track.addEventListener("ended", () => {
          if (stream === currentStream && !isBusy) disableCamera();
        });
        return id;
      }

      function stopStream() {
        stream?.getTracks().forEach((t) => t.stop());
        stream = video.srcObject = null;
      }

      function disableCamera() {
        isCameraActive = false;
        stopStream();
        clearTrackingState();
        $("cameraButton").textContent = "Enable camera";
        $("cameraSelect").disabled = true;
        anchors.forEach((a, i) => Object.assign(a, { tx: BASE_ANCHORS[i].x, ty: BASE_ANCHORS[i].y }));
      }

      async function populateCameras(activeId) {
        const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
        const select = $("cameraSelect");
        select.replaceChildren(
          ...devices.map((d, i) =>
            Object.assign(document.createElement("option"), {
              value: d.deviceId,
              textContent: d.label || `Camera ${i + 1}`,
            }),
          ),
        );
        if (activeId) select.value = activeId;
      }

      function setBusy(val) {
        isBusy = val;
        $("cameraButton").disabled = val;
        $("cameraSelect").disabled = val || !isCameraActive;
      }

      // --- Pure Helpers & Filters ---

      const clamp = (val, min, max) => Math.max(min, Math.min(max, val));
      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

      function getCameraTransform() {
        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 480;
        const scale = Math.max(WIDTH / vw, HEIGHT / vh);
        return {
          width: vw * scale,
          height: vh * scale,
          x: (WIDTH - vw * scale) / 2,
          y: (HEIGHT - vh * scale) / 2,
        };
      }

      function drawLine(a, b, width = 1) {
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function drawCircle(x, y, radius, fill = true, width = 1) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        if (fill) ctx.fill();
        ctx.lineWidth = width;
        ctx.stroke();
      }

      function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - rect.left) / rect.width) * WIDTH,
          y: ((e.clientY - rect.top) / rect.height) * HEIGHT,
        };
      }

      class LowPassFilter {
        y = null;
        s = null;
        filter(val, alpha) {
          this.s = this.y === null ? val : alpha * val + (1 - alpha) * this.s;
          return ((this.y = val), this.s);
        }
        reset() {
          this.y = this.s = null;
        }
      }

      class OneEuroFilter {
        x = new LowPassFilter();
        dx = new LowPassFilter();
        lastTime = null;

        alpha(cutoff, te) {
          const r = 2 * Math.PI * cutoff * te;
          return r / (r + 1);
        }

        filter(val, timestamp) {
          if (this.lastTime !== null && timestamp !== undefined) {
            const dt = timestamp - this.lastTime;
            if (dt <= 0) return this.x.s ?? val;
            if (dt > 1) this.reset();
          }
          const te = this.lastTime ? timestamp - this.lastTime : 1 / 60;
          this.lastTime = timestamp;

          const dval = this.x.y !== null ? (val - this.x.y) / te : 0;
          const edval = this.dx.filter(dval, this.alpha(1.0, te));
          const cutoff = params.filterCutoff + params.filterBeta * Math.abs(edval);
          return this.x.filter(val, this.alpha(cutoff, te));
        }

        reset() {
          this.x.reset();
          this.dx.reset();
          this.lastTime = null;
        }
      }

      const filters = Array.from({ length: 21 }, () => ({ x: new OneEuroFilter(), y: new OneEuroFilter() }));
      const resetFilters = () => filters.forEach((f) => (f.x.reset(), f.y.reset()));

      // --- Initialization & Event Listeners ---

      for (const [key, cfg] of Object.entries(PARAM_CONFIG)) {
        const input = $(key);
        const update = () => {
          params[key] = Number(input.value);
          $(`${key}Value`).value = cfg.fmt(params[key]);
          if (key === "torsoMass") updateParticleMasses();
        };
        input.addEventListener("input", update);
        update();
      }

      new ResizeObserver(() => {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
      }).observe(canvas);

      canvas.addEventListener("pointerdown", (e) => {
        if (isCameraActive || isBusy) return;
        const p = getPointerPos(e);
        let minDist = 35;
        draggedAnchor = -1;

        anchors.forEach((a, i) => {
          const d = dist(a, p);
          if (d < minDist) ((minDist = d), (draggedAnchor = i));
        });

        if (draggedAnchor >= 0) {
          activePointerId = e.pointerId;
          canvas.setPointerCapture(activePointerId);
        }
      });

      canvas.addEventListener("pointermove", (e) => {
        if (draggedAnchor < 0 || e.pointerId !== activePointerId) return;
        const p = getPointerPos(e);
        const a = anchors[draggedAnchor];
        a.x = a.tx = clamp(p.x, 60, 940);
        a.y = a.ty = clamp(p.y, 75, 480);
      });

      const releasePointer = () => ((draggedAnchor = -1), (activePointerId = null));
      ["pointerup", "pointercancel", "lostpointercapture"].forEach((evt) => canvas.addEventListener(evt, releasePointer));

      $("cameraButton").addEventListener("click", async () => {
        if (isCameraActive) return disableCamera();
        if (!isSecureContext || !navigator.mediaDevices?.getUserMedia) return;

        setBusy(true);
        releasePointer();
        try {
          await loadModel();
          let savedId = "";
          try {
            savedId = localStorage.getItem("puppet_camera") || "";
          } catch {}
          const id = await startStream(savedId);
          isCameraActive = true;
          $("cameraButton").textContent = "Disable camera";
          await populateCameras(id);
        } catch {
          disableCamera();
        } finally {
          setBusy(false);
        }
      });

      $("cameraSelect").addEventListener("change", async (e) => {
        if (isBusy || !isCameraActive) return;
        setBusy(true);
        isCameraActive = false;
        try {
          const id = await startStream(e.target.value);
          isCameraActive = true;
          await populateCameras(id);
        } catch {
          disableCamera();
        } finally {
          setBusy(false);
        }
      });

      $("resetButton").addEventListener("click", resetPuppet);
      $("calibrateButton").addEventListener("click", calibrateNeutral);

      navigator.mediaDevices?.addEventListener?.("devicechange", () => {
        if (isCameraActive && !isBusy) {
          populateCameras(stream?.getVideoTracks()[0]?.getSettings().deviceId).catch(() => {});
        }
      });

      document.addEventListener("visibilitychange", () => {
        previousTime = performance.now();
        accumulator = 0;
        particles.forEach((p) => ((p.px = p.x), (p.py = p.y)));
      });

      window.addEventListener("pagehide", disableCamera);

      resetPuppet();
      requestAnimationFrame(mainLoop);
    </script>
  </body>
</html>
