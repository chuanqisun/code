<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hand puppet prototype</title>
    <style>
      :root {
        --fg: #000;
        --bg: #fff;
        --border: 1px solid var(--fg);
        --font: 12px monospace;
        --gap: 12px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 16px;
        color: var(--fg);
        background: var(--bg);
        font: var(--font);
      }

      header {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;

        h1 {
          margin: 0 12px 0 0;
          font-size: 14px;
        }
      }

      button,
      select,
      input {
        font: inherit;
        accent-color: var(--fg);
      }

      button,
      select {
        color: var(--fg);
        background: var(--bg);
        border: var(--border);
        padding: 5px;
      }

      button {
        cursor: pointer;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 16px;

        @media (max-width: 760px) {
          grid-template-columns: 1fr;

          aside {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
          }
        }
      }

      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        border: var(--border);
        touch-action: none;
      }

      video {
        display: none;
      }

      fieldset {
        margin: 0 0 var(--gap);
        border: var(--border);
        padding: 10px;

        p {
          margin: 8px 0;
        }
      }

      .setting {
        display: block;
        margin-bottom: var(--gap);

        span {
          display: flex;
          justify-content: space-between;
          gap: 8px;
        }

        input[type="range"] {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <button id="cameraButton">Enable camera</button>
      <select id="cameraSelect" aria-label="Camera" disabled>
        <option>Camera source</option>
      </select>
      <button id="resetButton">Reset puppets</button>
      <button id="calibrateButton" disabled>Recalibrate neutral</button>
    </header>

    <main>
      <section>
        <canvas id="canvas"></canvas>
        <video id="video" autoplay playsinline muted></video>
      </section>

      <aside>
        <fieldset>
          <legend>Tracking</legend>
          <label class="setting">
            <span>Hand sensitivity <output id="sensitivityValue"></output></span>
            <input id="sensitivity" type="range" min="0.4" max="2.5" step="0.1" value="1.0" />
          </label>
          <label class="setting">
            <span>1€ filter beta <output id="filterBetaValue"></output></span>
            <input id="filterBeta" type="range" min="0.1" max="25" step="0.5" value="10.0" />
          </label>
          <label class="setting">
            <span>1€ min cutoff <output id="filterCutoffValue"></output></span>
            <input id="filterCutoff" type="range" min="0.1" max="5" step="0.1" value="1.0" />
          </label>
          <label><input id="debugMode" type="checkbox" /> Debug</label>
          <p>
            <label><input id="showStrings" type="checkbox" checked /> Strings</label>
          </p>
        </fieldset>

        <fieldset>
          <legend>Physics</legend>
          <label class="setting">
            <span>Gravity scale <output id="gravityValue"></output></span>
            <input id="gravity" type="range" min="0.2" max="2.5" step="0.1" value="2" />
          </label>
          <label class="setting">
            <span>Velocity retention <output id="dampingValue"></output></span>
            <input id="damping" type="range" min="0.88" max="0.995" step="0.005" value="0.98" />
          </label>
          <label class="setting">
            <span>Anchor follow speed <output id="anchorFollowValue"></output></span>
            <input id="anchorFollow" type="range" min="4" max="60" step="1" value="45" />
          </label>
          <label class="setting">
            <span>Rope pull stiffness <output id="pullStiffValue"></output></span>
            <input id="pullStiff" type="range" min="0.2" max="1.0" step="0.05" value="1.0" />
          </label>
          <label class="setting">
            <span>Solver iterations <output id="iterationsValue"></output></span>
            <input id="iterations" type="range" min="4" max="24" step="1" value="16" />
          </label>
          <label class="setting">
            <span>Torso lightness <output id="torsoMassValue"></output></span>
            <input id="torsoMass" type="range" min="0.4" max="1.2" step="0.05" value="1.0" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Debug</legend>
          <div id="stats">Manual input</div>
        </fieldset>
      </aside>
    </main>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const canvas = $("canvas");
      const ctx = canvas.getContext("2d");
      const video = $("video");

      const WIDTH = 1000;
      const HEIGHT = 760;
      const FLOOR = 682;
      const TIME_STEP = 1 / 120;

      const FINGER_TIPS = [4, 8, 12, 16, 20];
      const ROPE_ATTACHMENTS = [7, 11, 0, 12, 8];

      const DESIGN_POSE = [
        [500, 377],
        [500, 415],
        [500, 505],
        [472, 415],
        [528, 415],
        [442, 455],
        [558, 455],
        [420, 497],
        [580, 497],
        [475, 555],
        [525, 555],
        [458, 610],
        [542, 610],
      ];

      // Shift the whole rig down so the feet rest exactly on the floor (feet particle radius is 5).
      const POSE_DROP = FLOOR - 5 - Math.max(...DESIGN_POSE.map(([, y]) => y));
      const INITIAL_POSE = DESIGN_POSE.map(([x, y]) => [x, y + POSE_DROP]);

      const LIMB_ROPE_LENGTH = Math.hypot(INITIAL_POSE[7][0] - 270, INITIAL_POSE[7][1] - (195 + POSE_DROP));
      const INDEX_RING_Y = Math.round(INITIAL_POSE[11][1] - Math.sqrt(LIMB_ROPE_LENGTH ** 2 - (INITIAL_POSE[11][0] - 385) ** 2));

      // Visual-only lift so control points and string tops render above the viewport unless in debug mode (physics unaffected).
      const ANCHOR_RENDER_LIFT = 500;

      const BASE_ANCHORS = [
        { x: 270, y: 195 + POSE_DROP },
        { x: 385, y: INDEX_RING_Y },
        { x: 500, y: 130 + POSE_DROP },
        { x: 615, y: INDEX_RING_Y },
        { x: 730, y: 195 + POSE_DROP },
      ];

      const BONE_PAIRS = [
        [0, 1],
        [1, 3],
        [1, 4],
        [3, 4],
        [1, 2],
        [3, 2],
        [4, 2],
        [3, 5],
        [5, 7],
        [4, 6],
        [6, 8],
        [2, 9],
        [9, 11],
        [2, 10],
        [10, 12],
      ];

      const VISIBLE_BONES = [
        [1, 2],
        [3, 4],
        [3, 5],
        [5, 7],
        [4, 6],
        [6, 8],
        [2, 9],
        [9, 11],
        [2, 10],
        [10, 12],
      ];

      const HAND_CONNECTIONS = [
        [0, 1],
        [1, 2],
        [2, 3],
        [3, 4],
        [0, 5],
        [5, 6],
        [6, 7],
        [7, 8],
        [5, 9],
        [9, 10],
        [10, 11],
        [11, 12],
        [9, 13],
        [13, 14],
        [14, 15],
        [15, 16],
        [13, 17],
        [0, 17],
        [17, 18],
        [18, 19],
        [19, 20],
      ];

      const PARAM_CONFIG = {
        sensitivity: { val: 1.0, fmt: (v) => `${v.toFixed(1)}×` },
        filterBeta: { val: 10.0, fmt: (v) => `${v.toFixed(1)}` },
        filterCutoff: { val: 1.0, fmt: (v) => `${v.toFixed(1)} Hz` },
        gravity: { val: 2.0, fmt: (v) => `${v.toFixed(1)}×` },
        damping: { val: 0.98, fmt: (v) => `${v.toFixed(3)}` },
        anchorFollow: { val: 45, fmt: (v) => `${v} /s` },
        pullStiff: { val: 1.0, fmt: (v) => `${v.toFixed(2)}` },
        iterations: { val: 16, fmt: (v) => `${v}` },
        torsoMass: { val: 1.0, fmt: (v) => `${v.toFixed(2)}` },
      };

      const params = Object.fromEntries(Object.entries(PARAM_CONFIG).map(([k, v]) => [k, v.val]));

      // One puppet per tracked hand; offsets only set the resting/manual placement (camera x is absolute).
      const PUPPET_OFFSETS = [-220, 220];
      const BONE_RADIUS = 3;
      const COLLISION_SEGMENTS = [[0, 1], ...VISIBLE_BONES];
      const particleRadius = (i) => (i === 0 ? 24 : 6);

      // Filters are created in resetPuppets (OneEuroFilter is declared further down).
      const createFilters = () => Array.from({ length: 21 }, () => ({ x: new OneEuroFilter(), y: new OneEuroFilter() }));

      const puppets = PUPPET_OFFSETS.map((offsetX) => ({
        offsetX,
        particles: [],
        bones: [],
        ropes: [],
        anchors: BASE_ANCHORS.map((p) => ({ x: p.x + offsetX, y: p.y, tx: p.x + offsetX, ty: p.y })),
        isTracked: false,
        landmarks: null,
        neutralPose: null,
        lastSeenTime: -Infinity,
        filters: null,
      }));

      let model = null;
      let modelPromise = null;
      let stream = null;
      let isCameraActive = false;
      let isBusy = false;
      let lastVideoTime = -1;
      let inferenceMs = 0;
      let inferenceCount = 0;

      let dragged = null;
      let activePointerId = null;

      let previousTime = performance.now();
      let accumulator = 0;
      let lastStatsTime = previousTime;

      function mainLoop(now) {
        const elapsed = Math.min((now - previousTime) / 1000, 0.05);
        previousTime = now;

        processCameraFrame(now);
        puppets.forEach(updateAnchorTargets);

        accumulator += elapsed;
        let steps = 0;
        while (accumulator >= TIME_STEP && steps < 6) {
          stepPhysics(TIME_STEP);
          accumulator -= TIME_STEP;
          steps++;
        }
        if (steps === 6) accumulator = 0;

        render();
        updateStats(now);
        requestAnimationFrame(mainLoop);
      }

      function updateStats(now) {
        if (now - lastStatsTime < 1000) return;
        const rate = (inferenceCount * 1000) / (now - lastStatsTime);
        inferenceCount = 0;
        lastStatsTime = now;

        const camFps = stream?.getVideoTracks()[0]?.getSettings().frameRate;
        const hands = puppets.filter((pp) => pp.isTracked).length;
        $("stats").textContent = isCameraActive
          ? `Tracking: ${rate.toFixed(0)} fps | hands: ${hands} | inference: ${inferenceMs.toFixed(1)} ms | cam: ${camFps ? camFps.toFixed(0) : "?"} fps`
          : "Manual input | physics: 120 Hz";
      }

      const baseAnchor = (pp, i) => ({ x: BASE_ANCHORS[i].x + pp.offsetX, y: BASE_ANCHORS[i].y });

      function resetAnchors(pp) {
        pp.anchors.forEach((a, i) => {
          const b = baseAnchor(pp, i);
          Object.assign(a, { tx: b.x, ty: b.y });
        });
      }

      function resetPuppets() {
        for (const pp of puppets) {
          pp.filters ??= createFilters();
          pp.particles = INITIAL_POSE.map(([x, y]) => ({ x: x + pp.offsetX, y, px: x + pp.offsetX, py: y, invMass: 1.0 }));

          pp.bones = BONE_PAIRS.map(([a, b]) => ({
            a,
            b,
            length: dist(pp.particles[a], pp.particles[b]),
          }));

          pp.ropes = ROPE_ATTACHMENTS.map((part, i) => ({
            part,
            length: i === 2 ? Math.hypot(INITIAL_POSE[part][0] - BASE_ANCHORS[i].x, INITIAL_POSE[part][1] - BASE_ANCHORS[i].y) : LIMB_ROPE_LENGTH,
            tension: 0,
            slack: 0,
          }));

          pp.anchors.forEach((a, i) => Object.assign(a, baseAnchor(pp, i)));
          resetAnchors(pp);
          if (isCameraActive && pp.isTracked) calibrateNeutral(pp);
        }
        updateParticleMasses();
      }

      function updateParticleMasses() {
        for (const pp of puppets) {
          pp.particles.forEach((p, i) => {
            p.invMass = i === 2 ? params.torsoMass : i <= 4 ? Math.min(1.0, params.torsoMass + 0.15) : 1.0;
          });
        }
      }

      function updateAnchorTargets(pp) {
        if (isCameraActive && pp.isTracked && pp.neutralPose) {
          FINGER_TIPS.forEach((tipIdx, i) => {
            const pt = pp.landmarks[tipIdx];
            const dx = pt.x - pp.neutralPose[i].x;
            const dy = pt.y - pp.neutralPose[i].y;
            pp.anchors[i].tx = clamp(BASE_ANCHORS[i].x + dx * 800 * params.sensitivity, 65, 935);
            pp.anchors[i].ty = clamp(BASE_ANCHORS[i].y + dy * 640 * params.sensitivity, 75, 480);
          });
        } else if (isCameraActive) {
          resetAnchors(pp);
        }
      }

      function stepPhysics(dt) {
        const blend = 1 - Math.exp(-params.anchorFollow * dt);

        for (const pp of puppets) {
          pp.anchors.forEach((a, i) => {
            const isDragged = dragged?.pp === pp && dragged.i === i;
            a.x = isDragged ? a.tx : a.x + (a.tx - a.x) * blend;
            a.y = isDragged ? a.ty : a.y + (a.ty - a.y) * blend;
          });

          for (const p of pp.particles) {
            const vx = (p.x - p.px) * params.damping;
            const vy = (p.y - p.py) * params.damping;
            p.px = p.x;
            p.py = p.y;
            p.x += vx;
            p.y += vy + 1050 * params.gravity * dt * dt;
          }

          // With the camera on but no hand, the puppeteer has let go: release all strings so the puppet collapses.
          // When the hand returns, strings re-grip at their current length and reel in gradually (no snap).
          const isHeld = !isCameraActive || pp.isTracked;
          pp.ropes.forEach((r, i) => {
            r.tension = 0;
            if (!isHeld) r.slack = Infinity;
            else if (r.slack === Infinity) r.slack = Math.max(0, dist(pp.anchors[i], pp.particles[r.part]) - r.length);
            else r.slack = Math.max(0, r.slack * Math.exp(-2.5 * dt) - 60 * dt);
          });
        }

        for (let iter = 0; iter < params.iterations; iter++) {
          for (const pp of puppets) {
            const particles = pp.particles;
            for (const b of pp.bones) {
              const a = particles[b.a];
              const c = particles[b.b];
              const dx = c.x - a.x;
              const dy = c.y - a.y;
              const d = Math.hypot(dx, dy) || 0.0001;
              const k = (d - b.length) / d / (a.invMass + c.invMass);
              a.x += dx * k * a.invMass;
              a.y += dy * k * a.invMass;
              c.x -= dx * k * c.invMass;
              c.y -= dy * k * c.invMass;
            }

            pp.ropes.forEach((r, i) => {
              const p = particles[r.part];
              const a = pp.anchors[i];
              const dx = p.x - a.x;
              const dy = p.y - a.y;
              const d = Math.hypot(dx, dy);
              if (d > r.length + r.slack) {
                const excess = d - r.length - r.slack;
                const corr = (excess / d) * params.pullStiff;
                p.x -= dx * corr;
                p.y -= dy * corr;
                r.tension = Math.max(r.tension, excess);
              }
            });
          }

          for (let i = 0; i < puppets.length; i++) {
            for (let j = i + 1; j < puppets.length; j++) collidePuppets(puppets[i], puppets[j]);
          }

          for (const pp of puppets) {
            pp.particles.forEach((p, i) => {
              const radius = i === 0 ? 24 : 5;
              p.x = clamp(p.x, radius + 40, WIDTH - 40 - radius);
              if (p.y > FLOOR - radius) {
                p.y = FLOOR - radius;
                p.px = p.x + (p.px - p.x) * 0.7;
                if (p.py < p.y) p.py = p.y;
              }
            });
          }
        }
      }

      function collidePuppets(A, B) {
        // Joint vs joint (covers head-to-head), then joints vs the other puppet's bone capsules, both ways.
        A.particles.forEach((p, i) => {
          B.particles.forEach((q, j) => {
            const dx = p.x - q.x;
            const dy = p.y - q.y;
            const d = Math.hypot(dx, dy);
            const overlap = particleRadius(i) + particleRadius(j) - d;
            if (overlap <= 0 || d < 1e-6) return;
            const s = overlap / d / (p.invMass + q.invMass);
            p.x += dx * s * p.invMass;
            p.y += dy * s * p.invMass;
            q.x -= dx * s * q.invMass;
            q.y -= dy * s * q.invMass;
          });
        });
        collideJointsWithBones(A, B);
        collideJointsWithBones(B, A);
        collideBones(A, B);
      }

      const centroid = (particles) => {
        const c = { x: 0, y: 0 };
        for (const p of particles) ((c.x += p.x), (c.y += p.y));
        return { x: c.x / particles.length, y: c.y / particles.length };
      };

      // Closest points between segments p1-q1 and p2-q2 as parameters (s, t) in [0, 1].
      function closestSegmentParams(p1, q1, p2, q2) {
        const d1x = q1.x - p1.x, d1y = q1.y - p1.y;
        const d2x = q2.x - p2.x, d2y = q2.y - p2.y;
        const rx = p1.x - p2.x, ry = p1.y - p2.y;
        const a = d1x * d1x + d1y * d1y || 1e-9;
        const e = d2x * d2x + d2y * d2y || 1e-9;
        const f = d2x * rx + d2y * ry;
        const c = d1x * rx + d1y * ry;
        const b = d1x * d2x + d1y * d2y;
        const denom = a * e - b * b;
        let s = denom > 1e-9 ? clamp((b * f - c * e) / denom, 0, 1) : 0;
        let t = (b * s + f) / e;
        if (t < 0) ((t = 0), (s = clamp(-c / a, 0, 1)));
        else if (t > 1) ((t = 1), (s = clamp((b - c) / a, 0, 1)));
        return [s, t];
      }

      const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
      const segmentsCross = (p1, q1, p2, q2) =>
        cross(p1, q1, p2) * cross(p1, q1, q2) < 0 && cross(p2, q2, p1) * cross(p2, q2, q1) < 0;

      // Limb-vs-limb: keeps bones from passing through each other. If two bones have already crossed,
      // the closest-point normal is meaningless, so push them apart along the puppets' side-to-side axis
      // (each puppet back toward its own side) instead of letting the solver lock them together.
      function collideBones(A, B) {
        const ca = centroid(A.particles);
        const cb = centroid(B.particles);
        const sideX = ca.x - cb.x || 1;
        const side = { x: Math.sign(sideX), y: 0 };
        const minDist = 2 * BONE_RADIUS + 2;

        for (const [i1, j1] of COLLISION_SEGMENTS) {
          const a0 = A.particles[i1];
          const a1 = A.particles[j1];
          for (const [i2, j2] of COLLISION_SEGMENTS) {
            const b0 = B.particles[i2];
            const b1 = B.particles[j2];
            const [s, t] = closestSegmentParams(a0, a1, b0, b1);
            const pa = { x: a0.x + (a1.x - a0.x) * s, y: a0.y + (a1.y - a0.y) * s };
            const pb = { x: b0.x + (b1.x - b0.x) * t, y: b0.y + (b1.y - b0.y) * t };
            let nx = pa.x - pb.x;
            let ny = pa.y - pb.y;
            let d = Math.hypot(nx, ny);
            let overlap = minDist - d;

            if (segmentsCross(a0, a1, b0, b1) || d < 1e-6) {
              ({ x: nx, y: ny } = side);
              const proj = (p) => p.x * nx + p.y * ny;
              // Depth needed for A's bone to sit entirely on its side of B's bone; resolved gradually.
              overlap = 0.25 * (Math.max(proj(b0), proj(b1)) - Math.min(proj(a0), proj(a1)) + minDist);
              d = 1;
            } else if (overlap <= 0) continue;
            else ((nx /= d), (ny /= d));

            const wa0 = a0.invMass * (1 - s), wa1 = a1.invMass * s;
            const wb0 = b0.invMass * (1 - t), wb1 = b1.invMass * t;
            const k = overlap / (wa0 * (1 - s) + wa1 * s + wb0 * (1 - t) + wb1 * t || 1);
            a0.x += nx * k * wa0, a0.y += ny * k * wa0;
            a1.x += nx * k * wa1, a1.y += ny * k * wa1;
            b0.x -= nx * k * wb0, b0.y -= ny * k * wb0;
            b1.x -= nx * k * wb1, b1.y -= ny * k * wb1;
          }
        }
      }

      function collideJointsWithBones(A, B) {
        A.particles.forEach((p, i) => {
          const minDist = particleRadius(i) + BONE_RADIUS;
          for (const [s, t] of COLLISION_SEGMENTS) {
            const a = B.particles[s];
            const b = B.particles[t];
            const ex = b.x - a.x;
            const ey = b.y - a.y;
            const u = clamp(((p.x - a.x) * ex + (p.y - a.y) * ey) / (ex * ex + ey * ey || 1), 0, 1);
            const nx = p.x - (a.x + ex * u);
            const ny = p.y - (a.y + ey * u);
            const d = Math.hypot(nx, ny);
            const overlap = minDist - d;
            if (overlap <= 0 || d < 1e-6) continue;
            const wa = a.invMass * (1 - u);
            const wb = b.invMass * u;
            const s2 = overlap / d / (p.invMass + wa * (1 - u) + wb * u);
            p.x += nx * s2 * p.invMass;
            p.y += ny * s2 * p.invMass;
            a.x -= nx * s2 * wa;
            a.y -= ny * s2 * wa;
            b.x -= nx * s2 * wb;
            b.y -= ny * s2 * wb;
          }
        });
      }

      // Play mode: black stage, colored puppets + strings only. Debug mode: camera feed, hand landmarks, floor, control points.
      const PLAY_COLORS = ["hsl(330 100% 80%)", "hsl(200 100% 80%)"];

      function render() {
        const isDebug = $("debugMode").checked;
        ctx.setTransform(canvas.width / WIDTH, 0, 0, canvas.height / HEIGHT, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = isDebug ? "#fff" : "#000";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (isDebug) {
          if (isCameraActive && video.readyState >= 2) {
            const t = getCameraTransform();
            ctx.save();
            ctx.globalAlpha = 0.5;
            ctx.drawImage(video, t.x, t.y, t.width, t.height);
            ctx.restore();
          }

          ctx.strokeStyle = "#000";
          ctx.fillStyle = "#fff";
          drawLine({ x: 0, y: FLOOR }, { x: WIDTH, y: FLOOR }, 1);

          const t = getCameraTransform();
          const mapPt = (p) => ({ x: t.x + p.x * t.width, y: t.y + p.y * t.height });

          ctx.save();
          ctx.globalAlpha = 0.55;
          for (const { landmarks, isTracked } of puppets) {
            if (!landmarks || !isTracked) continue;
            for (const [a, b] of HAND_CONNECTIONS) drawLine(mapPt(landmarks[a]), mapPt(landmarks[b]), 1.3);
            for (const p of landmarks) {
              const pt = mapPt(p);
              drawCircle(pt.x, pt.y, 2.5);
            }
          }
          ctx.restore();
        }

        puppets.forEach((pp, i) =>
          renderPuppet(pp, isDebug ? { ink: "#000", paper: "#fff", lift: 0 } : { ink: PLAY_COLORS[i], paper: "#000", lift: ANCHOR_RENDER_LIFT }),
        );
      }

      function renderPuppet({ particles, ropes, anchors }, { ink, paper, lift }) {
        ctx.strokeStyle = ink;
        ctx.fillStyle = paper;

        if ($("showStrings").checked) {
          ropes.forEach((r, i) => {
            const a = { x: anchors[i].x, y: anchors[i].y - lift };
            const p = particles[r.part];
            const slack = clamp((r.length + Math.min(r.slack, 1000) - dist(anchors[i], p)) * 0.55, 0, 55);

            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.quadraticCurveTo((a.x + p.x) / 2 + slack, (a.y + p.y) / 2 + slack, p.x, p.y);
            ctx.stroke();
          });
        }

        for (const [a, b] of VISIBLE_BONES) drawLine(particles[a], particles[b], 6);
        drawLine(particles[0], particles[1], 6);

        const [head, neck] = particles;
        ctx.save();
        ctx.translate(head.x, head.y);
        ctx.rotate(Math.atan2(neck.y - head.y, neck.x - head.x) - Math.PI / 2);
        drawCircle(0, 0, 24, true, 4);
        ctx.fillStyle = ink;
        drawCircle(-7, -2, 1.5);
        drawCircle(7, -2, 1.5);
        drawLine({ x: -6, y: 9 }, { x: 6, y: 9 }, 1.5);
        ctx.restore();

        for (let i = 1; i < particles.length; i++) {
          drawCircle(particles[i].x, particles[i].y, i <= 4 ? 3.2 : 4.2, true, 1.8);
        }

        if (lift) return;

        ctx.font = "12px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        anchors.forEach(({ x, y }, i) => {
          ctx.fillStyle = paper;
          drawCircle(x, y, dragged?.pp.anchors === anchors && dragged.i === i ? 15 : 12, true, 1.8);
          ctx.fillStyle = ink;
          ctx.fillText(String(i + 1), x, y);
        });
      }

      // MediaPipe labels handedness for a mirrored (selfie) image; on our unmirrored feed "Left" sits on screen left.
      function assignHands(hands, handedness) {
        const slots = new Array(puppets.length).fill(null);
        const labeled = hands.map((hand, k) => ({ hand, slot: handedness?.[k]?.[0]?.categoryName === "Right" ? 1 : 0 }));
        if (labeled.length === 2 && labeled[0].slot === labeled[1].slot) {
          labeled.sort((a, b) => a.hand[0].x - b.hand[0].x).forEach((h, k) => (h.slot = k));
        }
        for (const { hand, slot } of labeled) slots[slot] = hand;
        return slots;
      }

      function processCameraFrame(now) {
        if (!isCameraActive || !model || video.readyState < 2 || video.currentTime === lastVideoTime) return;
        lastVideoTime = video.currentTime;
        const nowSec = now / 1000;

        try {
          const t0 = performance.now();
          const result = model.detectForVideo(video, now);
          inferenceMs = performance.now() - t0;
          inferenceCount++;

          const slots = assignHands(result.landmarks ?? [], result.handedness ?? result.handednesses);

          puppets.forEach((pp, k) => {
            const hand = slots[k];
            if (hand) {
              const reacquired = !pp.isTracked || now - pp.lastSeenTime > 650;
              if (reacquired) resetFilters(pp);

              pp.landmarks = hand.map((p, i) => ({
                x: pp.filters[i].x.filter(p.x, nowSec),
                y: pp.filters[i].y.filter(p.y, nowSec),
              }));

              pp.isTracked = true;
              pp.lastSeenTime = now;

              if (!pp.neutralPose || reacquired) calibrateNeutral(pp);
            } else if (now - pp.lastSeenTime > 500 && pp.isTracked) {
              clearHand(pp);
            }
          });
          $("calibrateButton").disabled = !puppets.some((pp) => pp.isTracked);
        } catch {
          disableCamera();
        }
      }

      function clearHand(pp) {
        resetFilters(pp);
        pp.isTracked = false;
        pp.landmarks = null;
        pp.neutralPose = null;
        pp.lastSeenTime = -Infinity;
      }

      function clearTrackingState() {
        puppets.forEach(clearHand);
        lastVideoTime = -1;
        $("calibrateButton").disabled = true;
      }

      function calibrateNeutral(pp) {
        if (!pp.landmarks || !pp.isTracked) return;
        // Keep only finger spread horizontally: re-center x on the frame so absolute hand position drives placement.
        const meanX = FINGER_TIPS.reduce((sum, i) => sum + pp.landmarks[i].x, 0) / FINGER_TIPS.length;
        pp.neutralPose = FINGER_TIPS.map((i) => ({ x: pp.landmarks[i].x - meanX + 0.5, y: pp.landmarks[i].y }));
      }

      async function loadModel() {
        if (model) return model;
        if (!modelPromise) {
          modelPromise = (async () => {
            const ver = "0.10.32";
            const { FilesetResolver, HandLandmarker } = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${ver}/vision_bundle.mjs`);
            const fileset = await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${ver}/wasm`);
            const opts = {
              baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                delegate: "GPU",
              },
              runningMode: "VIDEO",
              numHands: 2,
              minHandDetectionConfidence: 0.5,
              minHandPresenceConfidence: 0.5,
              minTrackingConfidence: 0.5,
            };
            try {
              return (model = await HandLandmarker.createFromOptions(fileset, opts));
            } catch {
              opts.baseOptions.delegate = "CPU";
              return (model = await HandLandmarker.createFromOptions(fileset, opts));
            }
          })().catch((err) => {
            modelPromise = null;
            throw err;
          });
        }
        return modelPromise;
      }

      async function startStream(deviceId) {
        stopStream();
        clearTrackingState();

        const baseVideo = { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60, max: 60 } };
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: deviceId ? { ...baseVideo, deviceId: { exact: deviceId } } : { ...baseVideo, facingMode: "user" },
          });
        } catch (err) {
          if (deviceId && ["NotFoundError", "OverconstrainedError"].includes(err.name)) {
            stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: baseVideo });
          } else throw err;
        }

        const currentStream = stream;
        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => cleanup() || reject(new Error("Timeout")), 15000);
          const cleanup = () => {
            clearTimeout(timer);
            video.onloadedmetadata = video.onerror = null;
          };
          video.onloadedmetadata = () => (cleanup(), resolve());
          video.onerror = () => (cleanup(), reject(new Error("Camera error")));
          video.srcObject = currentStream;
        });

        await video.play();
        const track = currentStream.getVideoTracks()[0];
        const id = track.getSettings().deviceId;
        if (id)
          try {
            localStorage.setItem("puppet_camera", id);
          } catch {}

        track.addEventListener("ended", () => {
          if (stream === currentStream && !isBusy) disableCamera();
        });
        return id;
      }

      function stopStream() {
        stream?.getTracks().forEach((t) => t.stop());
        stream = video.srcObject = null;
      }

      function disableCamera() {
        isCameraActive = false;
        stopStream();
        clearTrackingState();
        $("cameraButton").textContent = "Enable camera";
        $("cameraSelect").disabled = true;
        puppets.forEach(resetAnchors);
      }

      async function populateCameras(activeId) {
        const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
        const select = $("cameraSelect");
        select.replaceChildren(
          ...devices.map((d, i) =>
            Object.assign(document.createElement("option"), {
              value: d.deviceId,
              textContent: d.label || `Camera ${i + 1}`,
            }),
          ),
        );
        if (activeId) select.value = activeId;
      }

      function setBusy(val) {
        isBusy = val;
        $("cameraButton").disabled = val;
        $("cameraSelect").disabled = val || !isCameraActive;
      }

      // --- Pure Helpers & Filters ---

      const clamp = (val, min, max) => Math.max(min, Math.min(max, val));
      const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

      function getCameraTransform() {
        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 480;
        const scale = Math.max(WIDTH / vw, HEIGHT / vh);
        return {
          width: vw * scale,
          height: vh * scale,
          x: (WIDTH - vw * scale) / 2,
          y: (HEIGHT - vh * scale) / 2,
        };
      }

      function drawLine(a, b, width = 1) {
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function drawCircle(x, y, radius, fill = true, width = 1) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        if (fill) ctx.fill();
        ctx.lineWidth = width;
        ctx.stroke();
      }

      function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: ((e.clientX - rect.left) / rect.width) * WIDTH,
          y: ((e.clientY - rect.top) / rect.height) * HEIGHT,
        };
      }

      class LowPassFilter {
        y = null;
        s = null;
        filter(val, alpha) {
          this.s = this.y === null ? val : alpha * val + (1 - alpha) * this.s;
          return ((this.y = val), this.s);
        }
        reset() {
          this.y = this.s = null;
        }
      }

      class OneEuroFilter {
        x = new LowPassFilter();
        dx = new LowPassFilter();
        lastTime = null;

        alpha(cutoff, te) {
          const r = 2 * Math.PI * cutoff * te;
          return r / (r + 1);
        }

        filter(val, timestamp) {
          if (this.lastTime !== null && timestamp !== undefined) {
            const dt = timestamp - this.lastTime;
            if (dt <= 0) return this.x.s ?? val;
            if (dt > 1) this.reset();
          }
          const te = this.lastTime ? timestamp - this.lastTime : 1 / 60;
          this.lastTime = timestamp;

          const dval = this.x.y !== null ? (val - this.x.y) / te : 0;
          const edval = this.dx.filter(dval, this.alpha(1.0, te));
          const cutoff = params.filterCutoff + params.filterBeta * Math.abs(edval);
          return this.x.filter(val, this.alpha(cutoff, te));
        }

        reset() {
          this.x.reset();
          this.dx.reset();
          this.lastTime = null;
        }
      }

      const resetFilters = (pp) => pp.filters.forEach((f) => (f.x.reset(), f.y.reset()));

      // --- Initialization & Event Listeners ---

      for (const [key, cfg] of Object.entries(PARAM_CONFIG)) {
        const input = $(key);
        const update = () => {
          params[key] = Number(input.value);
          $(`${key}Value`).value = cfg.fmt(params[key]);
          if (key === "torsoMass") updateParticleMasses();
        };
        input.addEventListener("input", update);
        update();
      }

      new ResizeObserver(() => {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
      }).observe(canvas);

      canvas.addEventListener("pointerdown", (e) => {
        if (isCameraActive || isBusy) return;
        const p = getPointerPos(e);
        let minDist = 35;
        dragged = null;

        for (const pp of puppets) {
          pp.anchors.forEach((a, i) => {
            const d = dist(a, p);
            if (d < minDist) ((minDist = d), (dragged = { pp, i }));
          });
        }

        if (dragged) {
          activePointerId = e.pointerId;
          canvas.setPointerCapture(activePointerId);
        }
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!dragged || e.pointerId !== activePointerId) return;
        const p = getPointerPos(e);
        const a = dragged.pp.anchors[dragged.i];
        a.x = a.tx = clamp(p.x, 60, 940);
        a.y = a.ty = clamp(p.y, 75, 480);
      });

      const releasePointer = () => ((dragged = null), (activePointerId = null));
      ["pointerup", "pointercancel", "lostpointercapture"].forEach((evt) => canvas.addEventListener(evt, releasePointer));

      $("cameraButton").addEventListener("click", async () => {
        if (isCameraActive) return disableCamera();
        if (!isSecureContext || !navigator.mediaDevices?.getUserMedia) return;

        setBusy(true);
        releasePointer();
        try {
          await loadModel();
          let savedId = "";
          try {
            savedId = localStorage.getItem("puppet_camera") || "";
          } catch {}
          const id = await startStream(savedId);
          isCameraActive = true;
          $("cameraButton").textContent = "Disable camera";
          await populateCameras(id);
        } catch {
          disableCamera();
        } finally {
          setBusy(false);
        }
      });

      $("cameraSelect").addEventListener("change", async (e) => {
        if (isBusy || !isCameraActive) return;
        setBusy(true);
        isCameraActive = false;
        try {
          const id = await startStream(e.target.value);
          isCameraActive = true;
          await populateCameras(id);
        } catch {
          disableCamera();
        } finally {
          setBusy(false);
        }
      });

      $("resetButton").addEventListener("click", resetPuppets);
      $("calibrateButton").addEventListener("click", () => puppets.forEach(calibrateNeutral));

      navigator.mediaDevices?.addEventListener?.("devicechange", () => {
        if (isCameraActive && !isBusy) {
          populateCameras(stream?.getVideoTracks()[0]?.getSettings().deviceId).catch(() => {});
        }
      });

      document.addEventListener("visibilitychange", () => {
        previousTime = performance.now();
        accumulator = 0;
        puppets.forEach((pp) => pp.particles.forEach((p) => ((p.px = p.x), (p.py = p.y))));
      });

      window.addEventListener("pagehide", disableCamera);

      resetPuppets();
      requestAnimationFrame(mainLoop);
      $("cameraButton").click();
    </script>
  </body>
</html>
