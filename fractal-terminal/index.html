<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wall of Text</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght,GRAD@8..144,25..151,100..1000,-200..150&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #000;
        --cursor-idle: grab;
        --cursor-active: grabbing;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        user-select: none;
      }

      canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: var(--cursor-idle);

        &.dragging {
          cursor: var(--cursor-active);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <script>
      "use strict";

      // Only the leading 36 symbols occur by chance; the space and punctuation after them come
      // exclusively from dictionary sentences and typing
      const CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ ,.!?-:;";
      const NUM_CHARS = CHARS.length;
      const NUM_VISIBLE = 36;
      const GRID = 61;
      const CELLS = GRID * GRID;
      const CENTER = (GRID - 1) >> 1;
      const CENTER_IDX = CENTER * GRID + CENTER;
      const ATLAS_COLS = Math.ceil(Math.sqrt(NUM_CHARS));

      const FONT_WEIGHT = 900;
      const TILE_GAP = 1;
      const GUTTER_RATIO = 0.12;
      const UV_INSET = 0.94;
      const CYCLE_MS = 5400;
      const MAX_DPR = 2;
      const WHEEL_ZOOM_RATE = 0.0018;
      const PINCH_WHEEL_RATE = 0.01;
      const TRANSITION_MS = 220;
      const MOSAIC_MUTATION_RATE = 0.03;
      const TILE_MUTATION_RATE = 0.028;
      const AUTOPLAY_RESUME_MS = 2000;
      const TYPE_TAU_S = 0.12;
      const TYPE_MIN_SPEED = 3;
      const TYPE_MAX_SPEED = 40;
      const TYPE_MAX_LEAD = 40;
      const TYPE_PAN_TAU_S = 0.08;
      const INK_EASE_S = 0.06;
      const MAX_INSTANCES = 400000;
      const FLOATS_PER_INSTANCE = 6;
      const MIN_ALPHA = 0.005;
      const STALE_FRAMES = 120;
      const PRUNE_EVERY = 60;

      let spriteRes = 256;
      let spriteMargin = spriteRes / 16;

      const VERTEX_SHADER = `#version 300 es
        layout(location = 0) in vec2 a_quad;
        layout(location = 1) in vec2 a_pos;
        layout(location = 2) in float a_cellSize;
        layout(location = 3) in float a_char;
        layout(location = 4) in vec2 a_radiance;

        uniform vec2 u_resolution;
        uniform float u_atlasCols;
        uniform float u_fill;

        out vec2 v_uv;
        out float v_cellPx;
        out vec2 v_radiance;

        void main() {
          vec2 pixelPos = a_pos + a_quad * (a_cellSize * u_fill);
          vec2 clip = (pixelPos / u_resolution) * 2.0 - 1.0;
          gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);

          vec2 uvLocal = (a_quad + 0.5) * ${UV_INSET} + ${(1 - UV_INSET) / 2};
          vec2 spriteCell = vec2(mod(a_char, u_atlasCols), floor(a_char / u_atlasCols));
          v_uv = (spriteCell + uvLocal) / u_atlasCols;
          v_cellPx = a_cellSize;
          v_radiance = a_radiance;
        }`;

      const FRAGMENT_SHADER = `#version 300 es
        precision highp float;

        in vec2 v_uv;
        in float v_cellPx;
        in vec2 v_radiance;

        uniform sampler2D u_atlas;

        out vec4 outColor;

        void main() {
          float texVal = texture(u_atlas, v_uv).r;

          float sizeT = clamp((v_cellPx - 4.0) / 24.0, 0.0, 1.0);
          float softMask = smoothstep(mix(0.05, 0.18, sizeT), mix(0.42, 0.72, sizeT), texVal);

          // 0.607 = 0.5^0.72: the true 50% coverage edge after the atlas contrast curve
          float aa = max(fwidth(texVal), 1e-4);
          float crispMask = clamp((texVal - 0.607) / aa + 0.5, 0.0, 1.0);
          float glyphMask = mix(softMask, crispMask, smoothstep(10.0, 24.0, v_cellPx));

          float microBoost = 1.0 - smoothstep(2.2, 7.5, v_cellPx);
          float mask = mix(glyphMask, max(glyphMask, 0.88), microBoost);

          float alpha = mask * v_radiance.y;
          float lum = v_radiance.x * alpha;
          outColor = vec4(lum, lum, lum, alpha);
        }`;

      class GlyphRenderer {
        constructor(gl) {
          this.gl = gl;
          if (gl.getParameter(gl.MAX_TEXTURE_SIZE) < ATLAS_COLS * spriteRes) {
            spriteRes = 128;
            spriteMargin = spriteRes / 16;
          }
          this.instances = new Float32Array(MAX_INSTANCES * FLOATS_PER_INSTANCE);
          this.count = 0;
          this.#initProgram();
          this.#initBuffers();
        }

        #initProgram() {
          const { gl } = this;
          const program = (this.program = gl.createProgram());
          gl.attachShader(program, compileShader(gl, gl.VERTEX_SHADER, VERTEX_SHADER));
          gl.attachShader(program, compileShader(gl, gl.FRAGMENT_SHADER, FRAGMENT_SHADER));
          gl.linkProgram(program);
          gl.useProgram(program);

          this.uResolution = gl.getUniformLocation(program, "u_resolution");
          gl.uniform1f(gl.getUniformLocation(program, "u_atlasCols"), ATLAS_COLS);
          gl.uniform1f(gl.getUniformLocation(program, "u_fill"), 1 - GUTTER_RATIO);
        }

        #initBuffers() {
          const { gl } = this;
          gl.bindVertexArray((this.vao = gl.createVertexArray()));

          gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.5, -0.5, 0.5, -0.5, -0.5, 0.5, -0.5, 0.5, 0.5, -0.5, 0.5, 0.5]), gl.STATIC_DRAW);
          gl.enableVertexAttribArray(0);
          gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

          gl.bindBuffer(gl.ARRAY_BUFFER, (this.instanceVBO = gl.createBuffer()));
          gl.bufferData(gl.ARRAY_BUFFER, this.instances.byteLength, gl.DYNAMIC_DRAW);

          const stride = FLOATS_PER_INSTANCE * 4;
          const attributes = [
            [1, 2, 0],
            [2, 1, 8],
            [3, 1, 12],
            [4, 2, 16],
          ];
          for (const [location, size, offset] of attributes) {
            gl.enableVertexAttribArray(location);
            gl.vertexAttribPointer(location, size, gl.FLOAT, false, stride, offset);
            gl.vertexAttribDivisor(location, 1);
          }

          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        }

        buildAtlasAndBitmaps() {
          const atlas = rasterizeAtlas();
          const size = atlas.width;
          const rgba = atlas.getContext("2d").getImageData(0, 0, size, size).data;
          const level0 = new Uint8Array(size * size).map((_, i) => Math.min(255, Math.round((rgba[i * 4] / 255) ** 0.72 * 255)));
          uploadMipmappedTexture(this.gl, level0, size);
          return extractTileBitmaps(atlas);
        }

        setViewport(width, height, dpr) {
          const { gl } = this;
          gl.canvas.width = Math.round(width * dpr);
          gl.canvas.height = Math.round(height * dpr);
          gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
          gl.useProgram(this.program);
          gl.uniform2f(this.uResolution, width, height);
        }

        beginFrame() {
          this.count = 0;
        }

        emit(charIdx, ink, x, y, cellPx, alpha) {
          if (this.count >= MAX_INSTANCES || alpha <= MIN_ALPHA) return;
          const lum = 0.34 + 0.66 * clamp01(ink) ** 0.55;
          this.instances.set([x, y, cellPx, charIdx, lum, alpha], this.count++ * FLOATS_PER_INSTANCE);
        }

        flush() {
          const { gl } = this;
          gl.clearColor(0.02, 0.02, 0.025, 1);
          gl.clear(gl.COLOR_BUFFER_BIT);
          if (!this.count) return;

          gl.bindVertexArray(this.vao);
          gl.bindBuffer(gl.ARRAY_BUFFER, this.instanceVBO);
          gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.instances.subarray(0, this.count * FLOATS_PER_INSTANCE));
          gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, this.count);
        }
      }

      // The world is an infinite, lazily materialized tree of tiles. The "spine" is one chain
      // of nodes whose letters follow charAt(level): the self-similar sequence typing writes into.
      class FractalWorld {
        constructor(bitmaps) {
          this.bitmaps = bitmaps;
          this.levelIndex = 0;
          this.clock = 0;
          this.frameNo = 0;
          this.overrides = new Map();
          this.anchor = null;
          this.root = this.#node(null, CENTER_IDX, 1, true);
          this.inks = [1, 2, 3].map((level) => Float32Array.from(bitmaps[this.charAt(level)]));
        }

        #node(parent, idx, level, spine) {
          return {
            parent,
            idx,
            level,
            spine,
            spineKid: spine ? CENTER_IDX : -1,
            kidChars: null,
            kidPrev: null,
            kidT: null,
            kids: new Map(),
            seen: this.frameNo,
          };
        }

        chars(n) {
          if (!n.kidChars) {
            n.kidChars = Uint8Array.from({ length: CELLS }, randomChar);
            n.kidPrev = n.kidChars.slice();
            n.kidT = new Float64Array(CELLS).fill(-Infinity);
          }
          return n.kidChars;
        }

        parentOf(n) {
          if (!n.parent) {
            const p = this.#node(null, CENTER_IDX, n.level + 1, n.spine);
            n.idx = CENTER_IDX;
            p.kids.set(n.idx, n);
            n.parent = p;
          }
          n.parent.seen = this.frameNo;
          return n.parent;
        }

        kid(p, i) {
          let k = p.kids.get(i);
          if (!k) p.kids.set(i, (k = this.#node(p, i, p.level - 1, p.spineKid === i)));
          k.seen = this.frameNo;
          return k;
        }

        neighbor(n, dx, dy) {
          if (!dx && !dy) {
            n.seen = this.frameNo;
            return n;
          }
          const [col, row] = cellOf(n.idx);
          const r = row + dy;
          const c = col + dx;
          const pr = Math.floor(r / GRID);
          const pc = Math.floor(c / GRID);
          const q = this.neighbor(this.parentOf(n), pc, pr);
          return this.kid(q, (r - pr * GRID) * GRID + (c - pc * GRID));
        }

        kidChar(p, i) {
          return i === p.spineKid ? this.charAt(p.level - 1) : this.chars(p)[i];
        }

        kidMix(p, i) {
          this.chars(p);
          return i === p.spineKid ? 1 : Math.min(1, (this.clock - p.kidT[i]) / TRANSITION_MS);
        }

        mutate(p, i) {
          if (i === p.spineKid) return;
          const chars = this.chars(p);
          p.kidPrev[i] = chars[i];
          chars[i] = randomChar();
          p.kidT[i] = this.clock;
        }

        inkOf(n) {
          const offset = n.level - this.levelIndex;
          return n.spine && offset >= 1 && offset <= 3 ? this.inks[offset - 1] : this.bitmaps[this.kidChar(this.parentOf(n), n.idx)];
        }

        charAt(level) {
          const typed = this.overrides.get(level);
          if (typed !== undefined) return typed;
          const { anchor } = this;
          const base = anchor && level > anchor.level ? anchor.charIdx - anchor.level : 0;
          return mod(level + base, NUM_VISIBLE);
        }

        setLevelChar(level, charIdx) {
          this.overrides.set(level, charIdx);
          this.anchor = { level, charIdx };
        }

        // Reroutes the spine through `focus` without changing any visible letter
        respine(focus) {
          if (focus.spine) return;
          const path = [];
          let n = focus;
          while (!n.spine && n.parent) {
            path.push(n);
            n = n.parent;
          }
          if (!n.spine) path.push(n);

          const freeze = (p) => {
            const k = p.spineKid;
            if (k < 0) return null;
            this.chars(p)[k] = this.charAt(p.level - 1);
            p.spineKid = -1;
            const old = p.kids.get(k);
            if (old) old.spine = false;
            return old;
          };
          if (n.spine) {
            for (let old = freeze(n); old; old = freeze(old));
            n.spineKid = path.at(-1).idx;
          }

          for (let i = path.length - 1; i >= 0; i--) {
            const node = path[i];
            node.spine = true;
            if (node.parent) this.overrides.set(node.level, this.chars(node.parent)[node.idx]);
            if (i > 0) node.spineKid = path[i - 1].idx;
          }
          for (let d = focus; ; ) {
            d.spineKid = CENTER_IDX;
            if (d.kidChars) this.overrides.set(d.level - 1, d.kidChars[CENTER_IDX]);
            const k = d.kids.get(CENTER_IDX);
            if (!k) break;
            k.spine = true;
            d = k;
          }
          this.inks.forEach((ink, j) => ink.set(this.#targetInk(j)));
        }

        prune(focus) {
          const stale = this.frameNo - STALE_FRAMES;
          const chain = new Set();
          let n = focus;
          for (let p; chain.add(n), (p = n.parent); n = p) {
            if (n.level >= this.levelIndex + 5 && p.seen < stale) {
              p.kids.delete(n.idx);
              n.parent = null;
              n.idx = CENTER_IDX;
              break;
            }
          }
          const sweep = (node) => {
            for (const [i, k] of node.kids) k.seen < stale && !chain.has(k) ? node.kids.delete(i) : sweep(k);
          };
          sweep(n);
        }

        advanceLevel() {
          const [a, b, c] = this.inks;
          this.levelIndex++;
          a.set(b);
          b.set(c);
          c.set(this.#targetInk(2));
        }

        retreatLevel() {
          const [a, b, c] = this.inks;
          this.levelIndex--;
          c.set(b);
          b.set(a);
          a.set(this.#targetInk(0));
        }

        update(dtMs) {
          this.clock += dtMs;
          this.frameNo++;
          const k = 1 - Math.exp(-dtMs / 1000 / INK_EASE_S);
          this.inks.forEach((ink, j) => {
            const target = this.#targetInk(j);
            for (let i = 0; i < CELLS; i++) ink[i] += (target[i] - ink[i]) * k;
          });
        }

        #targetInk(j) {
          return this.bitmaps[this.charAt(this.levelIndex + 1 + j)];
        }
      }

      class FractalCamera {
        width = 1;
        height = 1;
        centerX = 0.5;
        centerY = 0.5;
        baseGridPx = 1;
        macroTilePx = 1;
        lodScale = 1;

        setViewport(width, height) {
          Object.assign(this, { width, height, centerX: width / 2, centerY: height / 2 });
          this.baseGridPx = Math.min(width, height) * 0.94;
          const maxMosaicTiles = (MAX_INSTANCES * 0.75) / CELLS;
          this.mosaicMinPx = Math.max(30, Math.sqrt((width * height) / maxMosaicTiles) * 1.15);
        }

        updateProgress(progress) {
          this.macroTilePx = this.baseGridPx * GRID ** -progress;
        }

        isVisible(x, y, sizePx) {
          const half = sizePx * 0.55;
          return x + half >= 0 && x - half <= this.width && y + half >= 0 && y - half <= this.height;
        }

        // Complementary crossfade: mosaic + solid parent glyph always sum to 1
        mosaicAlpha(tilePx) {
          const minPx = this.mosaicMinPx * this.lodScale;
          return smoothstep(minPx, minPx * 2.2, tilePx);
        }
      }

      class FractalApp {
        constructor(canvas) {
          this.canvas = canvas;
          const gl = canvas.getContext("webgl2", { alpha: false, antialias: true, powerPreference: "high-performance" });
          if (!gl) throw new Error("WebGL2 is required.");

          this.renderer = new GlyphRenderer(gl);
          this.world = new FractalWorld(this.renderer.buildAtlasAndBitmaps());
          this.camera = new FractalCamera();

          this.elapsedMs = 0;
          // Pan is in macro-tile units, relative to the focus tile's center; |pan| <= 0.5
          this.focus = this.world.root;
          this.panX = 0;
          this.panY = 0;
          this.pointers = new Map();
          this.targetLevel = null;
          this.zoomSpeed = 0;
          this.resumeAutoplayAt = 0;
          this.lastFrameTime = performance.now();

          // Highest spine level already written from the dictionary stream
          this.dictionary = new SentenceStream("dictionary.json");
          this.writtenLevel = -Infinity;
          // Spine node the current dictionary sentence starts from, when not the focus
          this.sequenceNode = null;
          // Cells ([owner, index] into owner's chars) held still until the zoom center moves to other cells
          this.frozen = [];

          this.#bindPointer();
          this.#bindKeys();
          window.addEventListener("resize", () => this.#resize());
          this.#resize();
        }

        start() {
          this.lastFrameTime = performance.now();
          requestAnimationFrame((now) => this.frame(now));
        }

        frame(now) {
          const dt = Math.min(100, now - this.lastFrameTime);
          this.lastFrameTime = now;
          const { world, camera } = this;
          const typing = this.targetLevel !== null;

          if (typing) this.#stepTyping(dt);
          else if (!this.pointers.size && now >= this.resumeAutoplayAt) this.#advanceTime(dt);

          const lodTarget = typing ? 1 + Math.min(1.5, this.zoomSpeed * 0.12) : 1;
          camera.lodScale += (lodTarget - camera.lodScale) * (1 - Math.exp(-dt / 80));
          camera.updateProgress(this.elapsedMs / CYCLE_MS);

          world.update(dt);
          if (world.frameNo % PRUNE_EVERY === 0) world.prune(this.focus);

          this.renderer.beginFrame();
          this.#renderScene();
          this.renderer.flush();
          requestAnimationFrame((now) => this.frame(now));
        }

        #renderScene() {
          const { camera, focus } = this;
          const { macroTilePx } = camera;
          const superTilePx = macroTilePx * GRID;
          const superTile = this.world.parentOf(focus);
          const [col, row] = cellOf(focus.idx);
          const originX = camera.centerX + (this.panX - (col - CENTER)) * macroTilePx;
          const originY = camera.centerY + (this.panY - (row - CENTER)) * macroTilePx;
          const kx = Math.ceil(camera.width / superTilePx) + 1;
          const ky = Math.ceil(camera.height / superTilePx) + 1;

          for (let dy = -ky; dy <= ky; dy++) {
            for (let dx = -kx; dx <= kx; dx++) {
              const x = originX + dx * superTilePx;
              const y = originY + dy * superTilePx;
              if (camera.isVisible(x, y, superTilePx)) this.#renderSuperTile(this.world.neighbor(superTile, dx, dy), x, y, macroTilePx);
            }
          }
        }

        #renderSuperTile(s, cx, cy, tilePx) {
          const { world, camera } = this;
          const parent = world.parentOf(s);
          if (Math.random() < TILE_MUTATION_RATE && !this.#isFrozen(parent, s.idx)) world.mutate(parent, s.idx);

          const ink = world.inkOf(s);
          const mix = world.kidMix(parent, s.idx);
          const prevChar = parent.kidPrev[s.idx];
          const prevInk = mix < 1 && prevChar !== world.kidChar(parent, s.idx) ? world.bitmaps[prevChar] : null;
          const m = ease(mix);
          const margin = tilePx * 0.55;

          for (let r = 0; r < GRID; r++) {
            const y = cy + (r - CENTER) * tilePx;
            if (y + margin < 0 || y - margin > camera.height) continue;

            for (let c = 0; c < GRID; c++) {
              const x = cx + (c - CENTER) * tilePx;
              if (x + margin < 0 || x - margin > camera.width) continue;

              const idx = r * GRID + c;
              if (Math.random() < TILE_MUTATION_RATE && !this.#isFrozen(s, idx)) world.mutate(s, idx);
              const parentInk = prevInk ? lerp(prevInk[idx], ink[idx], m) : ink[idx];
              this.#renderTile(s, idx, parentInk, x, y, tilePx);
            }
          }
        }

        // A tile is BOTH a 61x61 mosaic of sub-characters AND a single coalescing parent character
        #renderTile(p, i, parentInk, x, y, tilePx) {
          const { world, camera, renderer } = this;
          if (!camera.isVisible(x, y, tilePx)) return;

          const charIdx = world.kidChar(p, i);
          const mix = world.kidMix(p, i);
          const prevChar = p.kidPrev[i];
          const blending = mix < 1 && prevChar !== charIdx;
          const m = blending ? ease(mix) : 1;
          const mosaicAlpha = camera.mosaicAlpha(tilePx);
          const solidAlpha = 1 - mosaicAlpha;

          if (mosaicAlpha > MIN_ALPHA) {
            const tile = world.kid(p, i);
            const cellPx = tilePx / GRID;
            const bitmap = tile.spine ? world.inkOf(tile) : world.bitmaps[charIdx];
            const prevBitmap = blending ? world.bitmaps[prevChar] : null;
            const subChars = world.chars(tile);
            const inkScale = 1 - solidAlpha + (0.22 + 0.78 * parentInk) * solidAlpha;

            for (let sr = 0; sr < GRID; sr++) {
              const sy = y + (sr - CENTER) * cellPx;
              if (sy + cellPx < 0 || sy - cellPx > camera.height) continue;

              for (let sc = 0; sc < GRID; sc++) {
                const sx = x + (sc - CENTER) * cellPx;
                if (sx + cellPx < 0 || sx - cellPx > camera.width) continue;

                const idx = sr * GRID + sc;
                const ink = prevBitmap ? lerp(prevBitmap[idx], bitmap[idx], m) : bitmap[idx];
                let subChar;
                if (idx === tile.spineKid) subChar = world.charAt(tile.level - 1);
                else {
                  if (Math.random() < MOSAIC_MUTATION_RATE && !this.#isFrozen(tile, idx)) subChars[idx] = randomChar();
                  subChar = subChars[idx];
                }
                renderer.emit(subChar, ink * inkScale, sx, sy, cellPx, mosaicAlpha);
              }
            }
          }

          if (solidAlpha > MIN_ALPHA) {
            const parentPx = parentCellSize(tilePx);
            if (blending) renderer.emit(prevChar, parentInk, x, y, parentPx, solidAlpha * (1 - m));
            renderer.emit(charIdx, parentInk, x, y, parentPx, solidAlpha * m);
          }
        }

        #bindPointer() {
          const { canvas, pointers } = this;
          const local = ({ clientX, clientY }) => {
            const { left, top } = canvas.getBoundingClientRect();
            return { x: clientX - left, y: clientY - top };
          };
          const gesture = () => {
            const [p, q] = pointers.values();
            return { dist: Math.hypot(p.x - q.x, p.y - q.y), mx: (p.x + q.x) / 2, my: (p.y + q.y) / 2 };
          };
          let last = null;

          canvas.addEventListener("pointerdown", (e) => {
            this.targetLevel = null;
            canvas.setPointerCapture(e.pointerId);
            pointers.set(e.pointerId, local(e));
            last = pointers.size === 2 ? gesture() : null;
            canvas.classList.add("dragging");
            this.#pauseAutoplay();
          });

          canvas.addEventListener("pointermove", (e) => {
            const prev = pointers.get(e.pointerId);
            if (!prev) return;
            const cur = local(e);
            pointers.set(e.pointerId, cur);
            this.#pauseAutoplay();

            if (pointers.size === 1) this.#panByPixels(cur.x - prev.x, cur.y - prev.y);
            else if (pointers.size === 2) {
              const g = gesture();
              if (last?.dist > 0 && g.dist > 0) {
                this.#panByPixels(g.mx - last.mx, g.my - last.my);
                this.#zoomBy(g.dist / last.dist, g.mx, g.my);
              }
              last = g;
            }
          });

          const end = (e) => {
            pointers.delete(e.pointerId);
            last = pointers.size === 2 ? gesture() : null;
            if (!pointers.size) canvas.classList.remove("dragging");
            this.#pauseAutoplay();
          };
          canvas.addEventListener("pointerup", end);
          canvas.addEventListener("pointercancel", end);

          canvas.addEventListener(
            "wheel",
            (e) => {
              e.preventDefault();
              this.targetLevel = null;
              const unit = [1, 16, this.camera.height][e.deltaMode] ?? 1;
              const rate = e.ctrlKey ? PINCH_WHEEL_RATE : WHEEL_ZOOM_RATE;
              const { x, y } = local(e);
              this.#zoomBy(Math.exp(-e.deltaY * unit * rate), x, y);
              this.#pauseAutoplay();
            },
            { passive: false },
          );
        }

        #bindKeys() {
          window.addEventListener("keydown", (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
            const ch = e.key.toUpperCase();
            const charIdx = ch.length === 1 ? CHARS.indexOf(ch) : -1;
            if (charIdx >= 0) this.#typeChar(charIdx);
            else if (e.key === "Enter") this.#stepSequence();
          });
        }

        #resize() {
          const { innerWidth: w, innerHeight: h, devicePixelRatio } = window;
          this.camera.setViewport(w, h);
          this.renderer.setViewport(w, h, Math.min(devicePixelRatio || 1, MAX_DPR));
        }

        #pauseAutoplay() {
          this.resumeAutoplayAt = performance.now() + AUTOPLAY_RESUME_MS;
        }

        get #levelPosition() {
          return this.world.levelIndex + this.elapsedMs / CYCLE_MS;
        }

        // Each key queues one more level of zoom-out and pins the letter shown there
        #typeChar(charIdx) {
          const { world } = this;
          world.respine(this.focus);
          this.sequenceNode = null;
          const next = (this.targetLevel ?? world.levelIndex) + 1;
          if (next - this.#levelPosition > TYPE_MAX_LEAD) return;
          this.targetLevel = next;
          world.setLevelChar(next + 1, charIdx);

          // The typed key seeds the dictionary sentence starting with it; zooming out continues it
          if (this.dictionary.seed(charIdx)) this.writtenLevel = next + 1;
          else this.#abortDictionary();
          this.#logSequence(`typed ${JSON.stringify(CHARS[charIdx])}`);
          this.#pauseAutoplay();
        }

        // Zooms out one level, revealing the next dictionary letter (starting a sentence if none is running)
        #stepSequence() {
          const next = (this.targetLevel ?? this.world.levelIndex) + 1;
          if (next - this.#levelPosition > TYPE_MAX_LEAD) return;
          this.#feedDictionary(next + 1);
          this.targetLevel = next;
          this.#pauseAutoplay();
        }

        #stepTyping(dtMs) {
          const sec = dtMs / 1000;
          const remaining = this.targetLevel - this.#levelPosition;
          const speed = (this.zoomSpeed = clamp(remaining / TYPE_TAU_S, TYPE_MIN_SPEED, TYPE_MAX_SPEED));

          if (speed * sec >= remaining) {
            // Epsilon so float error can't leave us just short of the boundary
            this.#advanceTime((this.targetLevel - this.world.levelIndex) * CYCLE_MS - this.elapsedMs + 1e-6);
            this.targetLevel = null;
            this.zoomSpeed = 0;
            this.#pauseAutoplay();
          } else this.#advanceTime(speed * sec * CYCLE_MS);

          const decay = Math.exp(-sec / TYPE_PAN_TAU_S);
          this.panX *= decay;
          this.panY *= decay;
        }

        #normalizePan() {
          const dx = Math.round(-this.panX);
          const dy = Math.round(-this.panY);
          if (!dx && !dy) return;
          this.focus = this.world.neighbor(this.focus, dx, dy);
          this.panX += dx;
          this.panY += dy;
        }

        #panByPixels(dx, dy) {
          this.panX += dx / this.camera.macroTilePx;
          this.panY += dy / this.camera.macroTilePx;
          this.#normalizePan();
        }

        // Writes dictionary symbols into consecutive spine levels up to `upTo`. Zooming out always
        // continues the current sentence; only a zoom-in fill (or a typed key) starts another.
        #feedDictionary(upTo) {
          const { world, dictionary } = this;
          const first = world.levelIndex + 2;
          if (this.writtenLevel < first - 1) this.writtenLevel = first - 1;
          if (this.writtenLevel >= upTo || !dictionary.ready) return;

          world.respine(this.sequenceNode ?? this.focus);
          const fresh = !dictionary.status;
          let written = "";
          while (this.writtenLevel < upTo) {
            const sym = dictionary.next();
            world.setLevelChar(++this.writtenLevel, sym);
            written += CHARS[sym];
          }
          this.#logSequence(`${fresh ? "started, " : ""}wrote ${JSON.stringify(written)}`);
        }

        // The user left the displayed sentence: drop it so the next one is drawn fresh
        #abortDictionary() {
          this.dictionary.abort();
          this.writtenLevel = -Infinity;
          this.sequenceNode = null;
          this.#logSequence("aborted");
        }

        #logSequence(event) {
          const { sentence, pos } = this.dictionary.status ?? {};
          console.log(`[sequence] ${event}`, { sentence, pos, writtenLevel: this.writtenLevel, levelIndex: this.world.levelIndex });
        }

        // The zoom-center character has grown to fill the viewport: it starts a new sentence
        #restartDictionaryAt(sx, sy) {
          const { world, camera, dictionary } = this;
          const superTilePx = camera.macroTilePx * GRID;
          const [col, row] = cellOf(this.focus.idx);
          const originX = camera.centerX + (this.panX - (col - CENTER)) * camera.macroTilePx;
          const originY = camera.centerY + (this.panY - (row - CENTER)) * camera.macroTilePx;
          const cell = world.neighbor(world.parentOf(this.focus), Math.round((sx - originX) / superTilePx), Math.round((sy - originY) / superTilePx));
          const charIdx = world.kidChar(world.parentOf(cell), cell.idx);
          if (!dictionary.seed(charIdx)) return this.#abortDictionary();
          world.respine(cell);
          this.sequenceNode = cell;
          this.writtenLevel = cell.level;
          this.#logSequence(`restarted at fill from ${JSON.stringify(CHARS[charIdx])}`);
        }

        // Pins the characters under (sx, sy): the macro tile there and the mosaic letter inside it
        #freezeAt(sx, sy) {
          const { world, camera, focus } = this;
          const ux = (sx - camera.centerX) / camera.macroTilePx - this.panX;
          const uy = (sy - camera.centerY) / camera.macroTilePx - this.panY;
          const dx = Math.round(ux);
          const dy = Math.round(uy);
          const tile = world.neighbor(focus, dx, dy);
          const sub = (u) => clamp(CENTER + Math.round(u * GRID), 0, GRID - 1);
          this.frozen = [
            [world.parentOf(tile), tile.idx],
            [tile, sub(uy - dy) * GRID + sub(ux - dx)],
          ];
        }

        #isFrozen(owner, i) {
          return this.frozen.some(([o, j]) => o === owner && j === i);
        }

        // Keeps the world point under (sx, sy) fixed while zooming by `scale` (>1 = in)
        #zoomBy(scale, sx, sy) {
          const { camera } = this;
          if (scale < 1) this.#feedDictionary(Math.floor(this.#levelPosition - Math.log(scale) / Math.log(GRID)) + 3);
          const level = this.world.levelIndex;
          const ax = sx - camera.centerX;
          const ay = sy - camera.centerY;
          this.#advanceTime((-Math.log(scale) / Math.log(GRID)) * CYCLE_MS);
          this.panX += (ax * (1 - scale)) / camera.macroTilePx;
          this.panY += (ay * (1 - scale)) / camera.macroTilePx;
          this.#normalizePan();
          this.#freezeAt(sx, sy);
          if (scale > 1 && this.world.levelIndex < level) this.#restartDictionaryAt(sx, sy);
        }

        #advanceTime(deltaMs) {
          const { world } = this;
          this.elapsedMs += deltaMs;
          while (this.elapsedMs >= CYCLE_MS) {
            this.elapsedMs -= CYCLE_MS;
            world.advanceLevel();
            const [col, row] = cellOf(this.focus.idx);
            this.panX = (this.panX - (col - CENTER)) / GRID;
            this.panY = (this.panY - (row - CENTER)) / GRID;
            this.focus = world.parentOf(this.focus);
          }
          while (this.elapsedMs < 0) {
            this.elapsedMs += CYCLE_MS;
            world.retreatLevel();
            const c = clamp(CENTER + Math.round(-this.panX * GRID), 0, GRID - 1);
            const r = clamp(CENTER + Math.round(-this.panY * GRID), 0, GRID - 1);
            this.panX = this.panX * GRID + (c - CENTER);
            this.panY = this.panY * GRID + (r - CENTER);
            this.focus = world.kid(this.focus, r * GRID + c);
          }
          this.camera.updateProgress(this.elapsedMs / CYCLE_MS);
          this.#normalizePan();
        }
      }

      // Endless supply of CHARS symbols read from a { initial: sentence } dictionary. Apostrophes
      // vanish, other unsupported characters become spaces, and runs of spaces collapse to one. Knows nothing about the world or camera.
      class SentenceStream {
        #sentences = [];
        #byInitial = new Map();
        #current = null;
        #pos = 0;
        #last = -1;

        constructor(url) {
          fetch(url)
            .then((res) => res.json())
            .then((dict) => {
              const toSymbols = (text) => [...text.toUpperCase().replace(/['’]/g, "").replace(/[–—]/g, "-").replace(/[^0-9A-Z,.!?:;-]+/g, " ").trim()].map((ch) => CHARS.indexOf(ch));
              this.#sentences = Object.values(dict).map(toSymbols).filter((s) => s.length);
              this.#byInitial = new Map(this.#sentences.map((s, i) => [s[0], i]));
            })
            .catch(() => {});
        }

        get ready() {
          return this.#sentences.length > 0;
        }

        // Current sentence and how many symbols have been consumed, or null between sentences
        get status() {
          return this.#current && { sentence: this.#current.map((c) => CHARS[c]).join(""), pos: this.#pos };
        }

        // Forget the current sentence; the next symbol comes from a fresh random one
        abort() {
          this.#current = null;
        }

        // Continue with the sentence starting with `symbol` (already consumed); false if none
        seed(symbol) {
          const i = this.#byInitial.get(symbol);
          if (i === undefined) return false;
          this.#start(i);
          this.#pos = 1;
          return true;
        }

        next() {
          if (!this.#current || this.#pos >= this.#current.length) {
            let i;
            do i = (Math.random() * this.#sentences.length) | 0;
            while (i === this.#last && this.#sentences.length > 1);
            this.#start(i);
          }
          return this.#current[this.#pos++];
        }

        #start(i) {
          this.#last = i;
          this.#current = this.#sentences[i];
          this.#pos = 0;
        }
      }

      document.fonts.load('400 100px "Roboto Flex"').then(() => new FractalApp(document.getElementById("viewport")).start());

      function rasterizeAtlas() {
        const S = spriteRes;
        const size = ATLAS_COLS * S;
        const canvas = Object.assign(document.createElement("canvas"), { width: size, height: size });
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, size, size);

        // One scale for all glyphs keeps true proportions and a shared baseline
        const refPx = 100;
        ctx.font = `${FONT_WEIGHT} ${refPx}px "Roboto Flex", sans-serif`;
        const metrics = [...CHARS].map((ch) => ctx.measureText(ch));
        const maxW = Math.max(...metrics.map((m) => m.actualBoundingBoxLeft + m.actualBoundingBoxRight));
        const maxAsc = Math.max(...metrics.map((m) => m.actualBoundingBoxAscent));
        const maxDesc = Math.max(...metrics.map((m) => m.actualBoundingBoxDescent));
        const k = (S - spriteMargin * 2) / Math.max(maxW, maxAsc + maxDesc);

        ctx.font = `${FONT_WEIGHT} ${refPx * k}px "Roboto Flex", sans-serif`;
        ctx.fillStyle = "#fff";
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        metrics.forEach((m, c) => {
          const [ox, oy] = spriteOrigin(c);
          ctx.save();
          ctx.beginPath();
          ctx.rect(ox, oy, S, S);
          ctx.clip();
          const gx = ox + S / 2 - ((m.actualBoundingBoxRight - m.actualBoundingBoxLeft) * k) / 2;
          const gy = oy + S / 2 + ((maxAsc - maxDesc) * k) / 2;
          if (CHARS[c] === " ") return ctx.restore();
          ctx.fillText(CHARS[c], gx, gy);
          if (CHARS[c] === "0") {
            // Slashed zero, so it reads differently from O
            const w = (m.actualBoundingBoxLeft + m.actualBoundingBoxRight) * k;
            const h = (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) * k;
            const x0 = gx - m.actualBoundingBoxLeft * k;
            const y0 = gy - m.actualBoundingBoxAscent * k;
            // Clipped to the ellipse inscribed in the glyph box so the slash never leaves the 0
            ctx.beginPath();
            ctx.ellipse(x0 + w / 2, y0 + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
            ctx.clip();
            ctx.lineWidth = w * 0.14;
            ctx.strokeStyle = "#fff";
            ctx.beginPath();
            ctx.moveTo(x0 + w * 0.22, y0 + h * 0.8);
            ctx.lineTo(x0 + w * 0.78, y0 + h * 0.2);
            ctx.stroke();
          }
          ctx.restore();
        });
        return canvas;
      }

      function uploadMipmappedTexture(gl, level0, size) {
        gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

        const maxLevels = Math.log2(spriteRes) + 1;
        let level = 0;
        for (let w = size, data = level0; level < maxLevels && w >= 1; level++) {
          gl.texImage2D(gl.TEXTURE_2D, level, gl.R8, w, w, 0, gl.RED, gl.UNSIGNED_BYTE, data);
          if (w === 1) {
            level++;
            break;
          }
          [data, w] = boxDownsample(data, w);
        }

        const params = [
          [gl.TEXTURE_BASE_LEVEL, 0],
          [gl.TEXTURE_MAX_LEVEL, level - 1],
          [gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR],
          [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
          [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE],
          [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE],
        ];
        for (const [key, value] of params) gl.texParameteri(gl.TEXTURE_2D, key, value);
      }

      // True box filter preserves coverage so thresholding any mip level reproduces the outline
      function boxDownsample(data, w) {
        const next = Math.max(1, w >> 1);
        const out = new Uint8Array(next * next);
        for (let y = 0; y < next; y++) {
          const y0 = Math.min(w - 1, y * 2) * w;
          const y1 = Math.min(w - 1, y * 2 + 1) * w;
          for (let x = 0; x < next; x++) {
            const x0 = Math.min(w - 1, x * 2);
            const x1 = Math.min(w - 1, x * 2 + 1);
            out[y * next + x] = (data[y0 + x0] + data[y0 + x1] + data[y1 + x0] + data[y1 + x1] + 2) >> 2;
          }
        }
        return [out, next];
      }

      function extractTileBitmaps(atlas) {
        const S = spriteRes;
        const inner = S - spriteMargin * 2;
        const canvas = Object.assign(document.createElement("canvas"), { width: GRID, height: GRID });
        const ctx = canvas.getContext("2d", { willReadFrequently: true });

        return [...CHARS].map((_, c) => {
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, GRID, GRID);
          const [ox, oy] = spriteOrigin(c);
          ctx.drawImage(atlas, ox + spriteMargin, oy + spriteMargin, inner, inner, TILE_GAP, TILE_GAP, GRID - TILE_GAP * 2, GRID - TILE_GAP * 2);
          const data = ctx.getImageData(0, 0, GRID, GRID).data;
          return Float32Array.from({ length: CELLS }, (_, i) => {
            const [col, row] = cellOf(i);
            const inBorder = row < TILE_GAP || row >= GRID - TILE_GAP || col < TILE_GAP || col >= GRID - TILE_GAP;
            return !inBorder && data[i * 4] >= 127.5 ? 1 : 0;
          });
        });
      }

      // Sizes a parent glyph so its ink box lands exactly on the mosaic letter it replaces
      function parentCellSize(tilePx) {
        const inkFracOfQuad = (spriteRes - spriteMargin * 2) / spriteRes / UV_INSET;
        const mosaicInkFrac = (GRID - TILE_GAP * 2) / GRID;
        return (tilePx * mosaicInkFrac) / (inkFracOfQuad * (1 - GUTTER_RATIO));
      }

      function compileShader(gl, type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
        return shader;
      }

      function spriteOrigin(c) {
        return [(c % ATLAS_COLS) * spriteRes, Math.floor(c / ATLAS_COLS) * spriteRes];
      }

      function cellOf(idx) {
        return [idx % GRID, (idx / GRID) | 0];
      }

      function randomChar() {
        return (Math.random() * NUM_VISIBLE) | 0;
      }

      function mod(a, n) {
        return ((a % n) + n) % n;
      }

      function clamp(x, lo, hi) {
        return Math.max(lo, Math.min(hi, x));
      }

      function clamp01(x) {
        return clamp(x, 0, 1);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function ease(t) {
        return t * t * (3 - 2 * t);
      }

      function smoothstep(e0, e1, x) {
        return ease(clamp01((x - e0) / (e1 - e0)));
      }
    </script>
  </body>
