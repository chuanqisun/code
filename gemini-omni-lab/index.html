<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Omni Lab</title>
    <style>
      :root {
        --space-xs: 0.25rem;
        --space-sm: 0.5rem;
        --space-md: 0.75rem;
        --space-lg: 1.5rem;
        --color-text-muted: #555;
        --color-border: #bbb;
        --color-border-light: #ccc;
        --color-surface: #f5f5f5;
        --color-accent: #1769aa;
        --color-error: #b00020;
        --font-size-sm: 0.875rem;
        --indent-step: 0.75rem;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 64rem;
        margin: 0 auto;
        padding: 1rem;
        font-family: sans-serif;
        line-height: 1.4;
      }

      h1 {
        font-size: 1.5rem;
      }

      h2 {
        font-size: 1.1rem;
      }

      section {
        margin-bottom: var(--space-lg);
      }

      input,
      select,
      textarea,
      button {
        font: inherit;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: var(--space-sm);
      }

      textarea {
        min-height: 7rem;
        resize: vertical;
      }

      button {
        padding: 0.45rem var(--space-md);
        cursor: pointer;

        &:disabled {
          cursor: default;
        }
      }

      .row,
      .section-heading,
      .output-heading,
      .actions {
        display: flex;
        gap: var(--space-md);
        align-items: center;
      }

      .row > label {
        flex: 1;
      }

      label > span,
      .muted,
      .meta {
        display: block;
        color: var(--color-text-muted);
        font-size: var(--font-size-sm);
        margin-bottom: var(--space-xs);
      }

      .section-heading,
      .output-heading {
        justify-content: space-between;

        & h2,
        & h3 {
          margin: 0;
        }
      }

      .composer,
      .context,
      .output {
        border: 1px solid var(--color-border);
        padding: var(--space-md);
        margin-bottom: var(--space-md);
      }

      .context {
        background: var(--color-surface);
      }

      .media-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr));
        gap: var(--space-md);
        margin: var(--space-md) 0;
      }

      .media-item {
        min-width: 0;
        border: 1px solid var(--color-border-light);
        padding: var(--space-sm);

        & img,
        & video {
          display: block;
          width: 100%;
          aspect-ratio: 16 / 9;
          object-fit: cover;
          background: #000;
          margin-bottom: 0.4rem;
        }
      }

      .media-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.8rem;
      }

      .actions {
        margin-top: var(--space-md);
        flex-wrap: wrap;

        & .primary {
          margin-left: auto;
          font-weight: bold;
        }
      }

      .output {
        border-left-width: 4px;
        margin-left: calc(var(--depth, 0) * var(--indent-step));

        &.selected {
          border-left-color: var(--color-accent);
        }

        & video {
          display: block;
          width: 100%;
          max-height: 70vh;
          background: #000;
          margin-top: var(--space-md);
        }
      }

      .output-actions {
        display: flex;
        gap: var(--space-sm);
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .prompt {
        white-space: pre-wrap;
        margin: var(--space-sm) 0;
      }

      .error {
        color: var(--color-error);
        white-space: pre-wrap;
      }

      @media (max-width: 38rem) {
        .row,
        .output-heading {
          align-items: stretch;
          flex-direction: column;
        }

        .output-actions {
          justify-content: flex-start;
        }

        .actions .primary {
          width: 100%;
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gemini Omni Lab</h1>

      <section aria-labelledby="configuration-heading">
        <h2 id="configuration-heading">Configuration</h2>
        <div class="row">
          <label>
            <span>Gemini API key</span>
            <input id="api-key" type="password" autocomplete="off" placeholder="Enter API key" data-1p-ignore />
          </label>
          <label>
            <span>Aspect ratio</span>
            <select id="aspect-ratio">
              <option value="16:9">16:9 Landscape</option>
              <option value="9:16">9:16 Portrait</option>
            </select>
          </label>
          <label>
            <span>Duration</span>
            <select id="duration">
              <option value="default">Default</option>
              <option value="4s">4s</option>
              <option value="8s">8s</option>
            </select>
          </label>
          <label>
            <span>Resolution</span>
            <select id="resolution">
              <option value="360p">360p</option>
              <option value="720p" selected>720p</option>
              <option value="1080p">1080p (upscaled)</option>
              <option value="4k">4K (upscaled)</option>
            </select>
          </label>
          <label>
            <span>Task</span>
            <select id="task">
              <option value="">Infer automatically</option>
              <option value="text_to_video">Text to video</option>
              <option value="image_to_video">Image to video</option>
              <option value="reference_to_video">Reference to video</option>
              <option value="edit">Edit</option>
              <option value="extend">Extend</option>
            </select>
          </label>
        </div>
      </section>

      <section aria-labelledby="composer-heading">
        <div class="section-heading">
          <h2 id="composer-heading">Create or edit</h2>
          <button id="new-thread" type="button" hidden>Start new thread</button>
        </div>

        <div id="context" class="context" hidden>
          <strong>Continuing from an existing output</strong>
          <div id="context-detail" class="muted"></div>
        </div>

        <div class="composer">
          <label for="prompt" class="muted">Prompt or editing instruction</label>
          <textarea id="prompt" placeholder="Describe a video, or select an output below and describe what to change."></textarea>
          <div id="media-list" class="media-list"></div>
          <div class="actions">
            <button id="add-images" type="button">Add images</button>
            <button id="add-video" type="button">Add video</button>
            <button id="clear-media" type="button" hidden>Clear media</button>
            <span class="muted">You can also paste or drop image and video files.</span>
            <button id="generate" class="primary" type="button">Generate video</button>
          </div>
          <div id="request-status" class="meta" role="status"></div>
        </div>
      </section>

      <section aria-labelledby="outputs-heading">
        <div class="section-heading">
          <h2 id="outputs-heading">Threads</h2>
          <button id="clear-outputs" type="button">Clear all</button>
        </div>
        <p id="empty-state" class="muted">Generated videos will appear here. Select any output to continue or branch its thread.</p>
        <div id="output-list"></div>
      </section>
    </main>

    <input id="file-picker" type="file" hidden multiple />

    <script type="module">
      import { GoogleGenAI } from "https://esm.sh/@google/genai";
      import { createStore, get, set } from "https://esm.sh/idb-keyval";

      const API_URL = "https://generativelanguage.googleapis.com/v1beta";
      const MODEL = "gemini-omni-1.1-flash";
      const FILE_POLL_INTERVAL_MS = 5000;
      const STATUS_TICK_MS = 1000;
      const MAX_INDENT_DEPTH = 4;
      const SHORT_PROMPT_LENGTH = 80;

      const store = createStore("gemini-omni-lab", "state");
      const save = (key, value) => set(key, value, store);
      const load = (key) => get(key, store);

      const $ = (id) => document.getElementById(id);
      const dom = {
        apiKey: $("api-key"),
        aspectRatio: $("aspect-ratio"),
        duration: $("duration"),
        resolution: $("resolution"),
        task: $("task"),
        prompt: $("prompt"),
        mediaList: $("media-list"),
        outputList: $("output-list"),
        emptyState: $("empty-state"),
        filePicker: $("file-picker"),
        context: $("context"),
        contextDetail: $("context-detail"),
        newThread: $("new-thread"),
        addImages: $("add-images"),
        addVideo: $("add-video"),
        clearMedia: $("clear-media"),
        clearOutputs: $("clear-outputs"),
        generate: $("generate"),
        requestStatus: $("request-status"),
      };

      const state = { media: [], outputs: [], selectedOutputId: null, abortController: null };

      const init = async () => {
        bindEvents();

        const [apiKey, config, draft, outputs] = await Promise.all(["apiKey", "config", "draft", "outputs"].map(load));
        if (apiKey) dom.apiKey.value = apiKey;
        if (config?.aspectRatio) dom.aspectRatio.value = config.aspectRatio;
        if (config?.duration) dom.duration.value = config.duration;
        if (config?.resolution) dom.resolution.value = config.resolution;
        if (config?.task) dom.task.value = config.task;
        if (draft) dom.prompt.value = draft;
        if (Array.isArray(outputs)) state.outputs = outputs;
        renderOutputs();
      };

      const bindEvents = () => {
        dom.apiKey.oninput = () => save("apiKey", dom.apiKey.value);
        dom.prompt.oninput = () => save("draft", dom.prompt.value);
        dom.aspectRatio.onchange = dom.duration.onchange = dom.resolution.onchange = dom.task.onchange = () => save("config", getConfig());

        dom.addImages.onclick = () => openFilePicker("image/*", true);
        dom.addVideo.onclick = () => openFilePicker("video/*", false);
        dom.clearMedia.onclick = clearMedia;
        dom.newThread.onclick = () => selectOutput(null);
        dom.generate.onclick = () => (state.abortController ? state.abortController.abort() : generate());
        dom.clearOutputs.onclick = clearOutputs;

        dom.filePicker.onchange = async ({ target }) => {
          await addFiles(target.files);
          target.value = "";
        };

        document.addEventListener("paste", (event) => {
          if (!event.clipboardData?.files.length) return;
          event.preventDefault();
          addFiles(event.clipboardData.files);
        });
        document.body.addEventListener("dragover", (event) => {
          if (event.dataTransfer?.types.includes("Files")) event.preventDefault();
        });
        document.body.addEventListener("drop", (event) => {
          if (!event.dataTransfer?.files.length) return;
          event.preventDefault();
          addFiles(event.dataTransfer.files);
        });
      };

      const getConfig = () => ({
        aspectRatio: dom.aspectRatio.value,
        duration: dom.duration.value,
        resolution: dom.resolution.value,
        task: dom.task.value,
      });

      const selectedOutput = () => state.outputs.find(({ id }) => id === state.selectedOutputId);

      const openFilePicker = (accept, multiple) => {
        Object.assign(dom.filePicker, { accept, multiple });
        dom.filePicker.click();
      };

      const addFiles = async (fileList) => {
        const mediaFiles = [...fileList].filter(({ type }) => type.startsWith("image/") || type.startsWith("video/"));
        for (const file of mediaFiles) {
          const type = file.type.startsWith("image/") ? "image" : "video";
          if (type === "video" && state.media.some((item) => item.type === "video")) {
            setStatus("Only one uploaded video can be used in a request.", true);
            continue;
          }
          state.media.push({
            id: crypto.randomUUID(),
            type,
            name: file.name || "pasted media",
            mimeType: file.type,
            dataUrl: await blobToDataUrl(file),
          });
        }
        renderMedia();
      };

      const removeMedia = (id) => {
        state.media = state.media.filter((item) => item.id !== id);
        renderMedia();
      };

      const clearMedia = () => {
        state.media = [];
        renderMedia();
      };

      const renderMedia = () => {
        dom.mediaList.replaceChildren(
          ...state.media.map((item) =>
            el(
              "div",
              { className: "media-item" },
              item.type === "image" ? el("img", { src: item.dataUrl, alt: item.name }) : el("video", { src: item.dataUrl, controls: true }),
              el("div", { className: "media-name", textContent: item.name, title: item.name }),
              el("button", { type: "button", textContent: "Remove", onclick: () => removeMedia(item.id) }),
            ),
          ),
        );
        dom.clearMedia.hidden = state.media.length === 0;
      };

      const selectOutput = (id) => {
        state.selectedOutputId = id;
        const selected = selectedOutput();
        dom.context.hidden = dom.newThread.hidden = !selected;
        dom.contextDetail.textContent = selected ? `Editing output from: ${shortPrompt(selected.prompt)}` : "";
        renderOutputs();
        dom.prompt.focus();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const generate = async () => {
        const apiKey = dom.apiKey.value.trim();
        const prompt = dom.prompt.value.trim();
        const parent = selectedOutput();
        const hasMedia = state.media.length > 0;

        const problem = !apiKey
          ? "Enter a Gemini API key."
          : !prompt && !hasMedia
            ? "Add a prompt or media input."
            : parent && !prompt
              ? "Describe what to edit or extend."
              : parent && state.media.some((item) => item.type === "video")
                ? "Uploaded source video cannot be combined with a thread continuation. Start a new thread for new source video."
                : null;
        if (problem) return setStatus(problem, true);

        state.abortController = new AbortController();
        const { signal } = state.abortController;
        const startedAt = Date.now();
        const timer = setInterval(() => setStatus(`Generating... ${Math.floor((Date.now() - startedAt) / 1000)}s`), STATUS_TICK_MS);
        setGenerating(true);

        try {
          const ai = new GoogleGenAI({ apiKey });
          const result = await ai.interactions.create(
            buildRequest(prompt, parent, state.media, getConfig()),
            { signal },
          );

          const video = findVideo(result);
          if (!video) throw new Error("The interaction completed without a video output.");

          const output = {
            id: crypto.randomUUID(),
            interactionId: result.id,
            parentId: parent?.id || null,
            prompt,
            createdAt: Date.now(),
            aspectRatio: dom.aspectRatio.value,
            duration: dom.duration.value,
            resolution: dom.resolution.value,
            videoDataUrl: video.data ? `data:${video.mimeType};base64,${video.data}` : await downloadVideo(video.uri, apiKey, signal),
          };
          state.outputs.push(output);
          await save("outputs", state.outputs);

          dom.prompt.value = "";
          await save("draft", "");
          clearMedia();
          selectOutput(output.id);
          setStatus("Video ready.");
        } catch (error) {
          const cancelled = error.name === "AbortError";
          setStatus(cancelled ? "Generation cancelled." : error.message, !cancelled);
        } finally {
          clearInterval(timer);
          state.abortController = null;
          setGenerating(false);
        }
      };

      const downloadVideo = async (uri, apiKey, signal) => {
        if (!uri) throw new Error("The video response contained neither data nor a URI.");
        const fileId = uri.match(/files\/([^/:?]+)/)?.[1];
        const key = encodeURIComponent(apiKey);
        if (fileId) await waitForFile(fileId, key, signal);

        const response = await fetch(fileId ? `${API_URL}/files/${fileId}:download?alt=media&key=${key}` : uri, {
          headers: fileId ? undefined : { "x-goog-api-key": apiKey },
          signal,
        });
        if (!response.ok) throw new Error(`Video download failed with status ${response.status}`);
        return blobToDataUrl(await response.blob());
      };

      const waitForFile = async (fileId, key, signal) => {
        while (true) {
          const file = await fetchJson(`${API_URL}/files/${fileId}?key=${key}`, { signal });
          const fileState = file.state?.name ?? file.state;
          if (fileState === "ACTIVE") return;
          if (fileState === "FAILED") throw new Error("Gemini failed to process the generated video.");
          await wait(FILE_POLL_INTERVAL_MS, signal);
        }
      };

      const setGenerating = (active) => {
        dom.generate.textContent = active ? "Cancel" : "Generate video";
        for (const field of [dom.apiKey, dom.prompt, dom.aspectRatio, dom.duration, dom.resolution, dom.task]) field.disabled = active;
      };

      const setStatus = (message, isError = false) => {
        dom.requestStatus.textContent = message;
        dom.requestStatus.classList.toggle("error", isError);
      };

      const renderOutputs = () => {
        const depths = depthsById(state.outputs);
        dom.emptyState.hidden = state.outputs.length > 0;
        dom.outputList.replaceChildren(
          ...state.outputs.toReversed().map((output) => {
            const depth = depths.get(output.id) || 0;
            const isSelected = output.id === state.selectedOutputId;
            return el(
              "article",
              { className: `output ${isSelected ? "selected" : ""}`, style: `--depth: ${Math.min(depth, MAX_INDENT_DEPTH)}` },
              el(
                "div",
                { className: "output-heading" },
                el("h3", { textContent: depth ? `Edit ${depth}` : "Original" }),
                el(
                  "div",
                  { className: "output-actions" },
                  el("button", {
                    type: "button",
                    textContent: isSelected ? "Selected as context" : "Continue from here",
                    disabled: isSelected,
                    onclick: () => selectOutput(output.id),
                  }),
                  el("a", { href: output.videoDataUrl, download: `gemini-omni-${output.id}.mp4`, textContent: "Download" }),
                  el("button", { type: "button", textContent: "Remove", onclick: () => removeOutput(output.id) }),
                ),
              ),
              el("div", {
                className: "meta",
                textContent: `${new Date(output.createdAt).toLocaleString()} · ${output.aspectRatio} · ${output.resolution || "720p"}${output.duration && output.duration !== "default" ? ` · ${output.duration}` : ""}`,
              }),
              el("div", { className: "prompt", textContent: output.prompt || "Media input only" }),
              el("video", { src: output.videoDataUrl, controls: true, loop: true, preload: "metadata" }),
            );
          }),
        );
      };

      const removeOutput = async (id) => {
        if (state.selectedOutputId === id) selectOutput(null);
        state.outputs = state.outputs.filter((output) => output.id !== id).map((output) => (output.parentId === id ? { ...output, parentId: null } : output));
        await save("outputs", state.outputs);
        renderOutputs();
      };

      const clearOutputs = async () => {
        if (!state.outputs.length || !confirm("Remove all saved outputs and thread history?")) return;
        selectOutput(null);
        state.outputs = [];
        await save("outputs", []);
        renderOutputs();
      };

      const buildRequest = (prompt, parent, media, { aspectRatio, resolution, duration, task }) => {
        const body = {
          model: MODEL,
          response_format: {
            type: "video",
            delivery: "inline",
            ...(aspectRatio && aspectRatio !== "default" ? { aspect_ratio: aspectRatio } : {}),
            ...(resolution && resolution !== "default" ? { resolution } : {}),
            ...(duration && duration !== "default" ? { duration } : {}),
          },
          ...(task && task !== "default" && !parent ? { generation_config: { video_config: { task } } } : {}),
          background: false,
          store: true,
          stream: false,
        };

        const content = media.map(({ type, dataUrl, mimeType }) => ({ type, data: dataUrl.split(",")[1], mime_type: mimeType }));
        if (prompt) content.push({ type: "text", text: prompt });

        if (parent) {
          body.previous_interaction_id = parent.interactionId;
          body.input = content.length > 0 ? (content.length === 1 && content[0].type === "text" ? prompt : content) : prompt;
          return body;
        }

        const textOnly = content.length === 1 && content[0].type === "text";
        const hasVideo = content.some(({ type }) => type === "video");
        return { ...body, input: hasVideo ? [{ type: "user_input", content }] : textOnly ? prompt : content };
      };

      const findVideo = ({ output_video, steps = [] } = {}) => {
        const video = output_video ?? steps.flatMap(({ content = [] }) => content).find(({ type }) => type === "video");
        return video ? { data: video.data, uri: video.uri, mimeType: video.mime_type || "video/mp4" } : null;
      };

      const depthsById = (outputs) => outputs.reduce((depths, { id, parentId }) => depths.set(id, parentId ? (depths.get(parentId) ?? 0) + 1 : 0), new Map());

      const fetchJson = async (url, options) => {
        const response = await fetch(url, options);
        const json = await response.json();
        if (!response.ok) throw new Error(json.error?.message || `Request failed with status ${response.status}`);
        return json;
      };

      const el = (tag, props = {}, ...children) => {
        const element = Object.assign(document.createElement(tag), props);
        element.append(...children);
        return element;
      };

      const shortPrompt = (prompt) =>
        !prompt ? "media input" : prompt.length > SHORT_PROMPT_LENGTH ? `${prompt.slice(0, SHORT_PROMPT_LENGTH - 3)}...` : prompt;

      const wait = (milliseconds, signal) =>
        new Promise((resolve, reject) => {
          const timeout = setTimeout(resolve, milliseconds);
          signal.addEventListener(
            "abort",
            () => {
              clearTimeout(timeout);
              reject(new DOMException("Generation cancelled", "AbortError"));
            },
            { once: true },
          );
        });

      const blobToDataUrl = (blob) =>
        new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });

      init();
    </script>
  </body>
</html>
