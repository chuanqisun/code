<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hand Landmarks</title>
    <style>
      :root {
        --ink: black;
        --paper: white;
        --font: monospace;
        --gap: 8px;
      }

      body {
        font-family: var(--font);
        background: var(--paper);
        color: var(--ink);

        & select {
          font-family: inherit;
          background: inherit;
          color: inherit;
        }
      }

      /* Video must stay in the DOM for frame decoding, but is invisible */
      video {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      canvas {
        display: block;
        position: fixed;
        inset: 0;
      }

      .camera {
        position: absolute;
        top: var(--gap);
        left: var(--gap);
        opacity: 0;

        &:hover,
        &:focus-within {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="camera">
      <label for="camera-select">Camera:</label>
      <select id="camera-select"></select>
    </div>

    <script type="module">
      import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

      const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm";
      const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
      const STORAGE_KEY = "selected_camera_id";

      const MAX_HANDS = 2;
      const POINTS_PER_HAND = 21;
      const POINT_SIZE = 6;
      const DRAW_STYLE = { strokeStyle: "black", fillStyle: "black", lineWidth: 2 };
      const FILTER_OPTIONS = { minCutoff: 1, beta: 10 };
      // distance from the virtual camera to the wrist, in normalized landmark units; smaller = stronger perspective
      const CAMERA_DISTANCE = 0.5;
      const MIN_DEPTH = 0.05;

      const HAND_CONNECTIONS = [
        [0, 1],
        [1, 2],
        [2, 3],
        [3, 4],
        [0, 5],
        [5, 6],
        [6, 7],
        [7, 8],
        [5, 9],
        [9, 10],
        [10, 11],
        [11, 12],
        [9, 13],
        [13, 14],
        [14, 15],
        [15, 16],
        [13, 17],
        [0, 17],
        [17, 18],
        [18, 19],
        [19, 20],
      ];

      const [video, canvas, cameraSelect] = ["video", "canvas", "camera-select"].map((id) => document.getElementById(id));
      const ctx = canvas.getContext("2d");

      const SIDES = ["Left", "Right"];

      // filters[0] tracks the left hand, filters[1] the right hand
      const filters = Array.from({ length: MAX_HANDS }, () =>
        Array.from({ length: POINTS_PER_HAND }, () => ({
          x: createOneEuroFilter(FILTER_OPTIONS),
          y: createOneEuroFilter(FILTER_OPTIONS),
          z: createOneEuroFilter(FILTER_OPTIONS),
        })),
      );

      let handLandmarker;
      let currentStream;
      let lastVideoTime = -1;

      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      init().catch((err) => console.error(err));

      async function init() {
        const vision = await FilesetResolver.forVisionTasks(WASM_URL);

        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
          numHands: MAX_HANDS,
        });

        const activeDeviceId = await startCamera(localStorage.getItem(STORAGE_KEY));
        await populateCameraList(activeDeviceId);

        cameraSelect.onchange = async () => {
          clearCanvas();
          await startCamera(cameraSelect.value);
        };

        render();
      }

      function render() {
        if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const nowMs = performance.now();
          const nowSec = nowMs / 1000;
          const { landmarks = [], handedness = [] } = handLandmarker.detectForVideo(video, nowMs);

          clearCanvas();

          // separate hands by detected side; the first detection wins if a side is reported twice
          const hands = {};
          landmarks.forEach((hand, i) => {
            const side = handedness[i]?.[0]?.categoryName;
            if (SIDES.includes(side) && !hands[side]) hands[side] = hand;
          });

          SIDES.forEach((side, sideIndex) => {
            const hand = hands[side];
            if (!hand) {
              filters[sideIndex].forEach((axes) => Object.values(axes).forEach((f) => f.reset()));
              return;
            }

            // view the hand from behind: rotate 180° about the vertical axis (x -> 1 - x, z -> -z),
            // so the palm facing the real camera becomes the back of the hand; it stays on its detected side of the screen
            const rotated = hand.map(({ x, y, z }, pointIndex) => {
              const f = filters[sideIndex][pointIndex];
              return { x: f.x.filter(1 - x, nowSec), y: f.y.filter(y, nowSec), z: f.z.filter(-z, nowSec) };
            });

            // perspective about the wrist (z is wrist-relative): points nearer the virtual camera spread out and grow
            // original size: scale normalized landmarks by the video's pixel dimensions
            const { videoWidth, videoHeight } = video;
            const offsetX = side === "Left" ? 0 : canvas.width - videoWidth;
            const offsetY = (canvas.height - videoHeight) / 2;
            const wrist = rotated[0];

            const points = rotated.map(({ x, y, z }) => {
              const scale = CAMERA_DISTANCE / Math.max(CAMERA_DISTANCE + z, MIN_DEPTH);
              return {
                x: (wrist.x + (x - wrist.x) * scale) * videoWidth + offsetX,
                y: (wrist.y + (y - wrist.y) * scale) * videoHeight + offsetY,
                z,
                scale,
              };
            });
            drawHand(ctx, points);
          });
        }
        requestAnimationFrame(render);
      }

      async function startCamera(deviceId) {
        currentStream?.getTracks().forEach((track) => track.stop());

        const requestStream = (constraints) => navigator.mediaDevices.getUserMedia({ video: constraints });
        currentStream = await requestStream(deviceId ? { deviceId: { exact: deviceId } } : true).catch((err) => {
          if (!deviceId) throw err;
          return requestStream(true);
        });

        video.srcObject = currentStream;
        await new Promise((resolve) => (video.onloadeddata = resolve));

        const activeDeviceId = currentStream.getVideoTracks()[0]?.getSettings()?.deviceId;
        if (activeDeviceId) localStorage.setItem(STORAGE_KEY, activeDeviceId);
        return activeDeviceId;
      }

      async function populateCameraList(activeDeviceId) {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const options = devices.filter(({ kind }) => kind === "videoinput").map(({ deviceId, label }, i) => new Option(label || `Camera ${i + 1}`, deviceId));

        cameraSelect.replaceChildren(...options);
        if (activeDeviceId) cameraSelect.value = activeDeviceId;
      }

      function resizeCanvas() {
        Object.assign(canvas, { width: window.innerWidth, height: window.innerHeight });
      }

      function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function drawHand(ctx, points) {
        Object.assign(ctx, DRAW_STYLE);

        // painter's algorithm: draw far-to-near (larger z is farther) so nearer parts overlap farther ones
        const bones = HAND_CONNECTIONS.map(([a, b]) => ({
          z: (points[a].z + points[b].z) / 2,
          draw: () => {
            ctx.lineWidth = DRAW_STYLE.lineWidth * ((points[a].scale + points[b].scale) / 2);
            ctx.beginPath();
            ctx.moveTo(points[a].x, points[a].y);
            ctx.lineTo(points[b].x, points[b].y);
            ctx.stroke();
          },
        }));
        const joints = points.map(({ x, y, z, scale }) => ({
          z,
          draw: () => {
            const size = POINT_SIZE * scale;
            ctx.fillRect(x - size / 2, y - size / 2, size, size);
          },
        }));

        [...bones, ...joints].sort((p, q) => q.z - p.z).forEach(({ draw }) => draw());
      }

      function createOneEuroFilter({ minCutoff = 1, beta = 0, derivativeCutoff = 1 } = {}) {
        let state;
        const reset = () => (state = { time: null, raw: null, value: null, velocity: null });

        const filter = (raw, time) => {
          const elapsed = state.time === null ? null : time - state.time;
          if (elapsed !== null && elapsed <= 0) return state.value;
          if (elapsed > 1) reset();

          const dt = state.time === null ? 1 / 60 : elapsed;
          const rawVelocity = state.raw === null ? 0 : (raw - state.raw) / dt;
          const velocity = lowPass(state.velocity, rawVelocity, smoothingFactor(derivativeCutoff, dt));
          const cutoff = minCutoff + beta * Math.abs(velocity);
          const value = lowPass(state.value, raw, smoothingFactor(cutoff, dt));

          state = { time, raw, value, velocity };
          return value;
        };

        reset();
        return { filter, reset };
      }

      function smoothingFactor(cutoff, dt) {
        const r = 2 * Math.PI * cutoff * dt;
        return r / (r + 1);
      }

      function lowPass(previous, next, alpha) {
        return previous === null ? next : alpha * next + (1 - alpha) * previous;
      }
    </script>
  </body>
</html>
