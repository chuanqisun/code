<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hand Landmarks</title>
    <style>
      :root {
        --ink: black;
        --paper: white;
        --font: monospace;
        --gap: 8px;
      }

      body {
        font-family: var(--font);
        background: var(--paper);
        color: var(--ink);

        & select,
        & input,
        & button {
          font-family: inherit;
          background: inherit;
          color: inherit;
        }
      }

      /* Video must stay in the DOM for frame decoding, but is invisible */
      video {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      canvas {
        display: block;
        position: fixed;
        inset: 0;
      }

      .camera {
        position: absolute;
        top: var(--gap);
        left: var(--gap);
        display: grid;
        grid-template-columns: auto auto;
        gap: 4px var(--gap);
        align-items: center;
        opacity: 0;

        & input {
          width: 6em;
        }

        &:hover,
        &:focus-within {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="camera">
      <label for="camera-select">Camera:</label>
      <select id="camera-select"></select>
      <label for="fov">FOV (°):</label>
      <input id="fov" type="number" min="10" max="175" step="1" />
      <label for="yaw">Yaw (°):</label>
      <input id="yaw" type="number" min="-90" max="90" step="1" />
      <label for="pitch">Pitch (°):</label>
      <input id="pitch" type="number" min="-90" max="90" step="1" />
      <label for="roll">Roll (°):</label>
      <input id="roll" type="number" min="-180" max="180" step="1" />
      <span></span>
      <button id="projection-reset">Reset</button>
    </div>

    <script type="module">
      import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

      const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm";
      const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
      const STORAGE_KEY = "selected_camera_id";
      const PROJECTION_STORAGE_KEY = "camera_projection";
      const INTRINSICS_URL = "./intrinsics.json";

      // Virtual pinhole camera the omnidir frame is reprojected into. fov is horizontal, all angles in degrees.
      const DEFAULT_PROJECTION = { fov: 120, yaw: 0, pitch: 0, roll: 0 };
      const PROJECTION_KEYS = Object.keys(DEFAULT_PROJECTION);

      // For each output pixel: back-project through the virtual pinhole camera, rotate, project onto the
      // unit sphere, then through the calibrated omnidir (Mei) model to find the source pixel in the raw frame.
      const UNDISTORT_VERT = `
        attribute vec2 aPos;
        varying vec2 vUv;
        void main() {
          vUv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);
          gl_Position = vec4(aPos, 0.0, 1.0);
        }`;
      const UNDISTORT_FRAG = `
        precision highp float;
        uniform sampler2D uTex;
        uniform vec2 uSize;   // frame size in px (input and output)
        uniform vec4 uK;      // fx, fy, cx, cy of the calibrated camera
        uniform float uSkew;
        uniform vec4 uKnew;   // fx, fy, cx, cy of the virtual pinhole camera
        uniform mat3 uR;      // virtual camera rotation
        uniform float uXi;
        uniform vec4 uD;      // k1, k2, p1, p2
        varying vec2 vUv;
        void main() {
          vec2 px = vUv * uSize;
          vec3 s = normalize(uR * vec3((px - uKnew.zw) / uKnew.xy, 1.0));
          float denom = s.z + uXi;
          if (denom <= 0.0) {
            gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
            return;
          }
          vec2 xu = s.xy / denom;
          float r2 = dot(xu, xu);
          float radial = 1.0 + uD.x * r2 + uD.y * r2 * r2;
          vec2 xd = xu * radial + vec2(
            2.0 * uD.z * xu.x * xu.y + uD.w * (r2 + 2.0 * xu.x * xu.x),
            uD.z * (r2 + 2.0 * xu.y * xu.y) + 2.0 * uD.w * xu.x * xu.y);
          vec2 src = vec2(uK.x * xd.x + uSkew * xd.y + uK.z, uK.y * xd.y + uK.w);
          vec2 uv = src / uSize;
          if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
            gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
          } else {
            gl_FragColor = texture2D(uTex, uv);
          }
        }`;

      const MAX_HANDS = 2;
      const POINTS_PER_HAND = 21;
      const POINT_SIZE = 6;
      const DRAW_STYLE = { strokeStyle: "black", fillStyle: "black", lineWidth: 2 };
      const FILTER_OPTIONS = { minCutoff: 1, beta: 10 };

      const HAND_CONNECTIONS = [
        [0, 1],
        [1, 2],
        [2, 3],
        [3, 4],
        [0, 5],
        [5, 6],
        [6, 7],
        [7, 8],
        [5, 9],
        [9, 10],
        [10, 11],
        [11, 12],
        [9, 13],
        [13, 14],
        [14, 15],
        [15, 16],
        [13, 17],
        [0, 17],
        [17, 18],
        [18, 19],
        [19, 20],
      ];

      const [video, canvas, cameraSelect] = ["video", "canvas", "camera-select"].map((id) => document.getElementById(id));
      const ctx = canvas.getContext("2d");
      const projectionInputs = Object.fromEntries(PROJECTION_KEYS.map((key) => [key, document.getElementById(key)]));
      const projectionReset = document.getElementById("projection-reset");

      // offscreen canvas holding the undistorted frame that is fed to hand tracking
      const frameCanvas = document.createElement("canvas");
      const gl = frameCanvas.getContext("webgl", { preserveDrawingBuffer: true });
      let uniforms;
      let intrinsics;

      const SIDES = ["Left", "Right"];

      // filters[0] tracks the left hand, filters[1] the right hand
      const filters = Array.from({ length: MAX_HANDS }, () =>
        Array.from({ length: POINTS_PER_HAND }, () => ({
          x: createOneEuroFilter(FILTER_OPTIONS),
          y: createOneEuroFilter(FILTER_OPTIONS),
        })),
      );

      let handLandmarker;
      let currentStream;
      let lastVideoTime = -1;

      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      init().catch((err) => console.error(err));

      async function init() {
        intrinsics = await (await fetch(INTRINSICS_URL)).json();
        initUndistort();
        initProjectionControls();

        const vision = await FilesetResolver.forVisionTasks(WASM_URL);

        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
          runningMode: "VIDEO",
          numHands: MAX_HANDS,
        });

        const activeDeviceId = await startCamera(localStorage.getItem(STORAGE_KEY));
        await populateCameraList(activeDeviceId);

        cameraSelect.onchange = async () => {
          clearCanvas();
          await startCamera(cameraSelect.value);
        };

        render();
      }

      function render() {
        if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
          lastVideoTime = video.currentTime;
          const nowMs = performance.now();
          const nowSec = nowMs / 1000;
          undistortFrame();
          const { landmarks = [], handedness = [] } = handLandmarker.detectForVideo(frameCanvas, nowMs);

          clearCanvas();

          // separate hands by side; the first detection wins if a side is reported twice
          const hands = {};
          landmarks.forEach((hand, i) => {
            const side = handedness[i]?.[0]?.categoryName;
            if (SIDES.includes(side) && !hands[side]) hands[side] = hand;
          });

          SIDES.forEach((side, sideIndex) => {
            const hand = hands[side];
            if (!hand) {
              filters[sideIndex].forEach(({ x, y }) => {
                x.reset();
                y.reset();
              });
              return;
            }

            // original size: scale normalized landmarks by the undistorted frame's pixel dimensions
            const { width: frameWidth, height: frameHeight } = frameCanvas;
            const offsetX = side === "Left" ? 0 : canvas.width - frameWidth;
            const offsetY = (canvas.height - frameHeight) / 2;

            const points = hand.map(({ x, y }, pointIndex) => ({
              x: filters[sideIndex][pointIndex].x.filter(x, nowSec) * frameWidth + offsetX,
              y: filters[sideIndex][pointIndex].y.filter(y, nowSec) * frameHeight + offsetY,
            }));
            drawHand(ctx, points);
          });
        }
        requestAnimationFrame(render);
      }

      async function startCamera(deviceId) {
        currentStream?.getTracks().forEach((track) => track.stop());

        // request the resolution the intrinsics were calibrated at
        const size = { width: { ideal: intrinsics.image_width }, height: { ideal: intrinsics.image_height } };
        const requestStream = (constraints) => navigator.mediaDevices.getUserMedia({ video: constraints });
        currentStream = await requestStream(deviceId ? { deviceId: { exact: deviceId }, ...size } : size).catch((err) => {
          if (!deviceId) throw err;
          return requestStream(size);
        });

        video.srcObject = currentStream;
        await new Promise((resolve) => (video.onloadeddata = resolve));
        updateUndistortParams();

        const activeDeviceId = currentStream.getVideoTracks()[0]?.getSettings()?.deviceId;
        if (activeDeviceId) localStorage.setItem(STORAGE_KEY, activeDeviceId);
        return activeDeviceId;
      }

      async function populateCameraList(activeDeviceId) {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const options = devices.filter(({ kind }) => kind === "videoinput").map(({ deviceId, label }, i) => new Option(label || `Camera ${i + 1}`, deviceId));

        cameraSelect.replaceChildren(...options);
        if (activeDeviceId) cameraSelect.value = activeDeviceId;
      }

      function initProjectionControls() {
        const stored = JSON.parse(localStorage.getItem(PROJECTION_STORAGE_KEY) ?? "{}");
        const setValues = (projection) => PROJECTION_KEYS.forEach((key) => (projectionInputs[key].value = projection[key] ?? DEFAULT_PROJECTION[key]));
        const onChange = () => {
          localStorage.setItem(PROJECTION_STORAGE_KEY, JSON.stringify(readProjection()));
          if (video.videoWidth) updateUndistortParams();
        };

        setValues(stored);
        PROJECTION_KEYS.forEach((key) => projectionInputs[key].addEventListener("input", onChange));
        projectionReset.onclick = () => {
          setValues(DEFAULT_PROJECTION);
          onChange();
        };
      }

      function readProjection() {
        return Object.fromEntries(
          PROJECTION_KEYS.map((key) => {
            const value = parseFloat(projectionInputs[key].value);
            return [key, Number.isFinite(value) ? value : DEFAULT_PROJECTION[key]];
          }),
        );
      }

      function initUndistort() {
        const compileShader = (type, src) => {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, src);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
          return shader;
        };

        const program = gl.createProgram();
        gl.attachShader(program, compileShader(gl.VERTEX_SHADER, UNDISTORT_VERT));
        gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, UNDISTORT_FRAG));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
        gl.useProgram(program);

        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(program, "aPos");
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

        uniforms = Object.fromEntries(["uSize", "uK", "uSkew", "uKnew", "uR", "uXi", "uD"].map((name) => [name, gl.getUniformLocation(program, name)]));
      }

      // Calibration was done at intrinsics.image_width x image_height; scale K to the live resolution.
      function updateUndistortParams() {
        const { videoWidth: w, videoHeight: h } = video;
        Object.assign(frameCanvas, { width: w, height: h });
        gl.viewport(0, 0, w, h);

        const sx = w / intrinsics.image_width;
        const sy = h / intrinsics.image_height;
        if (Math.abs(sx - sy) > 1e-3) {
          console.warn(`Camera aspect ${w}x${h} differs from calibration ${intrinsics.image_width}x${intrinsics.image_height}`);
        }
        const [[fx, skew, cx], [, fy, cy]] = intrinsics.K;

        const { fov, yaw, pitch, roll } = readProjection();
        const toRad = (deg) => (deg * Math.PI) / 180;
        const fNew = w / 2 / Math.tan(toRad(Math.min(Math.max(fov, 1), 179)) / 2);

        gl.uniform2f(uniforms.uSize, w, h);
        gl.uniform4f(uniforms.uK, fx * sx, fy * sy, cx * sx, cy * sy);
        gl.uniform1f(uniforms.uSkew, skew * sx);
        gl.uniform4f(uniforms.uKnew, fNew, fNew, w / 2, h / 2);
        gl.uniformMatrix3fv(uniforms.uR, false, rotationMatrix(toRad(yaw), toRad(pitch), toRad(roll)));
        gl.uniform1f(uniforms.uXi, intrinsics.xi);
        gl.uniform4f(uniforms.uD, ...intrinsics.D);
      }

      function undistortFrame() {
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      // R = Ry(yaw) * Rx(pitch) * Rz(roll), returned column-major for WebGL
      function rotationMatrix(yaw, pitch, roll) {
        const [cy, sy, cp, sp, cr, sr] = [Math.cos(yaw), Math.sin(yaw), Math.cos(pitch), Math.sin(pitch), Math.cos(roll), Math.sin(roll)];
        const ry = [
          [cy, 0, sy],
          [0, 1, 0],
          [-sy, 0, cy],
        ];
        const rx = [
          [1, 0, 0],
          [0, cp, -sp],
          [0, sp, cp],
        ];
        const rz = [
          [cr, -sr, 0],
          [sr, cr, 0],
          [0, 0, 1],
        ];
        const multiply = (a, b) => a.map((row) => [0, 1, 2].map((j) => row.reduce((sum, v, k) => sum + v * b[k][j], 0)));
        const r = multiply(multiply(ry, rx), rz);
        return new Float32Array([0, 1, 2].flatMap((col) => r.map((row) => row[col])));
      }

      function resizeCanvas() {
        Object.assign(canvas, { width: window.innerWidth, height: window.innerHeight });
      }

      function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function drawHand(ctx, points) {
        Object.assign(ctx, DRAW_STYLE);

        ctx.beginPath();
        for (const [a, b] of HAND_CONNECTIONS) {
          ctx.moveTo(points[a].x, points[a].y);
          ctx.lineTo(points[b].x, points[b].y);
        }
        ctx.stroke();

        for (const { x, y } of points) {
          ctx.fillRect(x - POINT_SIZE / 2, y - POINT_SIZE / 2, POINT_SIZE, POINT_SIZE);
        }
      }

      function createOneEuroFilter({ minCutoff = 1, beta = 0, derivativeCutoff = 1 } = {}) {
        let state;
        const reset = () => (state = { time: null, raw: null, value: null, velocity: null });

        const filter = (raw, time) => {
          const elapsed = state.time === null ? null : time - state.time;
          if (elapsed !== null && elapsed <= 0) return state.value;
          if (elapsed > 1) reset();

          const dt = state.time === null ? 1 / 60 : elapsed;
          const rawVelocity = state.raw === null ? 0 : (raw - state.raw) / dt;
          const velocity = lowPass(state.velocity, rawVelocity, smoothingFactor(derivativeCutoff, dt));
          const cutoff = minCutoff + beta * Math.abs(velocity);
          const value = lowPass(state.value, raw, smoothingFactor(cutoff, dt));

          state = { time, raw, value, velocity };
          return value;
        };

        reset();
        return { filter, reset };
      }

      function smoothingFactor(cutoff, dt) {
        const r = 2 * Math.PI * cutoff * dt;
        return r / (r + 1);
      }

      function lowPass(previous, next, alpha) {
        return previous === null ? next : alpha * next + (1 - alpha) * previous;
      }
    </script>
  </body>
</html>
