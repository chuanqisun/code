<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sh.elf</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>" />
    <style>
      :root {
        --text: #111111;
        --bg: #ffffff;
        --border: #111111;
        --dark-wood: #2a1f18;
        --light-wood: #d5b895;
        --guide-dash: rgba(180, 140, 100, 0.45);
        --guide-hover: rgba(180, 140, 100, 0.25);
        --canvas-bg: #e8e8e4;
        --max-width: 768px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: ui-monospace, "SF Mono", "Cascadia Code", "Courier New", monospace;
        margin: 0;
        padding: 20px 16px 40px;
        color: var(--text);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        -webkit-font-smoothing: antialiased;
      }

      .app-container {
        width: 100%;
        max-width: var(--max-width);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        width: 100%;
      }

      h1 {
        font-size: 1rem;
        font-weight: 700;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .status-pill {
        font-size: 0.8rem;
        text-transform: uppercase;
      }
      .status-pill.connected {
        color: #000;
        font-weight: bold;
      }
      .status-pill.disconnected {
        color: #888;
      }
      .status-pill.generating {
        color: #555;
        text-decoration: underline;
      }
      .status-pill.error {
        color: #d00;
        font-weight: bold;
      }

      .compact-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: #f7f7f7;
        padding: 8px 12px;
        border: 1px solid var(--border);
        width: 100%;
      }

      .bar-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button {
        font-family: inherit;
        font-size: 0.8rem;
        text-transform: uppercase;
        background: #fff;
        color: #000;
        border: 1px solid var(--border);
        padding: 6px 12px;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover:not(:disabled) {
        background: #000;
        color: #fff;
      }
      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      button.active-toggle {
        background: #000;
        color: #fff;
      }

      .tool-btn-group {
        display: flex;
        border: 1px solid var(--border);
        background: #fff;
      }
      .tool-btn-group button {
        border: none;
        border-right: 1px solid var(--border);
        padding: 6px 10px;
        font-size: 0.8rem;
      }
      .tool-btn-group button:last-child {
        border-right: none;
      }

      .workspace {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: 100%;
        margin: 4px 0;
      }

      .workspace.merged {
        position: relative;
        width: 100%;
        max-width: var(--max-width);
        aspect-ratio: 1 / 1;

        > * {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }

        .output-frame {
          z-index: 1;
        }

        #draw-canvas {
          z-index: 2;
          opacity: 0;
          background: transparent;
        }

        #draft-canvas {
          z-index: 3;
          background: transparent;
          border-color: transparent;
        }
      }

      .workspace.show-draft #draft-canvas {
        display: block;
      }

      canvas,
      .output-frame {
        width: 100%;
        max-width: var(--max-width);
        aspect-ratio: 1 / 1;
        height: auto;
        border: 1px solid var(--border);
        display: block;
      }

      #draw-canvas {
        cursor: crosshair;
        background: #fff;
        touch-action: none;
      }

      #draft-canvas {
        pointer-events: none;
        display: none;
      }

      .output-frame {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fbfbfb;
        position: relative;
        overflow: hidden;
      }

      .output-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }
      .output-frame img.visible {
        display: block;
      }

      #output-placeholder {
        font-size: 0.8rem;
        color: #999;
        text-transform: uppercase;
      }

      details.settings-menu {
        border: 1px solid var(--border);
        background: #fff;
        font-size: 0.8rem;
        width: 100%;
      }

      details.settings-menu summary {
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
        user-select: none;
        background: #fafafa;
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      details.settings-menu summary::-webkit-details-marker {
        display: none;
      }
      details.settings-menu summary::after {
        content: "+";
      }
      details.settings-menu[open] summary::after {
        content: "-";
      }

      .menu-body {
        padding: 14px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .form-group label {
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
      }
      input[type="password"],
      textarea {
        width: 100%;
        font-family: inherit;
        font-size: 0.8rem;
        padding: 8px;
        border: 1px solid var(--border);
        background: #fff;
        color: #000;
      }
      textarea {
        height: 80px;
        resize: vertical;
      }

      .checkbox-row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        cursor: pointer;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>SH.ELF</h1>
        <div>
          <span id="status" class="status-pill disconnected">Disconnected</span>
          <span id="fps-display" style="font-size: 0.75rem; color: #777; margin-left: 6px"></span>
        </div>
      </header>

      <div class="compact-bar">
        <div class="bar-group">
          <button id="toggle-connect-btn">Start</button>
          <button id="mode-toggle-btn">Mode: Manual</button>
          <button id="manual-send-btn" disabled>Send</button>
        </div>

        <div class="bar-group">
          <div class="tool-btn-group">
            <button id="tool-build" class="active-toggle" title="Build Shelves">🔨 Build</button>
            <button id="tool-pot" title="Place Pots (Shortcut: P)">🪴 Pot</button>
            <button id="tool-plant" title="Water & Grow">💦 Grow</button>
          </div>
        </div>
      </div>

      <div class="workspace merged show-draft" id="workspace">
        <canvas id="draw-canvas" width="768" height="768"></canvas>
        <canvas id="draft-canvas" width="768" height="768"></canvas>
        <div class="output-frame">
          <span id="output-placeholder">No output</span>
          <img id="output-img" alt="Generated visual" />
        </div>
      </div>

      <details class="settings-menu">
        <summary>Menu</summary>
        <div class="menu-body">
          <div class="form-group">
            <label for="api-key">fal.ai API Key</label>
            <input type="password" id="api-key" placeholder="key_id:key_secret" autocomplete="off" />
          </div>

          <div class="form-group">
            <label for="prompt">Prompt (Auto-generated)</label>
            <textarea id="prompt" readonly></textarea>
          </div>

          <div class="checkbox-row">
            <label class="checkbox-label"> <input type="checkbox" id="guides-toggle" /> Split Guides </label>
            <label class="checkbox-label"> <input type="checkbox" id="merge-toggle" checked /> Merge Output View </label>
          </div>
        </div>
      </details>
    </div>

    <script type="module">
      import { fal } from "https://esm.sh/@fal-ai/client@1?bundle";

      // ── Constants ─────────────────────────────────────────────────────────

      const FAL_APP_ID = "fal-ai/flux-2/klein";
      const CONNECTION_KEY = "flux-2-klein-pad-session";
      const STREAM_FPS = 30;
      const MIN_SIZE = 30;
      const GOLDEN_RATIO = (1 + Math.sqrt(5)) / 2;
      const CAPTURE_SIZE = 384;
      const STORAGE = { apiKey: "fal_flux_klein_api_key", mode: "fal_flux_klein_mode_v2" };
      const FALLBACK_PROMPT = "Modern minimalist wooden bookshelf with books, indoor plants, ceramics and decorative art";

      const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      const THEME = {
        darkWood: cssVar("--dark-wood") || "#2a1f18",
        lightWood: cssVar("--light-wood") || "#d5b895",
        guideDash: cssVar("--guide-dash") || "rgba(180, 140, 100, 0.45)",
        guideHover: cssVar("--guide-hover") || "rgba(180, 140, 100, 0.25)",
        canvasBg: cssVar("--canvas-bg") || "#e8e8e4",
      };

      const $ = (id) => document.getElementById(id);
      const el = {
        apiKey: $("api-key"),
        toggleConnect: $("toggle-connect-btn"),
        modeToggle: $("mode-toggle-btn"),
        manualSend: $("manual-send-btn"),
        toolBuild: $("tool-build"),
        toolPot: $("tool-pot"),
        toolPlant: $("tool-plant"),
        status: $("status"),
        fps: $("fps-display"),
        prompt: $("prompt"),
        guides: $("guides-toggle"),
        merge: $("merge-toggle"),
        workspace: $("workspace"),
        canvas: $("draw-canvas"),
        draftCanvas: $("draft-canvas"),
        output: $("output-img"),
        placeholder: $("output-placeholder"),
      };
      const ctx = el.canvas.getContext("2d");
      const draftCtx = el.draftCanvas.getContext("2d");

      const boxH = Math.round(el.canvas.height * 0.9);
      const boxW = Math.round(boxH / GOLDEN_RATIO);
      const boxX = Math.round((el.canvas.width - boxW) / 2);
      const boxY = Math.round(el.canvas.height * 0.05);

      // ── Audio Engine ──────────────────────────────────────────────────────

      class AudioEngine {
        constructor() {
          this.ctx = null;
          this.buffers = new Map();
          this.strokeSource = null;
          this.strokeGain = null;
          this.strokeStopTimer = null;
          this.pools = {
            thud: { index: 0, files: ["thud-01.mp3", "thud-02.mp3", "thud-03.mp3", "thud-04.mp3"] },
            grow: { index: 0, files: ["grow-01.mp3", "grow-02.mp3", "grow-03.mp3", "grow-04.mp3", "grow-05.mp3"] },
          };
          Object.values(this.pools).forEach((pool) => shuffle(pool.files));
          [...this.pools.thud.files, ...this.pools.grow.files, "stroke.mp3", "ceramic.mp3", "watering.mp3"].forEach((f) => this.loadBuffer(f));
        }

        initContext() {
          this.ctx ??= new (window.AudioContext || window.webkitAudioContext)();
          if (this.ctx.state === "suspended") this.ctx.resume();
        }

        async fetchAudioData(filename) {
          try {
            if (window.readonlyFS?.getFile) {
              const file = await window.readonlyFS.getFile(`assets/${filename}`);
              return await file.arrayBuffer();
            }
          } catch {}

          try {
            const res = fetch(`./assets/${filename}`);
            const response = await res;
            if (response.ok) return await response.arrayBuffer();
          } catch {}
          return null;
        }

        async loadBuffer(name) {
          try {
            const arrayBuf = await this.fetchAudioData(name);
            if (!arrayBuf) return;
            this.initContext();
            this.buffers.set(name, await this.ctx.decodeAudioData(arrayBuf));
          } catch (e) {
            console.warn(`[Audio] Failed to load ${name}`, e);
          }
        }

        playBuffer(name, onEnded = null) {
          this.initContext();
          const buffer = this.buffers.get(name);
          if (!buffer) return;

          const source = this.ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(this.ctx.destination);
          if (onEnded) source.onended = onEnded;
          source.start(0);
        }

        playFromPool(poolName) {
          const pool = this.pools[poolName];
          const sound = pool.files[pool.index];
          pool.index = (pool.index + 1) % pool.files.length;
          if (pool.index === 0) shuffle(pool.files);
          this.playBuffer(sound);
        }

        startStrokeSound() {
          this.initContext();
          clearTimeout(this.strokeStopTimer);
          this.strokeStopTimer = null;

          if (this.strokeSource) return;
          const buffer = this.buffers.get("stroke.mp3");
          if (!buffer) return;

          const source = this.ctx.createBufferSource();
          source.buffer = buffer;
          source.loop = true;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.7, this.ctx.currentTime + 0.05);

          source.connect(gain);
          gain.connect(this.ctx.destination);
          source.start(0);

          this.strokeSource = source;
          this.strokeGain = gain;
        }

        keepStrokeAlive() {
          this.startStrokeSound();
          clearTimeout(this.strokeStopTimer);
          this.strokeStopTimer = setTimeout(() => this.stopStrokeSound(), 120);
        }

        stopStrokeSound() {
          if (!this.strokeSource) return;
          const source = this.strokeSource;
          const gain = this.strokeGain;
          this.strokeSource = this.strokeGain = null;

          if (this.ctx && gain) {
            gain.gain.setValueAtTime(gain.gain.value, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
            setTimeout(() => {
              try {
                source.stop();
                source.disconnect();
              } catch {}
            }, 90);
          } else {
            try {
              source.stop();
            } catch {}
          }
        }

        playThud() {
          this.playFromPool("thud");
        }

        playGrow() {
          this.playFromPool("grow");
        }

        playPotPlacement() {
          this.playBuffer("ceramic.mp3", () => this.playBuffer("watering.mp3"));
        }
      }

      const audio = new AudioEngine();

      // ── State ─────────────────────────────────────────────────────────────

      const createNode = (x, y, w, h) => ({
        x: Math.round(x),
        y: Math.round(y),
        w: Math.round(w),
        h: Math.round(h),
        splitType: null,
        splitPos: 0,
        left: null,
        right: null,
      });
      const isLeaf = (node) => node.splitType === null;

      let root = createNode(boxX, boxY, boxW, boxH);
      let mouse = { x: -1, y: -1, leaf: null, quad: null };
      let lastMove = { time: 0, x: -1, y: -1 };
      let connection = null;
      let isContinuousMode = false;
      let currentTool = "build";
      let showGuides = false;
      let showDraft = true;
      let streamInterval = null;
      let fpsInterval = null;
      let framesSent = 0;
      let pots = [];
      let potPreview = null;

      // ── Setup ─────────────────────────────────────────────────────────────

      const resetCanvasAndOutput = () => {
        root = createNode(boxX, boxY, boxW, boxH);
        pots = [];
        potPreview = null;
        mouse = { x: -1, y: -1, leaf: null, quad: null };
        el.output.src = "";
        el.output.classList.remove("visible");
        el.placeholder.style.display = "block";
      };

      const updateToolButtonsUI = () => {
        el.toolBuild.classList.toggle("active-toggle", currentTool === "build");
        el.toolPot.classList.toggle("active-toggle", currentTool === "pot");
        el.toolPlant.classList.toggle("active-toggle", currentTool === "plant");
        updateCursorStyle();
      };

      const updateCursorStyle = () => {
        if (currentTool === "build" || currentTool === "pot") {
          el.canvas.style.cursor = "crosshair";
        } else if (currentTool === "plant") {
          const potUnderCursor = mouse.x >= 0 && findPotAt(mouse.x, mouse.y);
          el.canvas.style.cursor = potUnderCursor ? "pointer" : "default";
        }
      };

      const refreshUI = () => {
        updatePrompt();
        render();
        renderDraft();
        updateCursorStyle();
      };

      const clearHoverState = () => {
        mouse.leaf = mouse.quad = null;
        potPreview = null;
        audio.stopStrokeSound();
      };

      const switchTool = (tool) => {
        currentTool = tool;
        updateToolButtonsUI();
        clearHoverState();
        refreshUI();
      };

      const restorePersistedSettings = () => {
        el.apiKey.value = localStorage.getItem(STORAGE.apiKey) ?? "";
        const savedMode = localStorage.getItem(STORAGE.mode);
        if (savedMode === "continuous") {
          isContinuousMode = true;
          el.modeToggle.textContent = "Mode: Auto";
        } else {
          isContinuousMode = false;
          el.modeToggle.textContent = "Mode: Manual";
        }
      };

      const bindEvents = () => {
        window.addEventListener("pointerdown", () => audio.initContext(), { once: true });
        window.addEventListener("keydown", (e) => {
          audio.initContext();
          if (e.key === "p" || e.key === "P") {
            if (document.activeElement?.tagName === "INPUT" || document.activeElement?.tagName === "TEXTAREA") return;
            switchTool("pot");
          }
        });

        el.apiKey.addEventListener("input", () => localStorage.setItem(STORAGE.apiKey, el.apiKey.value.trim()));

        el.toolBuild.addEventListener("click", () => switchTool("build"));
        el.toolPot.addEventListener("click", () => switchTool("pot"));
        el.toolPlant.addEventListener("click", () => switchTool("plant"));

        el.modeToggle.addEventListener("click", () => {
          isContinuousMode = !isContinuousMode;
          el.modeToggle.textContent = isContinuousMode ? "Mode: Auto" : "Mode: Manual";
          localStorage.setItem(STORAGE.mode, isContinuousMode ? "continuous" : "manual");
          applyModeState();
        });

        el.guides.addEventListener("change", () => {
          showGuides = el.guides.checked;
          render();
        });

        el.merge.addEventListener("change", () => {
          el.workspace.classList.toggle("merged", el.merge.checked);
          showDraft = el.merge.checked;
          el.workspace.classList.toggle("show-draft", showDraft);
          renderDraft();
        });

        el.toggleConnect.addEventListener("click", () => {
          if (connection) disconnectRealtime();
          else connectRealtime();
        });

        el.manualSend.addEventListener("click", sendFrame);

        el.canvas.addEventListener("mousemove", (e) => updatePointer(getCanvasCoords(e)));
        el.canvas.addEventListener("mouseleave", () => {
          clearHoverState();
          refreshUI();
        });
        el.canvas.addEventListener("click", (e) => {
          audio.initContext();
          updatePointer(getCanvasCoords(e));
          commitAction(true);
        });

        const onTouch = (e) => {
          e.preventDefault();
          audio.initContext();
          updatePointer(getCanvasCoords(e));
        };
        el.canvas.addEventListener("touchstart", onTouch, { passive: false });
        el.canvas.addEventListener("touchmove", onTouch, { passive: false });
        el.canvas.addEventListener("touchend", () => {
          audio.stopStrokeSound();
          commitAction(false);
        });
      };

      restorePersistedSettings();
      bindEvents();
      applyModeState();
      refreshUI();

      // ── Connection ────────────────────────────────────────────────────────

      function connectRealtime() {
        const apiKey = el.apiKey.value.trim();
        if (!apiKey) {
          alert("Please enter your fal.ai API key in Settings.");
          document.querySelector("details.settings-menu")?.setAttribute("open", "");
          el.apiKey.focus();
          return;
        }

        resetCanvasAndOutput();
        switchTool("build");

        fal.config({ credentials: apiKey });
        setStatus("Connecting...", "generating");

        try {
          connection = fal.realtime.connect(FAL_APP_ID, {
            connectionKey: CONNECTION_KEY,
            throttleInterval: 30,
            onResult: handleResult,
            onError: (err) => {
              console.error("[fal connection error]", err);
              setStatus("Error", "error");
            },
          });

          el.toggleConnect.textContent = "Stop";
          el.toggleConnect.classList.add("active-toggle");
          setStatus("Connected", "connected");
          applyModeState();
        } catch (err) {
          console.error(err);
          setStatus("Failed", "error");
        }
      }

      function disconnectRealtime() {
        stopStream();
        connection?.close?.();
        connection = null;
        el.toggleConnect.textContent = "Start";
        el.toggleConnect.classList.remove("active-toggle");
        el.manualSend.disabled = true;
        setStatus("Disconnected", "disconnected");
      }

      function handleResult(result) {
        if (result?.error || result?.status === "error") {
          console.warn("[fal error]", result);
          setStatus("Result Error", "error");
          return;
        }

        const src = toImageSrc(result?.images?.at(-1));
        if (src) {
          el.output.src = src;
          el.output.classList.add("visible");
          el.placeholder.style.display = "none";
          setStatus("Live", "connected");
        }
      }

      function sendFrame() {
        if (!connection) return;
        if (!isContinuousMode) setStatus("Generating...", "generating");

        try {
          connection.send({
            image_url: captureCanvasJpeg(),
            prompt: el.prompt.value || FALLBACK_PROMPT,
            image_size: "square",
            num_inference_steps: 3,
            enable_interpolation: true,
            seed: 35,
            output_feedback_strength: 1.0,
          });
        } catch (e) {
          console.error("[Send error]", e);
          setStatus("Send Error", "error");
        }
      }

      // ── Modes & Streaming ─────────────────────────────────────────────────

      function applyModeState() {
        el.manualSend.style.display = isContinuousMode ? "none" : "";
        if (isContinuousMode && connection) {
          startStream();
        } else {
          stopStream();
        }
        el.manualSend.disabled = !connection || isContinuousMode;
      }

      function startStream() {
        if (streamInterval) return;

        framesSent = 0;
        fpsInterval = setInterval(() => {
          el.fps.textContent = `(${framesSent} fps)`;
          framesSent = 0;
        }, 1000);

        streamInterval = setInterval(() => {
          if (!connection) return;
          sendFrame();
          framesSent++;
        }, 1000 / STREAM_FPS);
      }

      function stopStream() {
        clearInterval(streamInterval);
        clearInterval(fpsInterval);
        streamInterval = fpsInterval = null;
        el.fps.textContent = "";
      }

      // ── Pointer & Tool Interaction ────────────────────────────────────────

      function updatePointer({ x, y }) {
        const now = performance.now();
        const dt = now - lastMove.time;
        const dist = Math.hypot(x - lastMove.x, y - lastMove.y);

        Object.assign(mouse, { x, y, leaf: null, quad: null });
        potPreview = null;

        if (currentTool === "build") {
          mouse.leaf = findLeaf(root, x, y);
          mouse.quad = mouse.leaf ? getQuadrant(mouse.leaf, x, y) : null;

          if (mouse.leaf && mouse.quad && dt > 0 && dt < 150 && dist / dt > 0.08 && dist >= 3) {
            audio.keepStrokeAlive();
          }
        } else {
          audio.stopStrokeSound();
          if (currentTool === "pot") {
            const leaf = findLeaf(root, x, y);
            if (leaf) potPreview = computePot(leaf, x);
          }
        }

        lastMove = { time: now, x, y };
        refreshUI();
      }

      function commitAction(keepHover) {
        audio.stopStrokeSound();
        if (currentTool === "build") commitSplit(keepHover);
        else if (currentTool === "pot") commitPot(keepHover);
        else if (currentTool === "plant") commitGrow();
      }

      function commitSplit(keepHover) {
        if (!mouse.leaf || !mouse.quad) return;

        splitLeaf(mouse.leaf, mouse.x, mouse.y, mouse.quad);
        audio.playThud();
        mouse.leaf = keepHover ? findLeaf(root, mouse.x, mouse.y) : null;
        mouse.quad = mouse.leaf ? getQuadrant(mouse.leaf, mouse.x, mouse.y) : null;
        refreshUI();
      }

      function commitPot(keepHover) {
        if (!potPreview) return;

        pots.push({ ...potPreview });
        potPreview = null;
        audio.playPotPlacement();
        switchTool("plant");
        if (keepHover) {
          mouse.leaf = findLeaf(root, mouse.x, mouse.y);
          mouse.quad = mouse.leaf ? getQuadrant(mouse.leaf, mouse.x, mouse.y) : null;
        }
        refreshUI();
      }

      function commitGrow() {
        const pot = findPotAt(mouse.x, mouse.y);
        if (!pot) return;

        const rimY = pot.baseY - pot.h;
        const maxDown = el.canvas.height - rimY + 10;

        if (pot.upSteps < 2) {
          pot.upSteps++;
        } else if (pot.downLen < maxDown) {
          pot.downLen = Math.min(pot.downLen + 100, maxDown);
        } else {
          return;
        }

        audio.playGrow();
        refreshUI();
      }

      function splitLeaf(leaf, px, py, quad) {
        if (quad === "N" || quad === "S") {
          const splitX = clamp(Math.round(px), leaf.x + MIN_SIZE, leaf.x + leaf.w - MIN_SIZE);
          Object.assign(leaf, {
            splitType: "v",
            splitPos: splitX,
            left: createNode(leaf.x, leaf.y, splitX - leaf.x, leaf.h),
            right: createNode(splitX, leaf.y, leaf.x + leaf.w - splitX, leaf.h),
          });
        } else {
          const splitY = clamp(Math.round(py), leaf.y + MIN_SIZE, leaf.y + leaf.h - MIN_SIZE);
          Object.assign(leaf, {
            splitType: "h",
            splitPos: splitY,
            left: createNode(leaf.x, leaf.y, leaf.w, splitY - leaf.y),
            right: createNode(leaf.x, splitY, leaf.w, leaf.y + leaf.h - splitY),
          });
        }
      }

      // ── Pots & Plants ─────────────────────────────────────────────────────

      function computePot(leaf, x) {
        const topW = clamp(Math.round(leaf.w * 0.45), 26, 78);
        return {
          cx: clamp(Math.round(x), leaf.x + topW / 2 + 2, leaf.x + leaf.w - topW / 2 - 2),
          baseY: leaf.y + leaf.h - 2,
          topW,
          botW: Math.round(topW * 0.65),
          h: Math.round(topW * 0.75),
          upSteps: 0,
          downLen: 0,
        };
      }

      const findPotAt = (x, y) => pots.find((p) => Math.abs(x - p.cx) <= p.topW / 2 && y >= p.baseY - p.h && y <= p.baseY) ?? null;

      function drawPot(target, { cx, baseY, topW, botW, h }, alpha = 1) {
        target.save();
        target.globalAlpha = alpha;
        target.beginPath();
        target.moveTo(cx - topW / 2, baseY - h);
        target.lineTo(cx + topW / 2, baseY - h);
        target.lineTo(cx + botW / 2, baseY);
        target.lineTo(cx - botW / 2, baseY);
        target.closePath();
        target.fillStyle = "#ffffff";
        target.fill();
        target.lineWidth = 2;
        target.strokeStyle = "rgba(0,0,0,0.35)";
        target.stroke();
        target.restore();
      }

      function drawPlant(target, pot) {
        const rimY = pot.baseY - pot.h;
        target.save();
        target.fillStyle = "rgba(85, 165, 75, 0.45)";
        target.strokeStyle = "rgba(45, 120, 50, 0.5)";
        target.lineWidth = 2;

        if (pot.upSteps > 0) {
          // Dome-shaped canopy: a wide half-ellipse resting on the pot rim,
          // slightly wider than tall, like a natural pothos mound.
          const domeW = pot.topW * 0.7 + pot.upSteps * 66;
          const domeH = pot.upSteps * 60;
          target.beginPath();
          target.ellipse(pot.cx, rimY, domeW / 2, domeH, 0, Math.PI, 0, false);
          target.closePath();
          target.fill();
          target.stroke();
        }

        if (pot.downLen > 0) {
          // Downward-pointing triangle: grows in width as it grows in length.
          const w = Math.max(20, pot.topW * 0.5) + pot.downLen * 0.25;
          target.beginPath();
          target.moveTo(pot.cx - w / 2, rimY);
          target.lineTo(pot.cx + w / 2, rimY);
          target.lineTo(pot.cx, rimY + pot.downLen);
          target.closePath();
          target.fill();
          target.stroke();
        }

        target.restore();
      }

      // ── Prompt ────────────────────────────────────────────────────────────

      function countDividers(node) {
        let horizontal = 0;
        let vertical = 0;

        const traverse = (n) => {
          if (!n || isLeaf(n)) return;
          n.splitType === "h" ? horizontal++ : vertical++;
          traverse(n.left);
          traverse(n.right);
        };
        traverse(node);

        if (currentTool === "build" && mouse.leaf && mouse.quad) {
          mouse.quad === "N" || mouse.quad === "S" ? vertical++ : horizontal++;
        }

        return { horizontal, vertical };
      }

      function updatePrompt() {
        const { horizontal, vertical } = countDividers(root);
        const plantCount = pots.filter((p) => p.upSteps > 0 || p.downLen > 0).length;
        const trailingCount = pots.filter((p) => p.downLen > 0).length;
        const maxDrape = pots.reduce((m, p) => Math.max(m, p.downLen), 0);
        el.prompt.value = generateShelfPrompt(horizontal, vertical, pots.length, plantCount, trailingCount, maxDrape / el.canvas.height);
      }

      function generateShelfPrompt(M, N, potCount = 0, plantCount = 0, trailingCount = 0, drapeRatio = 0) {
        const pluralRules = new Intl.PluralRules("en-US");
        const numberWords = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
        const numWord = (n) => numberWords[n] ?? String(n);
        const pluralize = (count, singular, plural = `${singular}s`) => (pluralRules.select(count) === "one" ? singular : plural);
        const isAre = (count) => pluralize(count, "is", "are");

        const drapeLengthText = (r, count) => {
          const vineNoun = pluralize(count, "vine");
          if (r < 0.15) return `the ${vineNoun} just beginning to spill over the pot ${pluralize(count, "rim")}`;
          if (r < 0.35) return `the ${vineNoun} trailing a short way down the front of the shelf`;
          if (r < 0.6) return `long ${vineNoun} cascading well down over the shelf ${pluralize(count, "front")}`;
          return `very long ${vineNoun} cascading dramatically almost to the bottom of the unit`;
        };

        const formatPlantText = (pots, plants, trailing, ratio) => {
          if (pots <= 0) return "";

          const potNoun = pluralize(pots, "white ceramic plant pot");
          const emptyCount = pots - plants;

          let sentence;
          if (plants === 0) {
            sentence = ` There ${isAre(pots)} exactly ${numWord(pots)} empty ${potNoun} placed neatly within the unit.`;
          } else if (emptyCount > 0) {
            sentence =
              ` There ${isAre(pots)} exactly ${numWord(pots)} ${potNoun} placed neatly within the unit:` +
              ` ${numWord(plants)} of them ${pluralize(plants, "contains", "contain")} a lush green pothos plant` +
              ` with heart-shaped variegated leaves, and ${numWord(emptyCount)}` +
              ` ${isAre(emptyCount)} completely empty.`;
          } else {
            sentence =
              ` There ${isAre(pots)} exactly ${numWord(pots)} ${potNoun} placed neatly within the unit,` +
              ` ${pluralize(pots, "and it contains", "each containing")} a lush green pothos plant` +
              ` with glossy heart-shaped leaves in vibrant shades of green.`;
          }

          if (trailing > 0 && plants > 0) {
            const trailingClamped = Math.min(trailing, plants);
            const which =
              plants === 1
                ? "The single pothos plant"
                : trailingClamped === plants
                  ? `Every one of the ${numWord(plants)} pothos plants`
                  : trailingClamped === 1
                    ? `Exactly one of the ${numWord(plants)} pothos plants`
                    : `Exactly ${numWord(trailingClamped)} of the ${numWord(plants)} pothos plants`;
            const hasHave = trailingClamped === 1 || plants === 1 ? "has" : "have";

            sentence +=
              ` ${which} ${hasHave} trailing vines draping downward over the ${pluralize(trailingClamped, "rim")}` +
              ` of the ${pluralize(trailingClamped, "pot")}, hanging freely down the face of the shelf,` +
              ` with ${drapeLengthText(ratio, trailingClamped)},` +
              ` leaves overlapping the wooden edges and casting soft shadows.`;

            const upright = plants - trailingClamped;
            if (upright > 0) {
              sentence +=
                ` The remaining ${numWord(upright)} ${pluralize(upright, "plant grows", "plants grow")}` +
                ` compactly upright inside ${pluralize(upright, "its pot", "their pots")}.`;
            }
          }

          return sentence;
        };

        const plantDesc = formatPlantText(potCount, plantCount, trailingCount, drapeRatio);

        if (M + N > 3) {
          return `A direct front-facing product photograph of a modern minimalist wooden wall shelf and organizer. Transform each line into light-toned natural oak/birch plywood dividers and shelves with visible subtle wood grain. The compartments have realistic 3D depth, with soft natural sunlight coming from the upper right, casting gentle directional shadows inside the cubbies.${plantDesc} Clean Scandinavian aesthetic, straight-on orthographic view, ultra-realistic, neutral studio lighting against a soft off-white wall.`;
        }

        const formatDividerText = (count, type) =>
          count === 0 ? `no ${type} dividers` : count === 1 ? `exactly one ${type} divider` : `exactly ${numWord(count)} ${type} dividers`;

        const structureDesc =
          M === 0 && N === 0
            ? "The interior is a completely hollow open-box space with no dividers or partitions"
            : `The layout features ${formatDividerText(M, "horizontal")} and ${formatDividerText(N, "vertical")}`;

        const shadowTarget = M === 0 && N === 0 ? "across the interior backing panel" : "inside the cubbies";

        return `A direct front-facing product photograph of a modern minimalist wooden wall shelf and organizer. ${structureDesc}, constructed from light-toned natural oak/birch plywood with visible subtle wood grain. The entire unit is backed by a smooth, single continuous wood backing panel. The shelf has realistic 3D depth, with soft natural sunlight coming from the upper right, casting gentle directional shadows ${shadowTarget}.${plantDesc} Clean Scandinavian aesthetic, straight-on orthographic view, ultra-realistic, neutral studio lighting against a soft off-white wall.`;
      }

      // ── Rendering ─────────────────────────────────────────────────────────

      function render() {
        ctx.fillStyle = THEME.canvasBg;
        ctx.fillRect(0, 0, el.canvas.width, el.canvas.height);

        fillLeafAreas(root);
        if (showGuides && currentTool === "build") drawGuides(root);

        ctx.strokeStyle = THEME.lightWood;
        ctx.lineWidth = 6;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.rect(root.x + 0.5, root.y + 0.5, root.w - 1, root.h - 1);
        traceStructureLines(root);
        if (currentTool === "build") traceSplitLine(ctx);
        ctx.stroke();

        pots.forEach((p) => drawPot(ctx, p, 1));
        pots.filter((p) => p.upSteps > 0 || p.downLen > 0).forEach((p) => drawPlant(ctx, p));
        if (currentTool === "pot" && potPreview) drawPot(ctx, potPreview, 0.5);
      }

      function renderDraft() {
        draftCtx.clearRect(0, 0, el.draftCanvas.width, el.draftCanvas.height);
        if (!showDraft) return;

        draftCtx.save();
        draftCtx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        draftCtx.lineWidth = 4;
        draftCtx.setLineDash([12, 8]);

        if (currentTool === "build" && mouse.leaf && mouse.quad) {
          draftCtx.beginPath();
          traceSplitLine(draftCtx);
          draftCtx.stroke();
        } else if (currentTool === "pot" && potPreview) {
          const { cx, baseY, topW, h } = potPreview;
          draftCtx.beginPath();
          draftCtx.rect(Math.round(cx - topW / 2) + 0.5, Math.round(baseY - h) + 0.5, topW, h);
          draftCtx.stroke();
        }

        draftCtx.restore();
      }

      function traceSplitLine(target) {
        const leaf = mouse.leaf;
        if (!leaf || !mouse.quad) return;

        if (mouse.quad === "N" || mouse.quad === "S") {
          const splitX = clamp(Math.round(mouse.x), leaf.x + MIN_SIZE, leaf.x + leaf.w - MIN_SIZE);
          target.moveTo(splitX + 0.5, leaf.y);
          target.lineTo(splitX + 0.5, leaf.y + leaf.h);
        } else {
          const splitY = clamp(Math.round(mouse.y), leaf.y + MIN_SIZE, leaf.y + leaf.h - MIN_SIZE);
          target.moveTo(leaf.x, splitY + 0.5);
          target.lineTo(leaf.x + leaf.w, splitY + 0.5);
        }
      }

      function fillLeafAreas(node) {
        if (isLeaf(node)) {
          ctx.fillStyle = THEME.darkWood;
          ctx.fillRect(node.x, node.y, node.w, node.h);
        } else {
          fillLeafAreas(node.left);
          fillLeafAreas(node.right);
        }
      }

      function drawGuides(node) {
        if (!isLeaf(node)) {
          drawGuides(node.left);
          drawGuides(node.right);
          return;
        }

        const { x, y, w, h } = node;

        if (node === mouse.leaf && mouse.quad) {
          ctx.fillStyle = THEME.guideHover;
          ctx.fill(getTrianglePath(node, mouse.quad));
        }

        ctx.strokeStyle = THEME.guideDash;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(x + 0.5, y + 0.5);
        ctx.lineTo(x + w - 0.5, y + h - 0.5);
        ctx.moveTo(x + w - 0.5, y + 0.5);
        ctx.lineTo(x + 0.5, y + h - 0.5);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function traceStructureLines(node) {
        if (isLeaf(node)) return;

        if (node.splitType === "v") {
          ctx.moveTo(node.splitPos + 0.5, node.y);
          ctx.lineTo(node.splitPos + 0.5, node.y + node.h);
        } else {
          ctx.moveTo(node.x, node.splitPos + 0.5);
          ctx.lineTo(node.x + node.w, node.splitPos + 0.5);
        }
        traceStructureLines(node.left);
        traceStructureLines(node.right);
      }

      // ── Pure Helpers ──────────────────────────────────────────────────────

      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      }

      function findLeaf(node, x, y) {
        if (!node || x < node.x || x >= node.x + node.w || y < node.y || y >= node.y + node.h) return null;
        if (isLeaf(node)) return node;

        const goLeft = node.splitType === "v" ? x < node.splitPos : y < node.splitPos;
        return findLeaf(goLeft ? node.left : node.right, x, y);
      }

      function getQuadrant(node, px, py) {
        const nx = (px - (node.x + node.w / 2)) / node.w;
        const ny = (py - (node.y + node.h / 2)) / node.h;
        return Math.abs(ny) > Math.abs(nx) ? (ny < 0 ? "N" : "S") : nx > 0 ? "E" : "W";
      }

      function getTrianglePath({ x, y, w, h }, quad) {
        const corners = {
          N: [
            [x, y],
            [x + w, y],
          ],
          S: [
            [x, y + h],
            [x + w, y + h],
          ],
          W: [
            [x, y],
            [x, y + h],
          ],
          E: [
            [x + w, y],
            [x + w, y + h],
          ],
        };

        const path = new Path2D();
        path.moveTo(x + w / 2, y + h / 2);
        corners[quad].forEach(([cx, cy]) => path.lineTo(cx, cy));
        path.closePath();
        return path;
      }

      function getCanvasCoords(e) {
        const rect = el.canvas.getBoundingClientRect();
        const point = e.touches?.[0] ?? e;
        return {
          x: Math.round(((point.clientX - rect.left) * el.canvas.width) / rect.width),
          y: Math.round(((point.clientY - rect.top) * el.canvas.height) / rect.height),
        };
      }

      const offscreen = Object.assign(document.createElement("canvas"), { width: CAPTURE_SIZE, height: CAPTURE_SIZE });
      const offCtx = offscreen.getContext("2d");

      function captureCanvasJpeg() {
        offCtx.fillStyle = "#fff";
        offCtx.fillRect(0, 0, CAPTURE_SIZE, CAPTURE_SIZE);
        offCtx.drawImage(el.canvas, 0, 0, CAPTURE_SIZE, CAPTURE_SIZE);
        return offscreen.toDataURL("image/jpeg", 0.5);
      }

      function toImageSrc(img) {
        if (!img) return null;

        const mime = img.content_type ?? "image/jpeg";
        const { content } = img;

        if (typeof content === "string") {
          return content.startsWith("data:") ? content : `data:${mime};base64,${content}`;
        }

        if (content instanceof Uint8Array || content instanceof ArrayBuffer) {
          const bytes = content instanceof Uint8Array ? content : new Uint8Array(content);
          let binary = "";
          for (let i = 0; i < bytes.length; i += 0x8000) {
            binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
          }
          return `data:${mime};base64,${btoa(binary)}`;
        }

        return null;
      }

      function setStatus(text, type) {
        el.status.textContent = text;
        el.status.className = `status-pill ${type}`;
      }
    </script>
  </body>
</html>
