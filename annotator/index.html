<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Annotator</title>
    <style>
      body {
        font-family: monospace;
        margin: 20px;
        max-width: 800px;
      }
      #editor {
        border: 1px solid #888;
        padding: 10px;
        min-height: 120px;
      }
      .ProseMirror {
        outline: none;
        white-space: pre-wrap;
      }
      span.staged {
        text-decoration: underline dotted 1px;
      }
      span.anno {
        text-decoration: underline solid 1px;
      }
      .panel {
        border: 1px solid #888;
        margin-top: 12px;
        padding: 8px;
      }
      .panel h3 {
        margin: 0 0 6px 0;
        font-size: 14px;
      }
      .seg,
      .annoRow {
        margin: 4px 0;
      }
      button {
        font-family: monospace;
      }
      input.comment {
        font-family: monospace;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <div class="panel" id="stagePanel">
      <h3>Staged segments: <span id="stageCount">0</span> <button id="commitBtn">Commit</button> <button id="clearBtn">Clear</button></h3>
      <div id="stageList"></div>
    </div>
    <div class="panel">
      <h3>Annotations</h3>
      <div id="annoList"></div>
    </div>

    <script type="module">
      import { EditorState, TextSelection } from "https://esm.sh/prosemirror-state";
      import { EditorView } from "https://esm.sh/prosemirror-view";
      import { Schema, DOMParser } from "https://esm.sh/prosemirror-model";
      import { schema as basic } from "https://esm.sh/prosemirror-schema-basic";
      import { history, undo, redo } from "https://esm.sh/prosemirror-history";
      import { keymap } from "https://esm.sh/prosemirror-keymap";
      import { baseKeymap } from "https://esm.sh/prosemirror-commands";

      const schema = new Schema({
        nodes: basic.spec.nodes,
        marks: basic.spec.marks.append({
          staged: {
            inclusive: false,
            parseDOM: [{ tag: "span.staged" }],
            toDOM: () => ["span", { class: "staged" }, 0],
          },
          anno: {
            inclusive: false,
            attrs: { id: {} },
            parseDOM: [{ tag: "span.anno", getAttrs: (d) => ({ id: d.getAttribute("data-id") }) }],
            toDOM: (m) => ["span", { class: "anno", "data-id": m.attrs.id }, 0],
          },
        }),
      });

      const comments = new Map(); // id -> comment text (independent of doc history)

      const doc = schema.node("doc", null, [
        schema.node("paragraph", null, [
          schema.text("Select text normally, or hold Ctrl/Cmd while selecting to stage multiple disjoint segments. Then commit them as an annotation."),
        ]),
      ]);

      let modHeld = false;

      const view = new EditorView(document.getElementById("editor"), {
        state: EditorState.create({
          doc,
          plugins: [history(), keymap({ "Mod-z": undo, "Mod-y": redo, "Mod-Shift-z": redo }), keymap(baseKeymap)],
        }),
        handleDOMEvents: {
          mousedown: (v, e) => {
            modHeld = e.metaKey || e.ctrlKey;
            return false;
          },
          mouseup: (v, e) => {
            const wasMod = e.metaKey || e.ctrlKey || modHeld;
            setTimeout(() => {
              const { from, to, empty } = v.state.selection;
              if (empty) return;
              const st = schema.marks.staged;
              let tr = v.state.tr;
              if (wasMod) {
                if (v.state.doc.rangeHasMark(from, to, st) && rangeFullyStaged(v.state, from, to)) return;
                tr.addMark(from, to, st.create());
              } else {
                tr.removeMark(0, v.state.doc.content.size, st);
                tr.addMark(from, to, st.create());
              }
              if (tr.docChanged || tr.steps.length) v.dispatch(tr);
            }, 0);
            return false;
          },
        },
        dispatchTransaction(tr) {
          view.updateState(view.state.apply(tr));
          renderPanels();
        },
      });

      function rangeFullyStaged(state, from, to) {
        let ok = true;
        state.doc.nodesBetween(from, to, (node, pos) => {
          if (node.isText) {
            if (!schema.marks.staged.isInSet(node.marks)) ok = false;
          }
        });
        return ok;
      }

      function collectRanges(markType, matchAttrs) {
        const ranges = [];
        view.state.doc.descendants((node, pos) => {
          if (!node.isText) return;
          const m = node.marks.find((m) => m.type === markType && (!matchAttrs || m.attrs.id === matchAttrs.id));
          if (m) {
            const last = ranges[ranges.length - 1];
            if (last && last.to === pos && (!last.id || last.id === m.attrs.id)) last.to = pos + node.nodeSize;
            else ranges.push({ from: pos, to: pos + node.nodeSize, id: m.attrs ? m.attrs.id : null });
          }
        });
        return ranges;
      }

      function stagedRanges() {
        return collectRanges(schema.marks.staged);
      }

      function annotations() {
        const map = new Map(); // id -> ranges
        view.state.doc.descendants((node, pos) => {
          if (!node.isText) return;
          for (const m of node.marks)
            if (m.type === schema.marks.anno) {
              const arr = map.get(m.attrs.id) || [];
              const last = arr[arr.length - 1];
              if (last && last.to === pos) last.to = pos + node.nodeSize;
              else arr.push({ from: pos, to: pos + node.nodeSize });
              map.set(m.attrs.id, arr);
            }
        });
        return map;
      }

      // ---- Actions ----
      document.getElementById("clearBtn").onclick = () => {
        const tr = view.state.tr.removeMark(0, view.state.doc.content.size, schema.marks.staged);
        view.dispatch(tr);
      };

      document.getElementById("commitBtn").onclick = () => {
        const ranges = stagedRanges();
        if (!ranges.length) return;
        const id = "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        comments.set(id, "");
        let tr = view.state.tr;
        for (const r of ranges) {
          tr.removeMark(r.from, r.to, schema.marks.staged);
          tr.addMark(r.from, r.to, schema.marks.anno.create({ id }));
        }
        view.dispatch(tr);
      };

      function deleteAnno(id) {
        let tr = view.state.tr;
        const rs = annotations().get(id) || [];
        for (const r of rs) tr.removeMark(r.from, r.to, schema.marks.anno);
        view.dispatch(tr);
      }

      // ---- Panels ----
      let lastAnnoSig = null;

      function renderPanels() {
        const ranges = stagedRanges();
        document.getElementById("stageCount").textContent = ranges.length;
        const sl = document.getElementById("stageList");
        sl.innerHTML = "";
        for (const r of ranges) {
          const d = document.createElement("div");
          d.className = "seg";
          d.textContent = `[${r.from}, ${r.to}] "${view.state.doc.textBetween(r.from, r.to, " ")}"`;
          sl.appendChild(d);
        }

        const annos = annotations();
        const sig = JSON.stringify([...annos.entries()]);
        const al = document.getElementById("annoList");
        const focused = document.activeElement && al.contains(document.activeElement);
        if (sig === lastAnnoSig && focused) return; // don't destroy focused input
        lastAnnoSig = sig;
        al.innerHTML = "";
        for (const [id, rs] of annos) {
          const row = document.createElement("div");
          row.className = "annoRow";
          const label = document.createElement("span");
          label.textContent = rs.map((r) => `[${r.from},${r.to}] "${view.state.doc.textBetween(r.from, r.to, " ")}"`).join(" + ") + " ";
          const input = document.createElement("input");
          input.className = "comment";
          input.placeholder = "comment (optional)";
          input.value = comments.get(id) || "";
          input.oninput = () => comments.set(id, input.value);
          const del = document.createElement("button");
          del.textContent = "Delete";
          del.onclick = () => deleteAnno(id);
          row.append(label, input, document.createTextNode(" "), del);
          al.appendChild(row);
        }
      }
      renderPanels();
    </script>
  </body>
</html>
