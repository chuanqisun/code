<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hand puppet prototype</title>
    <style>
      :root {
        --fg: #000;
        --bg: #fff;
        --stage: #000;
        --overlay: rgb(255 255 255 / 0.92);
        --border: 1px solid var(--fg);
        --font: 12px monospace;
        --gap: 12px;
        --gap-sm: 8px;
        --menu-width: 280px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        color: var(--fg);
        background: var(--stage);
        font: var(--font);
      }

      button,
      select,
      input {
        font: inherit;
        accent-color: var(--fg);
      }

      button,
      select {
        color: var(--fg);
        background: var(--bg);
        border: var(--border);
        padding: 5px;
      }

      button {
        cursor: pointer;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      video {
        display: none;
      }

      #menuButton {
        position: fixed;
        top: var(--gap);
        right: var(--gap);
        z-index: 2;
        opacity: 0.6;

        &:hover,
        &[aria-expanded="true"] {
          opacity: 1;
        }
      }

      #menu {
        position: fixed;
        inset: 0 0 0 auto;
        z-index: 1;
        width: var(--menu-width);
        max-width: 100vw;
        overflow-y: auto;
        padding: 52px var(--gap) var(--gap);
        background: var(--overlay);
        border-left: var(--border);

        &[hidden] {
          display: none;
        }

        header {
          display: flex;
          flex-wrap: wrap;
          gap: var(--gap-sm);
          margin-bottom: var(--gap);
        }

        fieldset {
          margin: 0 0 var(--gap);
          border: var(--border);
          padding: 10px;

          p {
            margin: var(--gap-sm) 0;
          }
        }
      }

      .setting {
        display: block;
        margin-bottom: var(--gap);

        span {
          display: flex;
          justify-content: space-between;
          gap: var(--gap-sm);
        }

        input {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <video id="video" autoplay playsinline muted></video>

    <button id="menuButton" aria-controls="menu" aria-expanded="false">Menu</button>

    <aside id="menu" hidden>
      <header>
        <button id="cameraButton">Enable camera</button>
        <select id="cameraSelect" aria-label="Camera" disabled>
          <option>Camera source</option>
        </select>
        <button id="resetButton">Reset puppets</button>
        <button id="calibrateButton" disabled>Recalibrate neutral</button>
      </header>

      <fieldset id="tracking">
        <legend>Tracking</legend>
        <label><input id="debugMode" type="checkbox" /> Debug</label>
        <p>
          <label><input id="showStrings" type="checkbox" checked /> Strings</label>
        </p>
      </fieldset>

      <fieldset id="physics">
        <legend>Physics</legend>
      </fieldset>

      <fieldset>
        <legend>Debug</legend>
        <div id="stats">Manual input</div>
      </fieldset>
    </aside>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const canvas = $("canvas");
      const ctx = canvas.getContext("2d");
      const video = $("video");

      const WIDTH = 1000;
      const HEIGHT = 760;
      const FLOOR = 682;
      const WALL_MARGIN = 40;
      const TIME_STEP = 1 / 120;
      const MAX_STEPS_PER_FRAME = 6;
      const GRAVITY = 1050;

      const FINGER_TIPS = [4, 8, 12, 16, 20];
      const ROPE_ATTACHMENTS = [7, 11, 0, 12, 8];
      const CENTER_ROPE = 2;

      const DESIGN_POSE = [
        [500, 377],
        [500, 415],
        [500, 505],
        [472, 415],
        [528, 415],
        [442, 455],
        [558, 455],
        [420, 497],
        [580, 497],
        [475, 555],
        [525, 555],
        [458, 610],
        [542, 610],
      ];

      const FOOT_RADIUS = 5;
      const POSE_DROP = FLOOR - FOOT_RADIUS - Math.max(...DESIGN_POSE.map(([, y]) => y));
      const INITIAL_POSE = DESIGN_POSE.map(([x, y]) => ({ x, y: y + POSE_DROP }));

      const SHOULDER_ANCHOR = { x: 270, y: 195 + POSE_DROP };
      const LIMB_ROPE_LENGTH = dist(INITIAL_POSE[7], SHOULDER_ANCHOR);
      const KNEE_ANCHOR_Y = Math.round(INITIAL_POSE[11].y - Math.sqrt(LIMB_ROPE_LENGTH ** 2 - (INITIAL_POSE[11].x - 385) ** 2));

      const BASE_ANCHORS = [
        SHOULDER_ANCHOR,
        { x: 385, y: KNEE_ANCHOR_Y },
        { x: 500, y: 130 + POSE_DROP },
        { x: 615, y: KNEE_ANCHOR_Y },
        { x: 730, y: 195 + POSE_DROP },
      ];

      const VISIBLE_BONES = [
        [1, 2],
        [3, 4],
        [3, 5],
        [5, 7],
        [4, 6],
        [6, 8],
        [2, 9],
        [9, 11],
        [2, 10],
        [10, 12],
      ];
      const BONE_PAIRS = [
        [0, 1],
        [1, 3],
        [1, 4],
        [3, 4],
        [1, 2],
        [3, 2],
        [4, 2],
        [3, 5],
        [5, 7],
        [4, 6],
        [6, 8],
        [2, 9],
        [9, 11],
        [2, 10],
        [10, 12],
      ];
      const COLLISION_SEGMENTS = [[0, 1], ...VISIBLE_BONES];
      const HAND_CONNECTIONS = [
        [0, 1],
        [1, 2],
        [2, 3],
        [3, 4],
        [0, 5],
        [5, 6],
        [6, 7],
        [7, 8],
        [5, 9],
        [9, 10],
        [10, 11],
        [11, 12],
        [9, 13],
        [13, 14],
        [14, 15],
        [15, 16],
        [13, 17],
        [0, 17],
        [17, 18],
        [18, 19],
        [19, 20],
      ];

      const HEAD_RADIUS = 24;
      const BONE_RADIUS = 3;
      const collisionRadius = (i) => (i === 0 ? HEAD_RADIUS : 6);
      const boundsRadius = (i) => (i === 0 ? HEAD_RADIUS : FOOT_RADIUS);

      const ANCHOR_BOUNDS = { minX: 65, maxX: 935, minY: 75, maxY: 480 };
      const DRAG_BOUNDS = { ...ANCHOR_BOUNDS, minX: 60, maxX: 940 };
      const HAND_SCALE = { x: 800, y: 640 };
      const DRAG_PICK_RADIUS = 35;
      const HAND_LOST_MS = 500;
      const HAND_REACQUIRE_MS = 650;

      // Play mode lifts anchors off-screen visually; physics is unaffected.
      const ANCHOR_RENDER_LIFT = 500;
      const PLAY_COLORS = ["hsl(330 100% 80%)", "hsl(200 100% 80%)"];
      const DEBUG_THEME = { ink: "#000", paper: "#fff", lift: 0 };

      const PUPPET_OFFSETS = [-220, 220];
      const CAMERA_STORAGE_KEY = "puppet_camera";
      const MEDIAPIPE_VERSION = "0.10.32";
      const MEDIAPIPE_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MEDIAPIPE_VERSION}`;
      const HAND_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
      const VIDEO_CONSTRAINTS = { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60, max: 60 } };

      const fixed =
        (digits, unit = "") =>
        (v) =>
          `${v.toFixed(digits)}${unit}`;

      const SLIDERS = {
        tracking: [
          { key: "sensitivity", label: "Hand sensitivity", min: 0.4, max: 2.5, step: 0.1, value: 1, fmt: fixed(1, "×") },
          { key: "filterBeta", label: "1€ filter beta", min: 0.1, max: 25, step: 0.5, value: 10, fmt: fixed(1) },
          { key: "filterCutoff", label: "1€ min cutoff", min: 0.1, max: 5, step: 0.1, value: 1, fmt: fixed(1, " Hz") },
        ],
        physics: [
          { key: "gravity", label: "Gravity scale", min: 0.2, max: 2.5, step: 0.1, value: 2, fmt: fixed(1, "×") },
          { key: "damping", label: "Velocity retention", min: 0.88, max: 0.995, step: 0.005, value: 0.98, fmt: fixed(3) },
          { key: "anchorFollow", label: "Anchor follow speed", min: 4, max: 60, step: 1, value: 45, fmt: fixed(0, " /s") },
          { key: "pullStiff", label: "Rope pull stiffness", min: 0.2, max: 1, step: 0.05, value: 1, fmt: fixed(2) },
          { key: "iterations", label: "Solver iterations", min: 4, max: 24, step: 1, value: 16, fmt: fixed(0) },
          { key: "torsoMass", label: "Torso lightness", min: 0.4, max: 1.2, step: 0.05, value: 1, fmt: fixed(2) },
        ],
      };

      const params = Object.fromEntries(
        Object.values(SLIDERS)
          .flat()
          .map(({ key, value }) => [key, value]),
      );

      const puppets = PUPPET_OFFSETS.map((offsetX) => ({
        offsetX,
        particles: [],
        bones: [],
        ropes: [],
        anchors: BASE_ANCHORS.map(() => ({})),
        filters: null,
        landmarks: null,
        neutralPose: null,
        isTracked: false,
        lastSeenTime: -Infinity,
      }));

      let model = null;
      let modelPromise = null;
      let stream = null;
      let isCameraActive = false;
      let isBusy = false;
      let lastVideoTime = -1;
      let inferenceMs = 0;
      let inferenceCount = 0;
      let dragged = null;
      let activePointerId = null;
      let previousTime = performance.now();
      let accumulator = 0;
      let lastStatsTime = previousTime;

      function mainLoop(now) {
        const elapsed = Math.min((now - previousTime) / 1000, 0.05);
        previousTime = now;

        processCameraFrame(now);
        puppets.forEach(updateAnchorTargets);

        accumulator += elapsed;
        let steps = 0;
        for (; accumulator >= TIME_STEP && steps < MAX_STEPS_PER_FRAME; steps++) {
          stepPhysics(TIME_STEP);
          accumulator -= TIME_STEP;
        }
        if (steps === MAX_STEPS_PER_FRAME) accumulator = 0;

        render();
        updateStats(now);
        requestAnimationFrame(mainLoop);
      }

      // ---------- Puppet state ----------

      const baseAnchor = (pp, i) => ({ x: BASE_ANCHORS[i].x + pp.offsetX, y: BASE_ANCHORS[i].y });

      const resetAnchorTargets = (pp) =>
        pp.anchors.forEach((a, i) => {
          const { x, y } = baseAnchor(pp, i);
          Object.assign(a, { tx: x, ty: y });
        });

      function resetPuppets() {
        for (const pp of puppets) {
          pp.filters ??= Array.from({ length: 21 }, () => ({ x: new OneEuroFilter(), y: new OneEuroFilter() }));
          pp.particles = INITIAL_POSE.map(({ x, y }) => ({ x: x + pp.offsetX, y, px: x + pp.offsetX, py: y, invMass: 1 }));
          pp.bones = BONE_PAIRS.map(([a, b]) => ({ a, b, length: dist(pp.particles[a], pp.particles[b]) }));
          pp.ropes = ROPE_ATTACHMENTS.map((part, i) => ({
            part,
            length: i === CENTER_ROPE ? dist(INITIAL_POSE[part], BASE_ANCHORS[i]) : LIMB_ROPE_LENGTH,
            tension: 0,
            slack: 0,
          }));
          pp.anchors.forEach((a, i) => Object.assign(a, baseAnchor(pp, i)));
          resetAnchorTargets(pp);
          if (isCameraActive && pp.isTracked) calibrateNeutral(pp);
        }
        updateParticleMasses();
      }

      function updateParticleMasses() {
        const shoulderMass = Math.min(1, params.torsoMass + 0.15);
        for (const { particles } of puppets) {
          particles.forEach((p, i) => (p.invMass = i === 2 ? params.torsoMass : i <= 4 ? shoulderMass : 1));
        }
      }

      function updateAnchorTargets(pp) {
        if (!isCameraActive) return;
        if (!pp.isTracked || !pp.neutralPose) return resetAnchorTargets(pp);

        FINGER_TIPS.forEach((tip, i) => {
          const { x, y } = pp.landmarks[tip];
          const neutral = pp.neutralPose[i];
          pp.anchors[i].tx = clamp(BASE_ANCHORS[i].x + (x - neutral.x) * HAND_SCALE.x * params.sensitivity, ANCHOR_BOUNDS.minX, ANCHOR_BOUNDS.maxX);
          pp.anchors[i].ty = clamp(BASE_ANCHORS[i].y + (y - neutral.y) * HAND_SCALE.y * params.sensitivity, ANCHOR_BOUNDS.minY, ANCHOR_BOUNDS.maxY);
        });
      }

      // ---------- Physics ----------

      function stepPhysics(dt) {
        const blend = 1 - Math.exp(-params.anchorFollow * dt);
        const isHeld = (pp) => !isCameraActive || pp.isTracked;

        for (const pp of puppets) {
          followAnchors(pp, blend);
          integrate(pp.particles, dt);
          updateRopeSlack(pp, isHeld(pp), dt);
        }

        for (let iter = 0; iter < params.iterations; iter++) {
          for (const pp of puppets) {
            solveBones(pp);
            solveRopes(pp);
          }
          for (let i = 0; i < puppets.length; i++) {
            for (let j = i + 1; j < puppets.length; j++) collidePuppets(puppets[i], puppets[j]);
          }
          puppets.forEach(({ particles }) => particles.forEach(constrainToStage));
        }
      }

      function followAnchors(pp, blend) {
        pp.anchors.forEach((a, i) => {
          const isDragged = dragged?.pp === pp && dragged.i === i;
          a.x = isDragged ? a.tx : lerp(a.x, a.tx, blend);
          a.y = isDragged ? a.ty : lerp(a.y, a.ty, blend);
        });
      }

      function integrate(particles, dt) {
        for (const p of particles) {
          const vx = (p.x - p.px) * params.damping;
          const vy = (p.y - p.py) * params.damping;
          Object.assign(p, { px: p.x, py: p.y, x: p.x + vx, y: p.y + vy + GRAVITY * params.gravity * dt * dt });
        }
      }

      // Released hand drops strings (infinite slack); on re-grip, slack starts at the current gap and reels in.
      function updateRopeSlack({ ropes, anchors, particles }, isHeld, dt) {
        ropes.forEach((r, i) => {
          r.tension = 0;
          r.slack = !isHeld
            ? Infinity
            : r.slack === Infinity
              ? Math.max(0, dist(anchors[i], particles[r.part]) - r.length)
              : Math.max(0, r.slack * Math.exp(-2.5 * dt) - 60 * dt);
        });
      }

      function solveBones({ bones, particles }) {
        for (const bone of bones) {
          const a = particles[bone.a];
          const b = particles[bone.b];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 0.0001;
          const k = (d - bone.length) / d / (a.invMass + b.invMass);
          shift(a, dx, dy, k * a.invMass);
          shift(b, dx, dy, -k * b.invMass);
        }
      }

      function solveRopes({ ropes, anchors, particles }) {
        ropes.forEach((r, i) => {
          const p = particles[r.part];
          const dx = p.x - anchors[i].x;
          const dy = p.y - anchors[i].y;
          const d = Math.hypot(dx, dy);
          const excess = d - r.length - r.slack;
          if (excess <= 0) return;
          shift(p, dx, dy, -(excess / d) * params.pullStiff);
          r.tension = Math.max(r.tension, excess);
        });
      }

      function constrainToStage(p, i) {
        const radius = boundsRadius(i);
        p.x = clamp(p.x, radius + WALL_MARGIN, WIDTH - WALL_MARGIN - radius);
        if (p.y <= FLOOR - radius) return;
        p.y = FLOOR - radius;
        p.px = lerp(p.x, p.px, 0.7);
        p.py = Math.max(p.py, p.y);
      }

      function collidePuppets(A, B) {
        collideJoints(A, B);
        collideJointsWithBones(A, B);
        collideJointsWithBones(B, A);
        collideBones(A, B);
      }

      function collideJoints(A, B) {
        A.particles.forEach((p, i) => {
          B.particles.forEach((q, j) => {
            const dx = p.x - q.x;
            const dy = p.y - q.y;
            const d = Math.hypot(dx, dy);
            const overlap = collisionRadius(i) + collisionRadius(j) - d;
            if (overlap <= 0 || d < 1e-6) return;
            const k = overlap / d / (p.invMass + q.invMass);
            shift(p, dx, dy, k * p.invMass);
            shift(q, dx, dy, -k * q.invMass);
          });
        });
      }

      function collideJointsWithBones(A, B) {
        A.particles.forEach((p, i) => {
          const minDist = collisionRadius(i) + BONE_RADIUS;
          for (const [ia, ib] of COLLISION_SEGMENTS) {
            const a = B.particles[ia];
            const b = B.particles[ib];
            const ex = b.x - a.x;
            const ey = b.y - a.y;
            const u = clamp(((p.x - a.x) * ex + (p.y - a.y) * ey) / (ex * ex + ey * ey || 1), 0, 1);
            const nx = p.x - (a.x + ex * u);
            const ny = p.y - (a.y + ey * u);
            const d = Math.hypot(nx, ny);
            const overlap = minDist - d;
            if (overlap <= 0 || d < 1e-6) continue;
            const wa = a.invMass * (1 - u);
            const wb = b.invMass * u;
            const k = overlap / d / (p.invMass + wa * (1 - u) + wb * u);
            shift(p, nx, ny, k * p.invMass);
            shift(a, nx, ny, -k * wa);
            shift(b, nx, ny, -k * wb);
          }
        });
      }

      // Once two bones have crossed, the closest-point normal is meaningless, so push each puppet back toward its own side.
      function collideBones(A, B) {
        const sideX = Math.sign(centroid(A.particles).x - centroid(B.particles).x || 1);
        const minDist = 2 * BONE_RADIUS + 2;

        for (const [ia0, ia1] of COLLISION_SEGMENTS) {
          const a0 = A.particles[ia0];
          const a1 = A.particles[ia1];
          for (const [ib0, ib1] of COLLISION_SEGMENTS) {
            const b0 = B.particles[ib0];
            const b1 = B.particles[ib1];
            const [s, t] = closestSegmentParams(a0, a1, b0, b1);
            const pa = lerpPoint(a0, a1, s);
            const pb = lerpPoint(b0, b1, t);
            let nx = pa.x - pb.x;
            let ny = pa.y - pb.y;
            const d = Math.hypot(nx, ny);
            let overlap = minDist - d;

            if (segmentsCross(a0, a1, b0, b1) || d < 1e-6) {
              [nx, ny] = [sideX, 0];
              const minA = Math.min(a0.x * sideX, a1.x * sideX);
              const maxB = Math.max(b0.x * sideX, b1.x * sideX);
              overlap = 0.25 * (maxB - minA + minDist);
            } else if (overlap <= 0) continue;
            else [nx, ny] = [nx / d, ny / d];

            const wa0 = a0.invMass * (1 - s);
            const wa1 = a1.invMass * s;
            const wb0 = b0.invMass * (1 - t);
            const wb1 = b1.invMass * t;
            const k = overlap / (wa0 * (1 - s) + wa1 * s + wb0 * (1 - t) + wb1 * t || 1);
            shift(a0, nx, ny, k * wa0);
            shift(a1, nx, ny, k * wa1);
            shift(b0, nx, ny, -k * wb0);
            shift(b1, nx, ny, -k * wb1);
          }
        }
      }

      // ---------- Rendering ----------

      function render() {
        const isDebug = $("debugMode").checked;
        const view = getViewTransform();

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = isDebug ? "#fff" : "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.setTransform(view.scale, 0, 0, view.scale, view.x, view.y);
        ctx.lineCap = ctx.lineJoin = "round";

        if (isDebug) renderDebugLayer();

        puppets.forEach((pp, i) => renderPuppet(pp, isDebug ? DEBUG_THEME : { ink: PLAY_COLORS[i], paper: "#000", lift: ANCHOR_RENDER_LIFT }));
      }

      function renderDebugLayer() {
        const cam = getCameraTransform();
        const toWorld = ({ x, y }) => ({ x: cam.x + x * cam.width, y: cam.y + y * cam.height });

        if (isCameraActive && video.readyState >= 2) {
          withAlpha(0.5, () => ctx.drawImage(video, cam.x, cam.y, cam.width, cam.height));
        }

        ctx.strokeStyle = "#000";
        ctx.fillStyle = "#fff";
        drawLine({ x: 0, y: FLOOR }, { x: WIDTH, y: FLOOR }, 1);

        withAlpha(0.55, () => {
          for (const { landmarks, isTracked } of puppets) {
            if (!landmarks || !isTracked) continue;
            for (const [a, b] of HAND_CONNECTIONS) drawLine(toWorld(landmarks[a]), toWorld(landmarks[b]), 1.3);
            for (const { x, y } of landmarks.map(toWorld)) drawCircle(x, y, 2.5);
          }
        });
      }

      function renderPuppet(pp, { ink, paper, lift }) {
        const { particles, ropes, anchors } = pp;
        ctx.strokeStyle = ink;
        ctx.fillStyle = paper;

        if ($("showStrings").checked) {
          ctx.lineWidth = 1.4;
          ropes.forEach((r, i) => {
            const a = { x: anchors[i].x, y: anchors[i].y - lift };
            const p = particles[r.part];
            const sag = clamp((r.length + Math.min(r.slack, 1000) - dist(anchors[i], p)) * 0.55, 0, 55);
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.quadraticCurveTo((a.x + p.x) / 2 + sag, (a.y + p.y) / 2 + sag, p.x, p.y);
            ctx.stroke();
          });
        }

        for (const [a, b] of [...VISIBLE_BONES, [0, 1]]) drawLine(particles[a], particles[b], 6);

        renderHead(particles, ink);
        particles.slice(1).forEach(({ x, y }, i) => drawCircle(x, y, i < 4 ? 3.2 : 4.2, true, 1.8));

        if (lift) return;

        ctx.font = "12px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        anchors.forEach(({ x, y }, i) => {
          const isDragged = dragged?.pp === pp && dragged.i === i;
          ctx.fillStyle = paper;
          drawCircle(x, y, isDragged ? 15 : 12, true, 1.8);
          ctx.fillStyle = ink;
          ctx.fillText(String(i + 1), x, y);
        });
      }

      function renderHead([head, neck], ink) {
        ctx.save();
        ctx.translate(head.x, head.y);
        ctx.rotate(Math.atan2(neck.y - head.y, neck.x - head.x) - Math.PI / 2);
        drawCircle(0, 0, HEAD_RADIUS, true, 4);
        ctx.fillStyle = ink;
        drawCircle(-7, -2, 1.5);
        drawCircle(7, -2, 1.5);
        drawLine({ x: -6, y: 9 }, { x: 6, y: 9 }, 1.5);
        ctx.restore();
      }

      function updateStats(now) {
        if (now - lastStatsTime < 1000) return;
        const rate = (inferenceCount * 1000) / (now - lastStatsTime);
        inferenceCount = 0;
        lastStatsTime = now;

        const camFps = activeTrack()?.getSettings().frameRate;
        const hands = puppets.filter((pp) => pp.isTracked).length;
        $("stats").textContent = isCameraActive
          ? `Tracking: ${rate.toFixed(0)} fps | hands: ${hands} | inference: ${inferenceMs.toFixed(1)} ms | cam: ${camFps?.toFixed(0) ?? "?"} fps`
          : "Manual input | physics: 120 Hz";
      }

      // ---------- Hand tracking ----------

      function processCameraFrame(now) {
        if (!isCameraActive || !model || video.readyState < 2 || video.currentTime === lastVideoTime) return;
        lastVideoTime = video.currentTime;

        try {
          const start = performance.now();
          const result = model.detectForVideo(video, now);
          inferenceMs = performance.now() - start;
          inferenceCount++;

          const hands = assignHands(result.landmarks ?? [], result.handedness ?? result.handednesses);
          puppets.forEach((pp, k) => (hands[k] ? trackHand(pp, hands[k], now) : loseHand(pp, now)));
          $("calibrateButton").disabled = !puppets.some((pp) => pp.isTracked);
        } catch {
          disableCamera();
        }
      }

      // MediaPipe labels handedness for a mirrored image; on our unmirrored feed "Left" sits on screen left.
      function assignHands(hands, handedness) {
        const labeled = hands.map((hand, k) => ({ hand, slot: handedness?.[k]?.[0]?.categoryName === "Right" ? 1 : 0 }));
        if (labeled.length === 2 && labeled[0].slot === labeled[1].slot) {
          labeled.sort((a, b) => a.hand[0].x - b.hand[0].x).forEach((h, k) => (h.slot = k));
        }
        const slots = puppets.map(() => null);
        for (const { hand, slot } of labeled) slots[slot] = hand;
        return slots;
      }

      function trackHand(pp, hand, now) {
        const isReacquired = !pp.isTracked || now - pp.lastSeenTime > HAND_REACQUIRE_MS;
        if (isReacquired) resetFilters(pp);

        const nowSec = now / 1000;
        pp.landmarks = hand.map(({ x, y }, i) => ({
          x: pp.filters[i].x.filter(x, nowSec),
          y: pp.filters[i].y.filter(y, nowSec),
        }));
        pp.isTracked = true;
        pp.lastSeenTime = now;

        if (!pp.neutralPose || isReacquired) calibrateNeutral(pp);
      }

      function loseHand(pp, now) {
        if (pp.isTracked && now - pp.lastSeenTime > HAND_LOST_MS) clearHand(pp);
      }

      function clearHand(pp) {
        resetFilters(pp);
        Object.assign(pp, { isTracked: false, landmarks: null, neutralPose: null, lastSeenTime: -Infinity });
      }

      function clearTrackingState() {
        puppets.forEach(clearHand);
        lastVideoTime = -1;
        $("calibrateButton").disabled = true;
      }

      // Only finger spread is kept horizontally, so absolute hand x drives placement.
      function calibrateNeutral(pp) {
        if (!pp.landmarks || !pp.isTracked) return;
        const tips = FINGER_TIPS.map((i) => pp.landmarks[i]);
        const meanX = tips.reduce((sum, { x }) => sum + x, 0) / tips.length;
        pp.neutralPose = tips.map(({ x, y }) => ({ x: x - meanX + 0.5, y }));
      }

      const resetFilters = (pp) => pp.filters.forEach(({ x, y }) => (x.reset(), y.reset()));

      // ---------- Camera ----------

      const loadModel = () =>
        (modelPromise ??= createModel().catch((err) => {
          modelPromise = null;
          throw err;
        }));

      async function createModel() {
        const { FilesetResolver, HandLandmarker } = await import(`${MEDIAPIPE_URL}/vision_bundle.mjs`);
        const fileset = await FilesetResolver.forVisionTasks(`${MEDIAPIPE_URL}/wasm`);
        const options = (delegate) => ({
          baseOptions: { modelAssetPath: HAND_MODEL_URL, delegate },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.5,
          minHandPresenceConfidence: 0.5,
          minTrackingConfidence: 0.5,
        });
        try {
          return (model = await HandLandmarker.createFromOptions(fileset, options("GPU")));
        } catch {
          return (model = await HandLandmarker.createFromOptions(fileset, options("CPU")));
        }
      }

      async function startStream(deviceId) {
        stopStream();
        clearTrackingState();

        const getStream = (video) => navigator.mediaDevices.getUserMedia({ audio: false, video });
        try {
          stream = await getStream(deviceId ? { ...VIDEO_CONSTRAINTS, deviceId: { exact: deviceId } } : { ...VIDEO_CONSTRAINTS, facingMode: "user" });
        } catch (err) {
          if (!deviceId || !["NotFoundError", "OverconstrainedError"].includes(err.name)) throw err;
          stream = await getStream(VIDEO_CONSTRAINTS);
        }

        const currentStream = stream;
        await attachStream(currentStream);
        await video.play();

        const track = currentStream.getVideoTracks()[0];
        const { deviceId: activeId } = track.getSettings();
        if (activeId) storage.set(CAMERA_STORAGE_KEY, activeId);
        track.addEventListener("ended", () => stream === currentStream && !isBusy && disableCamera());
        return activeId;
      }

      const attachStream = (source) =>
        new Promise((resolve, reject) => {
          const settle = (fn) => () => {
            clearTimeout(timer);
            video.onloadedmetadata = video.onerror = null;
            fn();
          };
          const timer = setTimeout(
            settle(() => reject(new Error("Timeout"))),
            15000,
          );
          video.onloadedmetadata = settle(resolve);
          video.onerror = settle(() => reject(new Error("Camera error")));
          video.srcObject = source;
        });

      function stopStream() {
        stream?.getTracks().forEach((t) => t.stop());
        stream = video.srcObject = null;
      }

      function disableCamera() {
        isCameraActive = false;
        stopStream();
        clearTrackingState();
        $("cameraButton").textContent = "Enable camera";
        $("cameraSelect").disabled = true;
        puppets.forEach(resetAnchorTargets);
      }

      async function switchCamera(deviceId) {
        setBusy(true);
        try {
          const activeId = await startStream(deviceId);
          isCameraActive = true;
          $("cameraButton").textContent = "Disable camera";
          await populateCameras(activeId);
        } catch {
          disableCamera();
        } finally {
          setBusy(false);
        }
      }

      async function populateCameras(activeId) {
        const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
        const select = $("cameraSelect");
        select.replaceChildren(
          ...devices.map(({ deviceId, label }, i) =>
            Object.assign(document.createElement("option"), { value: deviceId, textContent: label || `Camera ${i + 1}` }),
          ),
        );
        if (activeId) select.value = activeId;
      }

      function setBusy(value) {
        isBusy = value;
        $("cameraButton").disabled = value;
        $("cameraSelect").disabled = value || !isCameraActive;
      }

      const activeTrack = () => stream?.getVideoTracks()[0];

      // ---------- UI ----------

      function bindUI() {
        for (const [group, sliders] of Object.entries(SLIDERS)) {
          $(group)
            .querySelector("legend")
            .after(...sliders.map(createSlider));
        }

        new ResizeObserver(() => {
          const { width, height } = canvas.getBoundingClientRect();
          const dpr = Math.min(devicePixelRatio || 1, 2);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
        }).observe(canvas);

        canvas.addEventListener("pointerdown", startDrag);
        canvas.addEventListener("pointermove", moveDrag);
        ["pointerup", "pointercancel", "lostpointercapture"].forEach((type) => canvas.addEventListener(type, releaseDrag));

        $("cameraButton").addEventListener("click", () => {
          if (isCameraActive) return disableCamera();
          if (!isSecureContext || !navigator.mediaDevices?.getUserMedia) return;
          releaseDrag();
          setBusy(true);
          loadModel()
            .then(() => switchCamera(storage.get(CAMERA_STORAGE_KEY) || ""), disableCamera)
            .finally(() => setBusy(false));
        });

        $("cameraSelect").addEventListener("change", ({ target }) => {
          if (isBusy || !isCameraActive) return;
          isCameraActive = false;
          switchCamera(target.value);
        });

        $("menuButton").addEventListener("click", ({ currentTarget }) => {
          const menu = $("menu");
          menu.hidden = !menu.hidden;
          currentTarget.setAttribute("aria-expanded", String(!menu.hidden));
        });

        $("resetButton").addEventListener("click", resetPuppets);
        $("calibrateButton").addEventListener("click", () => puppets.forEach(calibrateNeutral));

        navigator.mediaDevices?.addEventListener?.("devicechange", () => {
          if (isCameraActive && !isBusy) populateCameras(activeTrack()?.getSettings().deviceId).catch(() => {});
        });

        document.addEventListener("visibilitychange", () => {
          previousTime = performance.now();
          accumulator = 0;
          puppets.forEach(({ particles }) => particles.forEach((p) => Object.assign(p, { px: p.x, py: p.y })));
        });

        window.addEventListener("pagehide", disableCamera);
      }

      function createSlider({ key, label, min, max, step, value, fmt }) {
        const wrapper = Object.assign(document.createElement("label"), { className: "setting" });
        wrapper.innerHTML = `<span>${label} <output></output></span><input type="range" min="${min}" max="${max}" step="${step}" value="${value}" />`;
        const input = wrapper.querySelector("input");
        const output = wrapper.querySelector("output");
        const update = () => {
          params[key] = Number(input.value);
          output.value = fmt(params[key]);
          if (key === "torsoMass") updateParticleMasses();
        };
        input.addEventListener("input", update);
        update();
        return wrapper;
      }

      function startDrag(e) {
        if (isCameraActive || isBusy) return;
        const pointer = getPointerPos(e);
        let nearest = DRAG_PICK_RADIUS;
        dragged = null;

        for (const pp of puppets) {
          pp.anchors.forEach((a, i) => {
            const d = dist(a, pointer);
            if (d < nearest) [nearest, dragged] = [d, { pp, i }];
          });
        }

        if (!dragged) return;
        activePointerId = e.pointerId;
        canvas.setPointerCapture(activePointerId);
      }

      function moveDrag(e) {
        if (!dragged || e.pointerId !== activePointerId) return;
        const { x, y } = getPointerPos(e);
        const anchor = dragged.pp.anchors[dragged.i];
        anchor.x = anchor.tx = clamp(x, DRAG_BOUNDS.minX, DRAG_BOUNDS.maxX);
        anchor.y = anchor.ty = clamp(y, DRAG_BOUNDS.minY, DRAG_BOUNDS.maxY);
      }

      function releaseDrag() {
        dragged = activePointerId = null;
      }

      // ---------- Pure helpers ----------

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function lerpPoint(a, b, t) {
        return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) };
      }

      function shift(p, dx, dy, k) {
        p.x += dx * k;
        p.y += dy * k;
      }

      function centroid(points) {
        const sum = points.reduce((acc, { x, y }) => ({ x: acc.x + x, y: acc.y + y }), { x: 0, y: 0 });
        return { x: sum.x / points.length, y: sum.y / points.length };
      }

      function cross(o, a, b) {
        return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
      }

      function segmentsCross(p1, q1, p2, q2) {
        return cross(p1, q1, p2) * cross(p1, q1, q2) < 0 && cross(p2, q2, p1) * cross(p2, q2, q1) < 0;
      }

      function closestSegmentParams(p1, q1, p2, q2) {
        const d1x = q1.x - p1.x;
        const d1y = q1.y - p1.y;
        const d2x = q2.x - p2.x;
        const d2y = q2.y - p2.y;
        const rx = p1.x - p2.x;
        const ry = p1.y - p2.y;
        const a = d1x * d1x + d1y * d1y || 1e-9;
        const e = d2x * d2x + d2y * d2y || 1e-9;
        const b = d1x * d2x + d1y * d2y;
        const c = d1x * rx + d1y * ry;
        const f = d2x * rx + d2y * ry;
        const denom = a * e - b * b;
        const s = denom > 1e-9 ? clamp((b * f - c * e) / denom, 0, 1) : 0;
        const t = (b * s + f) / e;
        return t < 0 ? [clamp(-c / a, 0, 1), 0] : t > 1 ? [clamp((b - c) / a, 0, 1), 1] : [s, t];
      }

      function getViewTransform() {
        const scale = Math.min(canvas.width / WIDTH, canvas.height / HEIGHT);
        return { scale, x: (canvas.width - WIDTH * scale) / 2, y: (canvas.height - HEIGHT * scale) / 2 };
      }

      function getCameraTransform() {
        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 480;
        const scale = Math.max(WIDTH / vw, HEIGHT / vh);
        const [width, height] = [vw * scale, vh * scale];
        return { width, height, x: (WIDTH - width) / 2, y: (HEIGHT - height) / 2 };
      }

      function getPointerPos({ clientX, clientY }) {
        const rect = canvas.getBoundingClientRect();
        const view = getViewTransform();
        return {
          x: (((clientX - rect.left) / rect.width) * canvas.width - view.x) / view.scale,
          y: (((clientY - rect.top) / rect.height) * canvas.height - view.y) / view.scale,
        };
      }

      function drawLine(a, b, width = 1) {
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function drawCircle(x, y, radius, fill = true, width = 1) {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        if (fill) ctx.fill();
        ctx.lineWidth = width;
        ctx.stroke();
      }

      function withAlpha(alpha, draw) {
        ctx.save();
        ctx.globalAlpha = alpha;
        draw();
        ctx.restore();
      }

      const storage = {
        get: (key) => {
          try {
            return localStorage.getItem(key);
          } catch {}
        },
        set: (key, value) => {
          try {
            localStorage.setItem(key, value);
          } catch {}
        },
      };

      class LowPassFilter {
        raw = null;
        smoothed = null;

        filter(value, alpha) {
          this.smoothed = this.raw === null ? value : alpha * value + (1 - alpha) * this.smoothed;
          this.raw = value;
          return this.smoothed;
        }

        reset() {
          this.raw = this.smoothed = null;
        }
      }

      class OneEuroFilter {
        value = new LowPassFilter();
        velocity = new LowPassFilter();
        lastTime = null;

        static alpha(cutoff, te) {
          const r = 2 * Math.PI * cutoff * te;
          return r / (r + 1);
        }

        filter(value, timestamp) {
          if (this.lastTime !== null) {
            const dt = timestamp - this.lastTime;
            if (dt <= 0) return this.value.smoothed ?? value;
            if (dt > 1) this.reset();
          }
          const te = this.lastTime ? timestamp - this.lastTime : 1 / 60;
          this.lastTime = timestamp;

          const rawVelocity = this.value.raw !== null ? (value - this.value.raw) / te : 0;
          const velocity = this.velocity.filter(rawVelocity, OneEuroFilter.alpha(1, te));
          const cutoff = params.filterCutoff + params.filterBeta * Math.abs(velocity);
          return this.value.filter(value, OneEuroFilter.alpha(cutoff, te));
        }

        reset() {
          this.value.reset();
          this.velocity.reset();
          this.lastTime = null;
        }
      }

      bindUI();
      resetPuppets();
      requestAnimationFrame(mainLoop);
      $("cameraButton").click();
    </script>
  </body>
</html>
