<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flux 2 [klein] Realtime Binary Divider Pad</title>
    <style>
      :root {
        --text: #222;
        --bg: #fafafa;
        --border: #ccc;
        --dark-wood: #60462c;
        --light-wood: #c4a98a;
        --guide-dash: rgba(212, 163, 115, 0.4);
        --guide-hover: rgba(212, 163, 115, 0.22);
        --canvas-bg: #d7d8d3;
        --panel-size: 352px;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        margin: 20px;
        line-height: 1.4;
        color: var(--text);
        background: var(--bg);
      }

      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }

      .form-group {
        margin-bottom: 12px;

        > label {
          display: block;
          font-weight: bold;
          margin-bottom: 4px;
        }
      }

      input[type="password"],
      textarea {
        width: 100%;
        max-width: 600px;
        box-sizing: border-box;
        padding: 6px 8px;
        font-family: inherit;
      }

      textarea {
        resize: none;
        height: 60px;
        overflow: auto;
      }

      .controls-row {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .mode-group {
        display: flex;
        gap: 12px;
        align-items: center;
        background: #eee;
        padding: 6px 12px;
        border-radius: 4px;

        label {
          cursor: pointer;
          display: flex;
          align-items: center;
          gap: 4px;
          font-size: 0.95rem;
        }
      }

      .inline-checkbox {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.9rem;
        cursor: pointer;
        user-select: none;
      }

      .workspace {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 15px;

        &.merged {
          position: relative;
          display: block;
          width: var(--panel-size);
          height: var(--panel-size);

          > * {
            position: absolute;
            inset: 0 auto auto 0;
            width: var(--panel-size);
            height: var(--panel-size);
          }

          .output-frame {
            z-index: 1;
          }

          #draw-canvas {
            z-index: 2;
            opacity: 0;
            background: transparent;
          }

          #draft-canvas {
            z-index: 3;
            background: transparent;
            border-color: transparent;
          }
        }

        &.show-draft #draft-canvas {
          display: block;
        }
      }

      canvas,
      .output-frame {
        width: var(--panel-size);
        height: var(--panel-size);
        border: 1px solid var(--border);
        box-sizing: border-box;
      }

      #draw-canvas {
        cursor: crosshair;
        background: #fff;
        touch-action: none;
      }

      #draft-canvas {
        pointer-events: none;
        display: none;
      }

      .output-frame {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f0f0;
        overflow: hidden;

        img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: none;

          &.visible {
            display: block;
          }
        }
      }

      #status {
        font-weight: bold;
        font-family: monospace;

        &.connected {
          color: green;
        }
        &.disconnected {
          color: #666;
        }
        &.generating {
          color: #d97706;
        }
        &.error {
          color: red;
        }
      }

      .fps-counter {
        font-family: monospace;
        font-size: 0.85rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Flux 2 [klein] Realtime Binary Divider Pad</h1>

    <div class="form-group">
      <label for="api-key">fal.ai API Key:</label>
      <input type="password" id="api-key" placeholder="Enter your FAL_KEY (e.g. key_id:key_secret)" autocomplete="off" />
    </div>

    <div class="controls-row">
      <button id="connect-btn">Connect WebSocket</button>
      <button id="disconnect-btn" disabled>Disconnect</button>
      <span>Status: <span id="status" class="disconnected">Disconnected</span></span>
      <span id="fps-display" class="fps-counter"></span>
    </div>

    <div class="form-group">
      <label for="prompt">Prompt:</label>
      <textarea id="prompt" readonly placeholder="Describe the image you want to generate..."></textarea>
    </div>

    <div class="form-group">
      <label>Generation Mode:</label>
      <div class="mode-group">
        <label><input type="radio" name="mode" value="manual" checked /> 1. Manual Send</label>
        <label><input type="radio" name="mode" value="stroke" /> 2. Send on Split End</label>
        <label><input type="radio" name="mode" value="continuous" /> 3. Continuous (30 FPS Stream)</label>
      </div>
    </div>

    <div class="form-group">
      <label>Tool:</label>
      <div class="mode-group">
        <label><input type="radio" name="tool" value="build" checked /> 🔨 Build (split dividers)</label>
        <label><input type="radio" name="tool" value="pot" /> 🏺 Pot (place pots)</label>
        <label><input type="radio" name="tool" value="plant" /> 🌿 Plant (click pot to grow)</label>
      </div>
    </div>

    <div class="controls-row">
      <button id="send-btn" disabled>Generate Image (Manual)</button>
      <button id="clear-btn">Reset Grid</button>
      <label class="inline-checkbox"><input type="checkbox" id="guides-toggle" checked /> Show Split Guides</label>
      <label class="inline-checkbox"><input type="checkbox" id="merge-toggle" /> Merge Output</label>
      <label class="inline-checkbox"><input type="checkbox" id="draft-toggle" /> Draft Line</label>
    </div>

    <div class="workspace" id="workspace">
      <canvas id="draw-canvas" width="352" height="352"></canvas>
      <canvas id="draft-canvas" width="352" height="352"></canvas>
      <div class="output-frame">
        <span id="output-placeholder">No output yet</span>
        <img id="output-img" alt="Generated visual" />
      </div>
    </div>

    <script type="module">
      import { fal } from "https://esm.sh/@fal-ai/client@1?bundle";

      // ── Audio Engine ──────────────────────────────────────────────────────

      class AudioEngine {
        constructor() {
          this.ctx = null;
          this.buffers = new Map();
          this.activeStrokeSource = null;
          this.activeStrokeGain = null;
          this.lastStrokeStopTimer = null;
          this.thudIndex = 0;
          this.thudPool = ["thud-01.mp3", "thud-02.mp3", "thud-03.mp3", "thud-04.mp3"];
          this.growIndex = 0;
          this.growPool = ["grow-01.mp3", "grow-02.mp3", "grow-03.mp3", "grow-04.mp3", "grow-05.mp3"];
          this.shuffleArray(this.thudPool);
          this.shuffleArray(this.growPool);
          this.init();
        }

        shuffleArray(arr) {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
        }

        initContext() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
          }
          if (this.ctx.state === "suspended") {
            this.ctx.resume();
          }
        }

        async fetchAudioData(filename) {
          const path = `assets/${filename}`;
          try {
            if (window.readonlyFS?.getFile) {
              const file = await window.readonlyFS.getFile(path);
              return await file.arrayBuffer();
            }
          } catch (e) {
            // fallback
          }

          try {
            const res = await fetch(`./assets/${filename}`);
            if (res.ok) return await res.arrayBuffer();
          } catch (e) {
            // fallback
          }
          return null;
        }

        async init() {
          const files = [
            "stroke.mp3",
            "thud-01.mp3",
            "thud-02.mp3",
            "thud-03.mp3",
            "thud-04.mp3",
            "ceramic.mp3",
            "watering.mp3",
            "grow-01.mp3",
            "grow-02.mp3",
            "grow-03.mp3",
            "grow-04.mp3",
            "grow-05.mp3",
          ];

          for (const file of files) {
            this.loadBuffer(file);
          }
        }

        async loadBuffer(name) {
          try {
            const arrayBuf = await this.fetchAudioData(name);
            if (!arrayBuf) return;
            this.initContext();
            const audioBuffer = await this.ctx.decodeAudioData(arrayBuf);
            this.buffers.set(name, audioBuffer);
          } catch (e) {
            console.warn(`[Audio] Failed to load ${name}`, e);
          }
        }

        playBuffer(name, loop = false, onEnded = null) {
          this.initContext();
          const buffer = this.buffers.get(name);
          if (!buffer) return null;

          const source = this.ctx.createBufferSource();
          source.buffer = buffer;
          source.loop = loop;

          const gain = this.ctx.createGain();
          source.connect(gain);
          gain.connect(this.ctx.destination);

          if (onEnded) {
            source.onended = onEnded;
          }

          source.start(0);
          return { source, gain };
        }

        startStrokeSound() {
          this.initContext();
          if (this.lastStrokeStopTimer) {
            clearTimeout(this.lastStrokeStopTimer);
            this.lastStrokeStopTimer = null;
          }

          if (this.activeStrokeSource) return;

          const buffer = this.buffers.get("stroke.mp3");
          if (!buffer) return;

          const source = this.ctx.createBufferSource();
          source.buffer = buffer;
          source.loop = true;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.7, this.ctx.currentTime + 0.05);

          source.connect(gain);
          gain.connect(this.ctx.destination);
          source.start(0);

          this.activeStrokeSource = source;
          this.activeStrokeGain = gain;
        }

        keepStrokeAlive() {
          this.startStrokeSound();
          if (this.lastStrokeStopTimer) {
            clearTimeout(this.lastStrokeStopTimer);
          }
          this.lastStrokeStopTimer = setTimeout(() => {
            this.stopStrokeSound();
          }, 120);
        }

        stopStrokeSound() {
          if (!this.activeStrokeSource) return;
          const src = this.activeStrokeSource;
          const gain = this.activeStrokeGain;
          this.activeStrokeSource = null;
          this.activeStrokeGain = null;

          if (this.ctx && gain) {
            gain.gain.setValueAtTime(gain.gain.value, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
            setTimeout(() => {
              try {
                src.stop();
                src.disconnect();
              } catch (e) {}
            }, 90);
          } else {
            try {
              src.stop();
            } catch (e) {}
          }
        }

        playThud() {
          const sound = this.thudPool[this.thudIndex];
          this.thudIndex = (this.thudIndex + 1) % this.thudPool.length;
          if (this.thudIndex === 0) this.shuffleArray(this.thudPool);
          this.playBuffer(sound);
        }

        playPotPlacement() {
          // Play ceramic immediately followed by watering
          this.playBuffer("ceramic.mp3", false, () => {
            this.playBuffer("watering.mp3");
          });
        }

        playGrow() {
          const sound = this.growPool[this.growIndex];
          this.growIndex = (this.growIndex + 1) % this.growPool.length;
          if (this.growIndex === 0) this.shuffleArray(this.growPool);
          this.playBuffer(sound);
        }
      }

      const audio = new AudioEngine();

      // ── Constants ─────────────────────────────────────────────────────────

      const FAL_APP_ID = "fal-ai/flux-2/klein";
      const CONNECTION_KEY = "flux-2-klein-pad-session";
      const STREAM_FPS = 30;
      const MIN_SIZE = 14;
      const GOLDEN_RATIO = (1 + Math.sqrt(5)) / 2;
      const CAPTURE_SIZE = 704;
      const STORAGE = { apiKey: "fal_flux_klein_api_key", mode: "fal_flux_klein_mode" };
      const FALLBACK_PROMPT = "Modern minimalist wooden bookshelf with books, indoor plants, ceramics and decorative art";

      const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      const THEME = {
        darkWood: cssVar("--dark-wood"),
        lightWood: cssVar("--light-wood"),
        guideDash: cssVar("--guide-dash"),
        guideHover: cssVar("--guide-hover"),
        canvasBg: cssVar("--canvas-bg"),
      };

      const $ = (id) => document.getElementById(id);
      const el = {
        apiKey: $("api-key"),
        connect: $("connect-btn"),
        disconnect: $("disconnect-btn"),
        status: $("status"),
        fps: $("fps-display"),
        prompt: $("prompt"),
        send: $("send-btn"),
        clear: $("clear-btn"),
        guides: $("guides-toggle"),
        merge: $("merge-toggle"),
        draft: $("draft-toggle"),
        workspace: $("workspace"),
        canvas: $("draw-canvas"),
        draftCanvas: $("draft-canvas"),
        output: $("output-img"),
        placeholder: $("output-placeholder"),
      };
      const ctx = el.canvas.getContext("2d");
      const draftCtx = el.draftCanvas.getContext("2d");

      const boxH = Math.round(el.canvas.height * 0.9);
      const boxW = Math.round(boxH / GOLDEN_RATIO);
      const boxX = Math.round((el.canvas.width - boxW) / 2);
      const boxY = Math.round(el.canvas.height * 0.05);

      // ── State ─────────────────────────────────────────────────────────────

      const createNode = (x, y, w, h) => ({
        x: Math.round(x),
        y: Math.round(y),
        w: Math.round(w),
        h: Math.round(h),
        splitType: null,
        splitPos: 0,
        left: null,
        right: null,
      });
      const isLeaf = (node) => node.splitType === null;

      let root = createNode(boxX, boxY, boxW, boxH);
      let mouse = { x: -1, y: -1, leaf: null, quad: null };
      let lastMoveTime = 0;
      let lastMoveX = -1;
      let lastMoveY = -1;
      let connection = null;
      let currentMode = "manual";
      let currentTool = "build";
      let showGuides = true;
      let showDraft = false;
      let streamInterval = null;
      let fpsInterval = null;
      let framesSent = 0;
      let pots = [];
      let potPreview = null;

      // ── Setup ─────────────────────────────────────────────────────────────

      const restorePersistedSettings = () => {
        el.apiKey.value = localStorage.getItem(STORAGE.apiKey) ?? "";

        const savedMode = localStorage.getItem(STORAGE.mode);
        if (savedMode) {
          currentMode = savedMode;
          const radio = document.querySelector(`input[name="mode"][value="${savedMode}"]`);
          if (radio) radio.checked = true;
        }
      };

      const refreshUI = () => {
        updatePrompt();
        render();
        renderDraft();
      };

      function switchTool(tool) {
        currentTool = tool;
        const radio = document.querySelector(`input[name="tool"][value="${tool}"]`);
        if (radio) radio.checked = true;
        mouse.leaf = mouse.quad = null;
        potPreview = null;
        audio.stopStrokeSound();
      }

      const bindEvents = () => {
        // Resume AudioContext on any interaction
        window.addEventListener("pointerdown", () => audio.initContext(), { once: true });
        window.addEventListener("keydown", () => audio.initContext(), { once: true });

        el.apiKey.addEventListener("input", () => localStorage.setItem(STORAGE.apiKey, el.apiKey.value.trim()));

        document.querySelectorAll('input[name="mode"]').forEach((radio) =>
          radio.addEventListener("change", () => {
            currentMode = radio.value;
            localStorage.setItem(STORAGE.mode, currentMode);
            applyModeState();
          }),
        );

        document.querySelectorAll('input[name="tool"]').forEach((radio) =>
          radio.addEventListener("change", () => {
            currentTool = radio.value;
            mouse.leaf = mouse.quad = null;
            potPreview = null;
            audio.stopStrokeSound();
            refreshUI();
          }),
        );

        el.guides.addEventListener("change", () => {
          showGuides = el.guides.checked;
          render();
        });
        el.merge.addEventListener("change", () => el.workspace.classList.toggle("merged", el.merge.checked));
        el.draft.addEventListener("change", () => {
          showDraft = el.draft.checked;
          el.workspace.classList.toggle("show-draft", showDraft);
          renderDraft();
        });
        el.connect.addEventListener("click", connectRealtime);
        el.disconnect.addEventListener("click", disconnectRealtime);
        el.send.addEventListener("click", sendFrame);
        el.clear.addEventListener("click", resetDivider);

        el.canvas.addEventListener("mousemove", (e) => updatePointer(getCanvasCoords(e)));
        el.canvas.addEventListener("mouseleave", () => {
          mouse.leaf = mouse.quad = null;
          potPreview = null;
          audio.stopStrokeSound();
          refreshUI();
        });
        el.canvas.addEventListener("click", (e) => {
          audio.initContext();
          updatePointer(getCanvasCoords(e));
          commitAction(true);
        });

        const onTouch = (e) => {
          e.preventDefault();
          audio.initContext();
          updatePointer(getCanvasCoords(e));
        };
        el.canvas.addEventListener("touchstart", onTouch, { passive: false });
        el.canvas.addEventListener("touchmove", onTouch, { passive: false });
        el.canvas.addEventListener("touchend", () => {
          audio.stopStrokeSound();
          commitAction(false);
        });
      };

      restorePersistedSettings();
      bindEvents();
      refreshUI();

      // ── Connection ────────────────────────────────────────────────────────

      function connectRealtime() {
        const apiKey = el.apiKey.value.trim();
        if (!apiKey) {
          alert("Please enter your fal.ai API key.");
          el.apiKey.focus();
          return;
        }

        fal.config({ credentials: apiKey });
        setStatus("Connecting...", "generating");

        try {
          connection = fal.realtime.connect(FAL_APP_ID, {
            connectionKey: CONNECTION_KEY,
            throttleInterval: 30,
            onResult: handleResult,
            onError: (err) => {
              console.error("[fal connection error]", err);
              setStatus("Connection Error", "error");
            },
          });

          el.connect.disabled = true;
          el.disconnect.disabled = false;
          setStatus("Connected", "connected");
          applyModeState();
        } catch (err) {
          console.error(err);
          setStatus("Failed to connect", "error");
        }
      }

      function disconnectRealtime() {
        stopStream();
        connection?.close?.();
        connection = null;
        el.connect.disabled = false;
        el.disconnect.disabled = true;
        el.send.disabled = true;
        setStatus("Disconnected", "disconnected");
      }

      function handleResult(result) {
        if (result?.error || result?.status === "error") {
          console.warn("[fal error]", result);
          setStatus("Result error", "error");
          return;
        }

        const src = toImageSrc(result?.images?.at(-1));
        if (src) {
          el.output.src = src;
          el.output.classList.add("visible");
          el.placeholder.style.display = "none";
          setStatus("Connected (Live)", "connected");
        }
      }

      function sendFrame() {
        if (!connection) return;
        if (currentMode !== "continuous") setStatus("Generating...", "generating");

        try {
          connection.send({
            image_url: captureCanvasJpeg(),
            prompt: el.prompt.value || FALLBACK_PROMPT,
            image_size: "square",
            num_inference_steps: 3,
            seed: 35,
            output_feedback_strength: 1.0,
          });
        } catch (e) {
          console.error("[Send error]", e);
          setStatus("Send Error", "error");
        }
      }

      // ── Modes & Streaming ─────────────────────────────────────────────────

      function applyModeState() {
        currentMode === "continuous" && connection ? startStream() : stopStream();
        el.send.disabled = !connection || currentMode === "continuous";
      }

      function startStream() {
        if (streamInterval) return;

        framesSent = 0;
        fpsInterval = setInterval(() => {
          el.fps.textContent = `[Streaming: ~${framesSent} FPS]`;
          framesSent = 0;
        }, 1000);

        streamInterval = setInterval(() => {
          if (!connection) return;
          sendFrame();
          framesSent++;
        }, 1000 / STREAM_FPS);
      }

      function stopStream() {
        clearInterval(streamInterval);
        clearInterval(fpsInterval);
        streamInterval = fpsInterval = null;
        el.fps.textContent = "";
      }

      // ── Pointer & Tool Interaction ────────────────────────────────────────

      function updatePointer({ x, y }) {
        const now = performance.now();
        const dt = now - lastMoveTime;
        const dx = x - lastMoveX;
        const dy = y - lastMoveY;
        const dist = Math.hypot(dx, dy);

        mouse.x = x;
        mouse.y = y;
        mouse.leaf = mouse.quad = null;
        potPreview = null;

        if (currentTool === "build") {
          mouse.leaf = findLeaf(root, x, y);
          mouse.quad = mouse.leaf ? getQuadrant(mouse.leaf, x, y) : null;

          // Check speed threshold (ignore tiny jitter, e.g. < 4px or dt > 150ms)
          if (mouse.leaf && mouse.quad && dt > 0 && dt < 150) {
            const speed = dist / dt; // px/ms
            if (speed > 0.08 && dist >= 3) {
              audio.keepStrokeAlive();
            }
          }
        } else {
          audio.stopStrokeSound();
          if (currentTool === "pot") {
            const leaf = findLeaf(root, x, y);
            if (leaf) potPreview = computePot(leaf, x);
          }
        }

        lastMoveTime = now;
        lastMoveX = x;
        lastMoveY = y;

        refreshUI();
      }

      function commitAction(keepHover) {
        audio.stopStrokeSound();
        if (currentTool === "build") {
          commitSplit(keepHover);
        } else if (currentTool === "pot") {
          if (!potPreview) return;
          pots.push({ ...potPreview });
          potPreview = null;
          audio.playPotPlacement();
          switchTool("plant");
          if (keepHover) {
            mouse.leaf = findLeaf(root, mouse.x, mouse.y);
            mouse.quad = mouse.leaf ? getQuadrant(mouse.leaf, mouse.x, mouse.y) : null;
          }
          refreshUI();
          if (currentMode === "stroke" && connection) sendFrame();
        } else if (currentTool === "plant") {
          const pot = findPotAt(mouse.x, mouse.y);
          if (!pot) return;
          const rimY = pot.baseY - pot.h;
          const maxDown = el.canvas.height - rimY + 10;

          // 3 Upward stages (8px, 16px, 24px) -> then downward trailing
          if (pot.upSteps < 3) {
            pot.upSteps++;
            audio.playGrow();
          } else if (pot.downLen < maxDown) {
            pot.downLen = Math.min(pot.downLen + 50, maxDown);
            audio.playGrow();
          } else {
            return;
          }
          refreshUI();
          if (currentMode === "stroke" && connection) sendFrame();
        }
      }

      function commitSplit(keepHover) {
        if (!mouse.leaf || !mouse.quad) return;

        splitLeaf(mouse.leaf, mouse.x, mouse.y, mouse.quad);
        audio.playThud();
        mouse.leaf = keepHover ? findLeaf(root, mouse.x, mouse.y) : null;
        mouse.quad = mouse.leaf ? getQuadrant(mouse.leaf, mouse.x, mouse.y) : null;
        refreshUI();

        if (currentMode === "stroke" && connection) sendFrame();
      }

      function splitLeaf(leaf, px, py, quad) {
        if (quad === "N" || quad === "S") {
          const splitX = clamp(Math.round(px), leaf.x + MIN_SIZE, leaf.x + leaf.w - MIN_SIZE);
          Object.assign(leaf, {
            splitType: "v",
            splitPos: splitX,
            left: createNode(leaf.x, leaf.y, splitX - leaf.x, leaf.h),
            right: createNode(splitX, leaf.y, leaf.x + leaf.w - splitX, leaf.h),
          });
        } else {
          const splitY = clamp(Math.round(py), leaf.y + MIN_SIZE, leaf.y + leaf.h - MIN_SIZE);
          Object.assign(leaf, {
            splitType: "h",
            splitPos: splitY,
            left: createNode(leaf.x, leaf.y, leaf.w, splitY - leaf.y),
            right: createNode(leaf.x, splitY, leaf.w, leaf.y + leaf.h - splitY),
          });
        }
      }

      function resetDivider() {
        audio.stopStrokeSound();
        root = createNode(boxX, boxY, boxW, boxH);
        mouse.leaf = mouse.quad = null;
        pots = [];
        potPreview = null;
        refreshUI();
        el.output.classList.remove("visible");
        el.output.removeAttribute("src");
        el.placeholder.style.display = "block";
        if (currentMode === "stroke" && connection) sendFrame();
      }

      // ── Pots & Abstract Plants ────────────────────────────────────────────

      function computePot(leaf, x) {
        const topW = clamp(Math.round(leaf.w * 0.45), 12, 36);
        const cx = clamp(Math.round(x), leaf.x + topW / 2 + 2, leaf.x + leaf.w - topW / 2 - 2);
        return {
          cx,
          baseY: leaf.y + leaf.h - 2,
          topW,
          botW: Math.round(topW * 0.65),
          h: Math.round(topW * 0.75),
          upSteps: 0,
          downLen: 0,
        };
      }

      function findPotAt(x, y) {
        return pots.find((p) => Math.abs(x - p.cx) <= p.topW / 2 && y >= p.baseY - p.h && y <= p.baseY) ?? null;
      }

      function tracePot(target, pot) {
        const { cx, baseY, topW, botW, h } = pot;
        target.moveTo(cx - topW / 2, baseY - h);
        target.lineTo(cx + topW / 2, baseY - h);
        target.lineTo(cx + botW / 2, baseY);
        target.lineTo(cx - botW / 2, baseY);
        target.closePath();
      }

      function drawPot(target, pot, alpha = 1) {
        target.save();
        target.globalAlpha = alpha;
        target.beginPath();
        tracePot(target, pot);
        target.fillStyle = "#ffffff";
        target.fill();
        target.lineWidth = 1;
        target.strokeStyle = "rgba(0,0,0,0.25)";
        target.stroke();
        target.restore();
      }

      function drawPlant(target, pot) {
        const rimY = pot.baseY - pot.h;
        target.save();
        target.fillStyle = "rgba(85, 165, 75, 0.85)";
        target.strokeStyle = "rgba(45, 120, 50, 0.9)";
        target.lineWidth = 1;

        if (pot.upSteps > 0) {
          // 0 -> 8px -> 16px -> 24px radius
          const r = pot.upSteps * 8;
          // Center is half the radius (4px, 8px, 12px) above the pot surface
          const centerY = rimY - r / 2;
          target.beginPath();
          target.arc(pot.cx, centerY, r, 0, Math.PI * 2);
          target.fill();
          target.stroke();
        }

        if (pot.downLen > 0) {
          const w = Math.max(8, pot.topW * 0.5);
          target.beginPath();
          target.rect(pot.cx - w / 2, rimY, w, pot.downLen);
          target.fill();
          target.stroke();
        }

        target.restore();
      }

      // ── Prompt ────────────────────────────────────────────────────────────

      function countDividers(node) {
        let horizontal = 0;
        let vertical = 0;

        const traverse = (n) => {
          if (!n || isLeaf(n)) return;
          n.splitType === "h" ? horizontal++ : vertical++;
          traverse(n.left);
          traverse(n.right);
        };
        traverse(node);

        if (currentTool === "build" && mouse.leaf && mouse.quad) {
          mouse.quad === "N" || mouse.quad === "S" ? vertical++ : horizontal++;
        }

        return { horizontal, vertical };
      }

      function updatePrompt() {
        const { horizontal, vertical } = countDividers(root);
        el.prompt.value = generateShelfPrompt(horizontal, vertical);
      }

      function decorSentence() {
        const potCount = pots.length;
        if (potCount === 0) return "";
        const sprouting = pots.filter((p) => p.upSteps > 0 && p.downLen === 0).length;
        const trailing = pots.filter((p) => p.downLen > 0).length;

        const potText =
          potCount === 1
            ? "a single small white ceramic plant pot with a tapered trapezoid silhouette sits on a shelf"
            : `${potCount} small white ceramic plant pots with tapered trapezoid silhouettes sit on the shelves`;

        const parts = [];
        if (sprouting > 0) parts.push(`${sprouting === 1 ? "one holds" : `${sprouting} hold`} a rounded cluster of green foliage`);
        if (trailing > 0)
          parts.push(`${trailing === 1 ? "one holds" : `${trailing} hold`} lush trailing ivy with leafy vines cascading straight down past the shelf edges`);

        return ` ${potText}${parts.length ? ", of which " + parts.join(" and ") : ""}.`;
      }

      function generateShelfPrompt(hCount, vCount) {
        const suffix = `constructed from light-toned natural oak/birch plywood with visible subtle wood grain. The entire unit is backed by a smooth, single continuous wood backing panel. The shelf has realistic 3D depth, with soft natural sunlight coming from the upper right, casting gentle directional shadows`;
        const ending = `Clean Scandinavian aesthetic, straight-on orthographic view, ultra-realistic, neutral studio lighting against a soft off-white wall.`;
        const intro = `A direct front-facing product photograph of a modern minimalist wooden wall shelf and organizer.`;
        const decor = decorSentence();

        if (hCount + vCount > 3) {
          return `${intro} Transform each line into light-toned natural oak/birch plywood dividers and shelves with visible subtle wood grain. The compartments have realistic 3D depth, with soft natural sunlight coming from the upper right, casting gentle directional shadows inside the cubbies.${decor} ${ending}`;
        }

        const numberWords = ["zero", "one", "two", "three"];
        const dividerText = (count, type) =>
          count === 0 ? `no ${type} dividers` : count === 1 ? `a single ${type} divider` : `${numberWords[count]} ${type} dividers`;

        const isEmpty = hCount === 0 && vCount === 0;
        const structure = isEmpty
          ? "The interior is a completely hollow open-box space with no dividers or partitions"
          : `The layout features ${dividerText(hCount, "horizontal")} and ${dividerText(vCount, "vertical")}`;
        const shadowTarget = isEmpty ? "across the interior backing panel" : "inside the cubbies";

        return `${intro} ${structure}, ${suffix} ${shadowTarget}.${decor} ${ending}`;
      }

      // ── Rendering ─────────────────────────────────────────────────────────

      function render() {
        ctx.fillStyle = THEME.canvasBg;
        ctx.fillRect(0, 0, el.canvas.width, el.canvas.height);

        fillLeafAreas(root);
        if (showGuides && currentTool === "build") drawGuides(root);

        ctx.strokeStyle = THEME.lightWood;
        ctx.lineWidth = 3;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.rect(root.x + 0.5, root.y + 0.5, root.w - 1, root.h - 1);
        traceStructureLines(root);
        if (currentTool === "build") traceSplitLine(ctx);
        ctx.stroke();

        // 1. Placed pots (no hover border highlight)
        pots.forEach((p) => drawPot(ctx, p, 1));

        // 2. Plants drawn on top of all pots & structure
        pots.filter((p) => p.upSteps > 0 || p.downLen > 0).forEach((p) => drawPlant(ctx, p));

        // 3. Live drop-location preview
        if (currentTool === "pot" && potPreview) drawPot(ctx, potPreview, 0.5);
      }

      function renderDraft() {
        draftCtx.clearRect(0, 0, el.draftCanvas.width, el.draftCanvas.height);
        if (!showDraft || currentTool !== "build" || !mouse.leaf || !mouse.quad) return;

        draftCtx.save();
        draftCtx.strokeStyle = "rgba(255, 255, 255, 0.7)";
        draftCtx.lineWidth = 2;
        draftCtx.setLineDash([6, 4]);
        draftCtx.beginPath();
        traceSplitLine(draftCtx);
        draftCtx.stroke();
        draftCtx.restore();
      }

      function traceSplitLine(target) {
        const leaf = mouse.leaf;
        if (!leaf || !mouse.quad) return;

        if (mouse.quad === "N" || mouse.quad === "S") {
          const splitX = clamp(Math.round(mouse.x), leaf.x + MIN_SIZE, leaf.x + leaf.w - MIN_SIZE);
          target.moveTo(splitX + 0.5, leaf.y);
          target.lineTo(splitX + 0.5, leaf.y + leaf.h);
        } else {
          const splitY = clamp(Math.round(mouse.y), leaf.y + MIN_SIZE, leaf.y + leaf.h - MIN_SIZE);
          target.moveTo(leaf.x, splitY + 0.5);
          target.lineTo(leaf.x + leaf.w, splitY + 0.5);
        }
      }

      function fillLeafAreas(node) {
        if (isLeaf(node)) {
          ctx.fillStyle = THEME.darkWood;
          ctx.fillRect(node.x, node.y, node.w, node.h);
        } else {
          fillLeafAreas(node.left);
          fillLeafAreas(node.right);
        }
      }

      function drawGuides(node) {
        if (!isLeaf(node)) {
          drawGuides(node.left);
          drawGuides(node.right);
          return;
        }

        const { x, y, w, h } = node;

        if (node === mouse.leaf && mouse.quad) {
          ctx.fillStyle = THEME.guideHover;
          ctx.fill(getTrianglePath(node, mouse.quad));
        }

        ctx.strokeStyle = THEME.guideDash;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(x + 0.5, y + 0.5);
        ctx.lineTo(x + w - 0.5, y + h - 0.5);
        ctx.moveTo(x + w - 0.5, y + 0.5);
        ctx.lineTo(x + 0.5, y + h - 0.5);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function traceStructureLines(node) {
        if (isLeaf(node)) return;

        if (node.splitType === "v") {
          ctx.moveTo(node.splitPos + 0.5, node.y);
          ctx.lineTo(node.splitPos + 0.5, node.y + node.h);
        } else {
          ctx.moveTo(node.x, node.splitPos + 0.5);
          ctx.lineTo(node.x + node.w, node.splitPos + 0.5);
        }
        traceStructureLines(node.left);
        traceStructureLines(node.right);
      }

      // ── Pure Helpers ──────────────────────────────────────────────────────

      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

      function findLeaf(node, x, y) {
        if (!node || x < node.x || x >= node.x + node.w || y < node.y || y >= node.y + node.h) return null;
        if (isLeaf(node)) return node;

        const goLeft = node.splitType === "v" ? x < node.splitPos : y < node.splitPos;
        return findLeaf(goLeft ? node.left : node.right, x, y);
      }

      function getQuadrant(node, px, py) {
        const nx = (px - (node.x + node.w / 2)) / node.w;
        const ny = (py - (node.y + node.h / 2)) / node.h;
        return Math.abs(ny) > Math.abs(nx) ? (ny < 0 ? "N" : "S") : nx > 0 ? "E" : "W";
      }

      function getTrianglePath(node, quad) {
        const { x, y, w, h } = node;
        const corners = {
          N: [
            [x, y],
            [x + w, y],
          ],
          S: [
            [x, y + h],
            [x + w, y + h],
          ],
          W: [
            [x, y],
            [x, y + h],
          ],
          E: [
            [x + w, y],
            [x + w, y + h],
          ],
        };

        const path = new Path2D();
        path.moveTo(x + w / 2, y + h / 2);
        corners[quad].forEach(([cx, cy]) => path.lineTo(cx, cy));
        path.closePath();
        return path;
      }

      function getCanvasCoords(e) {
        const rect = el.canvas.getBoundingClientRect();
        const point = e.touches?.[0] ?? e;
        return {
          x: Math.round(((point.clientX - rect.left) * el.canvas.width) / rect.width),
          y: Math.round(((point.clientY - rect.top) * el.canvas.height) / rect.height),
        };
      }

      const offscreen = Object.assign(document.createElement("canvas"), { width: CAPTURE_SIZE, height: CAPTURE_SIZE });
      const offCtx = offscreen.getContext("2d");

      function captureCanvasJpeg() {
        offCtx.fillStyle = "#fff";
        offCtx.fillRect(0, 0, CAPTURE_SIZE, CAPTURE_SIZE);
        offCtx.drawImage(el.canvas, 0, 0, CAPTURE_SIZE, CAPTURE_SIZE);
        return offscreen.toDataURL("image/jpeg", 0.5);
      }

      function toImageSrc(img) {
        if (!img) return null;

        const mime = img.content_type ?? "image/jpeg";
        const { content } = img;

        if (typeof content === "string") {
          return content.startsWith("data:") ? content : `data:${mime};base64,${content}`;
        }

        if (content instanceof Uint8Array || content instanceof ArrayBuffer) {
          const bytes = content instanceof Uint8Array ? content : new Uint8Array(content);
          let binary = "";
          for (let i = 0; i < bytes.length; i += 0x8000) {
            binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
          }
          return `data:${mime};base64,${btoa(binary)}`;
        }

        return null;
      }

      function setStatus(text, type) {
        el.status.textContent = text;
        el.status.className = type;
      }
    </script>
  </body>
</html>
